                            ) : (
                              <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${dark ? "bg-gray-700 text-gray-400 border border-gray-600" : "bg-gray-100 text-gray-400 border border-gray-200"}`}>
                                No
                              </span>
                            )}
                          </td>

                          {/* Sent today */}
                          <td className={`px-4 py-3 text-right font-mono tabular-nums text-xs ${row.sentToday !== null ? td : txtSub}`}>
                            {row.sentToday !== null ? row.sentToday.toLocaleString() : "—"}
                          </td>

                          {/* Daily limit */}
                          <td className={`px-4 py-3 text-right font-mono tabular-nums ${row.dailyLimit !== null ? td : txtSub}`}>
                            {row.dailyLimit !== null ? row.dailyLimit.toLocaleString() : "—"}
                          </td>

                          {/* Warmup email count */}
                          <td className={`px-4 py-3 text-right font-mono tabular-nums ${
                            row.warmupCount !== null ? "text-blue-500 font-medium" : td}`}>
                            {row.warmupCount !== null ? row.warmupCount.toLocaleString() : "—"}
                          </td>

                          {/* Health score from Instantly (0–100) */}
                          <td className={`px-4 py-3 text-right font-mono tabular-nums ${hsCls}`}>
                            {hsDisplay}
                          </td>

                          {/* Health badge */}
                          <td className="px-4 py-3">
                            <HealthBadge health={row.health} />
                          </td>

                          {/* Status */}
                          <td className={`px-4 py-3 text-xs ${td}`}>
                            <span className={`capitalize px-2 py-0.5 rounded-full border text-xs font-medium ${
                              row.statusLabel === "active"
                                ? (dark ? "bg-emerald-900/30 border-emerald-700 text-emerald-400" : "bg-emerald-50 border-emerald-200 text-emerald-700")
                                : row.statusLabel === "error"
                                  ? (dark ? "bg-rose-900/30 border-rose-700 text-rose-400" : "bg-rose-50 border-rose-200 text-rose-700")
                                  : (dark ? "bg-gray-700 border-gray-600 text-gray-400" : "bg-gray-100 border-gray-200 text-gray-500")
                            }`}>
                              {row.statusLabel}
                            </span>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              <div className={`px-5 py-3 text-xs border-t ${borderLine} flex items-center justify-between ${txtSub}`}>
                <span>{visible.length} of {rows.length} accounts shown (total fetched: {data?.total ?? rows.length})</span>
                <span className="italic">
                  Health Score = Instantly's deliverability score (0–100%). Open/reply rates are campaign-level and not available per mailbox.
                </span>
              </div>
            </div>
            </>
          )}
        </div>
      );
    }

    // ══════════════════════════════════════════════════════════════════
    // INBOX PLACEMENT PAGE
    // Fetches inbox placement test results from Instantly and surfaces
    // deliverability health, ESP breakdown, spam risk alerts, and
    // actionable recommendations.
    // ══════════════════════════════════════════════════════════════════
    // ═══════════════════════════════════════════════════════════════════
    // DELIVERABILITY REPORT ENGINE
    // Scoring logic by a 20yr email deliverability expert.
    // Aggregates per sender email, scores health, categorises into
    // Keep / Monitor / Kill, then writes a multi-sheet .xlsx file.
    // ═══════════════════════════════════════════════════════════════════
    function generateDeliverabilityReport(testName, allRecords, senderDateMap = {}, accountName = "") {
      if (!allRecords || allRecords.length === 0) return;

      // ── 1. Aggregate per sender email ─────────────────────────────
      const senderMap = {};
      allRecords.forEach(r => {
        const key = r.sender_email || "unknown";
        if (!senderMap[key]) {
          senderMap[key] = {
            senderEmail: key,
            // Priority: senderDateMap (from /api/email-accounts, most reliable)
            // → sender_date_added (from records backend)
            // → record timestamp (last-resort proxy)
            dateAddedRaw: senderDateMap[key] || r.sender_date_added || r.timestamp || null,
            total: 0, inbox: 0, spam: 0, promo: 0,
            spfPass: 0, dkimPass: 0, dmarcPass: 0, blacklisted: 0,
          };
        }
        const s = senderMap[key];
        s.total++;
        if (r.placement === "Inbox")           s.inbox++;
        else if (r.placement === "Spam")       s.spam++;
        else if (r.placement === "Promotions") s.promo++;
        if (r.spf_pass)    s.spfPass++;
        if (r.dkim_pass)   s.dkimPass++;
        if (r.dmarc_pass)  s.dmarcPass++;
        if (r.blacklisted) s.blacklisted++;
        // Upgrade to better date source if available
        if (!s._hasSenderDate) {
          const betterDate = senderDateMap[key] || r.sender_date_added;
          if (betterDate) { s.dateAddedRaw = betterDate; s._hasSenderDate = true; }
        }
      });

      // ── 2. Score & categorise ─────────────────────────────────────
      // Expert thresholds:
      //   KILL    spam ≥ 20%  |  blacklist > 10%  |  spam ≥ 10% & inbox < 70%
      //           spam ≥ 15%  AND DMARC fail > 20%
      //   MONITOR spam 5-19%  |  any blacklist  |  auth fail > 10%  |  inbox < 90%
      //   KEEP    spam < 5%   |  inbox ≥ 90%   |  auth mostly clean

      const pct = (n, d) => d > 0 ? (n / d) * 100 : 0;

      const senders = Object.values(senderMap).map(s => {
        const n = s.total;
        const inboxPct    = pct(s.inbox,       n);
        const spamPct     = pct(s.spam,        n);
        const promoPct    = pct(s.promo,       n);
        const spfPassPct  = pct(s.spfPass,     n);
        const dkimPassPct = pct(s.dkimPass,    n);
        const dmarcPassPct= pct(s.dmarcPass,   n);
        const blPct       = pct(s.blacklisted, n);
        const spfFailPct  = 100 - spfPassPct;
        const dkimFailPct = 100 - dkimPassPct;
        const dmarcFailPct= 100 - dmarcPassPct;

        // Health score 0-100 (weighted deductions)
        let health = 100;
        health -= spamPct  * 3.0;          // spam is the killer
        health -= blPct    * 5.0;          // blacklist hits hard
        health -= spfFailPct  * 0.25;
        health -= dkimFailPct * 0.25;
        health -= dmarcFailPct* 0.25;
        health -= Math.max(0, 90 - inboxPct) * 0.5;
        health = Math.max(0, Math.min(100, Math.round(health)));

        // Category decision tree
        let category, action;
        const reasons = [];

        const isKill =
          spamPct >= 20 ||
          blPct   > 10  ||
          (spamPct >= 15 && dmarcFailPct > 20) ||
          (spamPct >= 10 && inboxPct < 70);

        const isMonitor =
          spamPct >= 5   ||
          s.blacklisted > 0 ||
          spfFailPct  > 10  ||
          dkimFailPct > 10  ||
          dmarcFailPct > 10 ||
          inboxPct < 90;

        if (isKill) {
          category = "Kill";
          action   = "Remove immediately from all active sequences. Domain warm-up required before re-use (min. 6 weeks).";
          if (spamPct >= 20)                        reasons.push(`Spam rate ${spamPct.toFixed(1)}% — well above the 20% kill threshold`);
          if (blPct > 10)                           reasons.push(`SMTP blacklisted on ${blPct.toFixed(1)}% of sends`);
          if (spamPct >= 15 && dmarcFailPct > 20)   reasons.push(`DMARC failing ${dmarcFailPct.toFixed(1)}% + spam ${spamPct.toFixed(1)}% — authentication collapse`);
          if (spamPct >= 10 && inboxPct < 70)       reasons.push(`Only ${inboxPct.toFixed(1)}% inbox despite ${spamPct.toFixed(1)}% spam — sender reputation critically damaged`);
        } else if (isMonitor) {
          category = "Monitor";
          action   = "Reduce daily volume by 50%. Re-test after 7 days. Fix authentication issues immediately.";
          if (spamPct >= 5)     reasons.push(`Spam rate ${spamPct.toFixed(1)}% — above the 5% warning threshold`);
          if (s.blacklisted > 0)reasons.push(`${s.blacklisted} email(s) hit SMTP blacklists — monitor IP/domain reputation`);
          if (spfFailPct  > 10) reasons.push(`SPF failing on ${spfFailPct.toFixed(1)}% of sends — check DNS SPF record`);
          if (dkimFailPct > 10) reasons.push(`DKIM failing on ${dkimFailPct.toFixed(1)}% — re-generate and republish DKIM keys`);
          if (dmarcFailPct> 10) reasons.push(`DMARC failing on ${dmarcFailPct.toFixed(1)}% — ensure SPF/DKIM alignment`);
          if (inboxPct < 90 && spamPct < 5) reasons.push(`Inbox rate ${inboxPct.toFixed(1)}% below 90% target — content or list quality issue`);
        } else {
          category = "Keep";
          action   = "Continue using. Inbox rate is excellent — safe to scale volume gradually (no more than +20%/week).";
          reasons.push(`Inbox ${inboxPct.toFixed(1)}% | Spam ${spamPct.toFixed(1)}% — both within healthy ranges`);
          if (spfPassPct === 100 && dkimPassPct === 100 && dmarcPassPct === 100)
            reasons.push("Perfect authentication: SPF, DKIM and DMARC all passing at 100%");
          if (s.blacklisted === 0)
            reasons.push("Zero SMTP blacklist hits — IP and domain reputation intact");
        }

        const firstDate = s.dateAddedRaw
          ? new Date(s.dateAddedRaw).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" })
          : "—";

        return {
          senderEmail: s.senderEmail,
          firstDate,
          total: s.total, inbox: s.inbox, spam: s.spam, promo: s.promo,
          spfPass: s.spfPass, dkimPass: s.dkimPass, dmarcPass: s.dmarcPass,
          blacklisted: s.blacklisted,
          inboxPct, spamPct, promoPct,
          spfPassPct, dkimPassPct, dmarcPassPct, blPct,
          spfFailPct, dkimFailPct, dmarcFailPct,
          health, category, action,
          notes: reasons.join(" | "),
        };
      }).sort((a, b) => a.health - b.health); // worst-first within each sheet

      const keepList    = senders.filter(s => s.category === "Keep");
      const monitorList = senders.filter(s => s.category === "Monitor");
      const killList    = senders.filter(s => s.category === "Kill");

      // ── 3. Build workbook ─────────────────────────────────────────
      const WB = XLSX.utils.book_new();
      const f1  = v => v != null ? v.toFixed(1) + "%" : "—";
      const f0  = v => v != null ? v.toFixed(0) + "%" : "—";

      // ── Sheet 1: Executive Summary ───────────────────────────────
      const totalEmails  = allRecords.length;
      const globalInboxPct = pct(allRecords.filter(r => r.placement === "Inbox").length, totalEmails);
      const globalSpamPct  = pct(allRecords.filter(r => r.placement === "Spam").length, totalEmails);
      const summaryData = [
        ["INBOX PLACEMENT DELIVERABILITY REPORT"],
        [""],
        ["Generated",             new Date().toLocaleString()],
        ["Test Name",             testName],
        ["Total Emails Analysed", totalEmails],
        ["Overall Inbox Rate",    f1(globalInboxPct)],
        ["Overall Spam Rate",     f1(globalSpamPct)],
        ["Unique Sender Emails",  senders.length],
        [""],
        ["SENDER VERDICT BREAKDOWN", "", ""],
        ["Category",       "Count", "% of Senders"],
        ["✅ Keep & Use",  keepList.length,    f1(pct(keepList.length, senders.length))],
        ["⚠️  Monitor",    monitorList.length, f1(pct(monitorList.length, senders.length))],
        ["🚫 Kill",        killList.length,    f1(pct(killList.length, senders.length))],
        [""],
        ["EXPERT SCORING THRESHOLDS"],
        ["Kill",    "Spam ≥ 20%  |  SMTP blacklisted > 10%  |  Spam ≥ 15% + DMARC fail > 20%  |  Spam ≥ 10% + inbox < 70%"],
        ["Monitor", "Spam 5–19%  |  Any blacklist hit  |  Auth failure > 10%  |  Inbox < 90%"],
        ["Keep",    "Spam < 5%   |  Inbox ≥ 90%  |  Auth mostly clean  |  Zero blacklist issues"],
        [""],
        ["HEALTH SCORE FORMULA"],
        ["100 pts base — deductions:"],
        ["", "Spam rate",       "×3.0 per %"],
        ["", "Blacklist rate",  "×5.0 per %"],
        ["", "SPF fail rate",   "×0.25 per %"],
        ["", "DKIM fail rate",  "×0.25 per %"],
        ["", "DMARC fail rate", "×0.25 per %"],
        ["", "Inbox < 90%",     "×0.5 per % below target"],
      ];
      XLSX.utils.book_append_sheet(WB, XLSX.utils.aoa_to_sheet(summaryData), "📋 Summary");

      // ── Shared row builder ────────────────────────────────────────
      const HEADER = [
        "Sender Email", "First Seen in Test",
        "Emails Tested", "Inbox", "Inbox %", "Spam", "Spam %", "Promo", "Promo %",
        "SPF Pass", "SPF Pass %", "DKIM Pass", "DKIM Pass %", "DMARC Pass", "DMARC Pass %",
        "SMTP Blacklist Hits", "Blacklist %",
        "Health Score (/100)", "Category", "Recommended Action", "Expert Notes",
      ];
      const toRow = s => [
        s.senderEmail, s.firstDate,
        s.total, s.inbox, f1(s.inboxPct), s.spam, f1(s.spamPct), s.promo, f1(s.promoPct),
        s.spfPass,  f1(s.spfPassPct),
        s.dkimPass, f1(s.dkimPassPct),
        s.dmarcPass,f1(s.dmarcPassPct),
        s.blacklisted, f1(s.blPct),
        s.health, s.category, s.action, s.notes,
      ];

      // ── Sheet 2: Keep ────────────────────────────────────────────
      XLSX.utils.book_append_sheet(WB,
        XLSX.utils.aoa_to_sheet([HEADER, ...keepList.sort((a,b) => b.health - a.health).map(toRow)]),
        "✅ Keep & Use");

      // ── Sheet 3: Monitor ─────────────────────────────────────────
      XLSX.utils.book_append_sheet(WB,
        XLSX.utils.aoa_to_sheet([HEADER, ...monitorList.map(toRow)]),
        "⚠️ Monitor");

      // ── Sheet 4: Kill ─────────────────────────────────────────────
      XLSX.utils.book_append_sheet(WB,
        XLSX.utils.aoa_to_sheet([HEADER, ...killList.map(toRow)]),
        "🚫 Kill");

      // ── Sheet 5: All Records (raw) ────────────────────────────────
      const recHeader = ["Date","Recipient Email","Recipient ESP","Sender Email","Sender Date Added","Delivered To","SMTP Blacklist","SPF","DKIM","DMARC"];
      const fmtDateXlsx = raw => raw
        ? new Date(raw).toLocaleDateString("en-GB", { day:"2-digit", month:"short", year:"numeric" })
        : "";
      const recRows   = allRecords.map(r => [
        r.timestamp ? new Date(r.timestamp).toLocaleString("en-GB", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" }) : "",
        r.recipient_email, r.recipient_esp, r.sender_email,
        senderDateMap[r.sender_email] || fmtDateXlsx(r.sender_date_added),
        r.placement,
        r.blacklisted ? "Listed" : "Clean",
        r.spf_pass  ? "Pass" : "Fail",
        r.dkim_pass ? "Pass" : "Fail",
        r.dmarc_pass? "Pass" : "Fail",
      ]);
      XLSX.utils.book_append_sheet(WB,
        XLSX.utils.aoa_to_sheet([recHeader, ...recRows]),
        "📧 All Records");

      // ── 4. Download ───────────────────────────────────────────────
      const safeName  = testName.replace(/[^a-z0-9]/gi, "_").toLowerCase();
      const safeAcct  = accountName ? "_" + accountName.replace(/[^a-z0-9]/gi, "_").toLowerCase() : "";
      const dateStr   = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(WB, `deliverability-report${safeAcct}_${safeName}_${dateStr}.xlsx`);
    }

    function InboxPlacementPage({ dark, connected, selectedAcc, card, input, th, td, startDate, endDate }) {
      const [data,        setData]      = useState(null);
      const [loading,     setLoading]   = useState(false);
      const [error,       setError]     = useState(null);
      const [activeTab,   setActiveTab] = useState("overview"); // overview | accounts | tests | alerts
      const [fSeverity,   setFSeverity] = useState("all");
      const [fEsp,        setFEsp]      = useState("all");
      const [fSearch,     setFSearch]   = useState("");
      const [showRec,     setShowRec]   = useState(null); // alert idx with expanded recs
      // ── Per-test expandable rows ────────────────────────────────
      const [expandedTest,      setExpandedTest]      = useState(null);   // test id currently open
      const [testRecordsMap,    setTestRecordsMap]    = useState({});      // { [testId]: "loading" | records[] | "error:msg" }
      const [testRecordsTabMap, setTestRecordsTabMap] = useState({});      // { [testId]: "all"|"inbox"|"spam"|"promo" }
      // ── Sender date map: email → "DD Mon YYYY" ───────────────────
      // Built by fetching /api/email-accounts (same endpoint as the Email Accounts
      // page, which already handles all field-name variations correctly).
      const [senderDateMap, setSenderDateMap] = useState({});
      const AUTO_REFRESH = 300;
      const [countdown,   setCountdown] = useState(AUTO_REFRESH);

      const txtSub    = dark ? "text-gray-400" : "text-gray-500";
      const borderCls = dark ? "border-gray-700" : "border-gray-200";

      // ── Fetch ──────────────────────────────────────────────────────
      const loadRef = useRef(null);
      loadRef.current = async () => {
        if (!connected || !selectedAcc) return;
        setLoading(true); setError(null);
        try {
          let url = `/api/inbox-placement?account_id=${encodeURIComponent(selectedAcc.id)}`;
          if (startDate && endDate) url += `&start_date=${encodeURIComponent(toISO(startDate))}&end_date=${encodeURIComponent(toISO(endDate))}`;
          const r  = await fetch(url);
          const ct = r.headers.get("content-type") || "";
          if (!ct.includes("application/json")) throw new Error("Server returned HTML — restart app.js");
          const json = await r.json();
          if (json.error) throw new Error(json.error);
          setData(json);
        } catch (e) { setError(e.message); }
        finally { setLoading(false); }
      };
      const load = useCallback(() => loadRef.current?.(), []);

      const refreshRef = useRef(load);
      useEffect(() => { refreshRef.current = load; }, [load]);

      // ── Per-test record fetch ──────────────────────────────────────
      const fetchRecordsRef = useRef(null);
      fetchRecordsRef.current = async (testId) => {
        if (!selectedAcc) return;
        // Don't re-fetch if already loaded or currently loading
        const cur = testRecordsMap[testId];
        if (cur && cur !== "loading") return;
        setTestRecordsMap(prev => ({ ...prev, [testId]: "loading" }));
        try {
          const r = await fetch(`/api/inbox-placement-records?account_id=${encodeURIComponent(selectedAcc.id)}&test_id=${encodeURIComponent(testId)}`);
          const ct = r.headers.get("content-type") || "";
          if (!ct.includes("application/json")) throw new Error("Server returned HTML — restart app.js");
          const json = await r.json();
          if (json.error) throw new Error(json.error);
          setTestRecordsMap(prev => ({ ...prev, [testId]: json.records || [] }));
        } catch (e) {
          setTestRecordsMap(prev => ({ ...prev, [testId]: `error:${e.message}` }));
        }
      };
      const fetchTestRecords = useCallback((testId) => fetchRecordsRef.current?.(testId), []);

      const toggleExpandedTest = (testId) => {
        if (expandedTest === testId) {
          setExpandedTest(null);
        } else {
          setExpandedTest(testId);
          fetchTestRecords(testId);
        }
      };

      // Initial load + auto-refresh
      useEffect(() => {
        if (connected && selectedAcc) refreshRef.current();
        const tick = setInterval(() => {
          setCountdown(c => {
            if (c <= 1) { refreshRef.current(); return AUTO_REFRESH; }
            return c - 1;
          });
        }, 1000);
        return () => clearInterval(tick);
      }, [selectedAcc?.id, connected]); // eslint-disable-line react-hooks/exhaustive-deps

      // Re-fetch on date change
      useEffect(() => {
        if (connected && selectedAcc) { load(); setCountdown(AUTO_REFRESH); }
      }, [startDate, endDate]); // eslint-disable-line react-hooks/exhaustive-deps

      // ── Build sender date map from /api/email-accounts ────────────
      // This reuses the proven Email Accounts endpoint which correctly
      // normalises all Instantly field-name variations. We scan every
      // field on each account looking for an ISO-date-like value so the
      // code is resilient to API field renames.
      useEffect(() => {
        if (!connected || !selectedAcc) return;
        (async () => {
          try {
            const r  = await fetch(`/api/email-accounts?account_id=${encodeURIComponent(selectedAcc.id)}`);
            const ct = r.headers.get("content-type") || "";
            if (!ct.includes("application/json")) return;
            const json = await r.json();
            const accs = Array.isArray(json.emailAccounts) ? json.emailAccounts : [];

            // Helper: find the first date-like value in a plain object,
            // trying known field names first then scanning all values.
            const extractDate = (obj) => {
              const known = [
                "timestamp_created","created_at","date_created","creation_date",
                "createdAt","timestamp","date_added","added_at","registered_at",
                "setup_date","account_created","created","added","join_date",
              ];
              for (const f of known) {
                if (obj[f]) {
                  const d = new Date(obj[f]);
                  if (!isNaN(d) && d.getFullYear() > 2000 && d.getFullYear() < 2050) return obj[f];
                }
              }
              // Fallback: scan all string/number values for ISO date patterns
              for (const [, v] of Object.entries(obj)) {
                if (typeof v === "string" && /^\d{4}-\d{2}-\d{2}/.test(v)) {
                  const d = new Date(v);
                  if (!isNaN(d) && d.getFullYear() > 2000 && d.getFullYear() < 2050) return v;
                }
                if (typeof v === "number" && v > 1_000_000_000 && v < 9_999_999_999) {
                  // Unix epoch seconds
                  const d = new Date(v * 1000);
                  if (!isNaN(d) && d.getFullYear() > 2000 && d.getFullYear() < 2050) return d.toISOString();
                }
              }
              return null;
            };

            const map = {};
            accs.forEach(ea => {
              const email = ea.email || ea.address || ea.from_address;
              if (!email) return;
              const raw = extractDate(ea);
              if (raw) {
                map[email] = new Date(raw).toLocaleDateString("en-GB", {
                  day: "2-digit", month: "short", year: "numeric",
                });
              }
            });
            console.log(`[inbox-placement] senderDateMap built: ${Object.keys(map).length} entries`);
            setSenderDateMap(map);
          } catch (e) {
            console.warn("[inbox-placement] senderDateMap fetch failed:", e.message);
          }
        })();
      }, [selectedAcc?.id, connected]); // eslint-disable-line react-hooks/exhaustive-deps

      // ── Derived data ───────────────────────────────────────────────
      const summary     = data?.summary     || {};
      const accounts    = data?.accounts    || [];
      const tests       = data?.tests       || [];
      const espBreakdown= data?.espBreakdown|| [];
      const allAlerts   = data?.alerts      || [];

      const uniqueEsps = useMemo(() => ["all", ...Array.from(new Set(espBreakdown.map(e => e.esp).filter(Boolean))).sort()], [espBreakdown]);

      const visibleAlerts = useMemo(() => {
        let a = [...allAlerts];
        if (fSeverity !== "all") a = a.filter(x => x.severity === fSeverity);
        if (fSearch) {
          const q = fSearch.toLowerCase();
          a = a.filter(x => (x.email||"").toLowerCase().includes(q) || (x.issue||"").toLowerCase().includes(q));
        }
        return a;
      }, [allAlerts, fSeverity, fSearch]);

      const visibleAccounts = useMemo(() => {
        let a = [...accounts];
        if (fSearch) { const q = fSearch.toLowerCase(); a = a.filter(x => (x.email||"").toLowerCase().includes(q)); }
        if (fEsp !== "all") a = a.filter(x => x.espRows?.some(e => e.esp === fEsp));
        return a;
      }, [accounts, fSearch, fEsp]);

      // ── Pie chart data ─────────────────────────────────────────────
      const pieData = [
        { name: "Inbox",      value: Math.round(summary.avg_inbox    || 0), fill: "#10b981" },
        { name: "Spam",       value: Math.round(summary.avg_spam     || 0), fill: "#f43f5e" },

          a.inboxPct.toFixed(1), a.spamPct.toFixed(1), a.categoryPct.toFixed(1), a.status,

        const csv  = [cols.join(","), ...rows].join("\n");
        const blob = new Blob([csv], { type: "text/csv" });

        const el   = document.createElement("a");
        el.href = url; el.download = `inbox_placement_${(selectedAcc?.name||"").replace(/[^a-z0-9]/gi,"_").toLowerCase()}_${new Date().toISOString().slice(0,10)}.csv`;

                          <tr><td colSpan="9" className={`px-4 py-8 text-center text-sm ${txtSub}`}>No tests found.</td></tr>
                        ) : tests.map((t, i) => {
                          const isOpen = expandedTest === t.id;
                          const rowBg = t.status === "critical"
                            ? (dark ? "bg-rose-900/20"  : "bg-rose-50/60")
                            : t.status === "warning"
                              ? (dark ? "bg-amber-900/15" : "bg-amber-50/40")
                              : (dark ? (i%2===0?"bg-gray-800":"") : (i%2===0?"bg-white":"bg-gray-50/40"));

                          // Records for this test
                          const recState  = testRecordsMap[t.id];
                          const recTab    = testRecordsTabMap[t.id] || "all";
                          const recArray  = Array.isArray(recState) ? recState : [];
                          const recLoading= recState === "loading";
                          const recError  = typeof recState === "string" && recState.startsWith("error:") ? recState.slice(6) : null;

                          const inboxRecs = recArray.filter(r => r.placement === "Inbox");
                          const spamRecs  = recArray.filter(r => r.placement === "Spam");
                          const promoRecs = recArray.filter(r => r.placement === "Promotions");
                          const visRecs   = recTab === "inbox" ? inboxRecs
                            : recTab === "spam"  ? spamRecs
                            : recTab === "promo" ? promoRecs
                            : recArray;

                          const setRecTab = (tab) => setTestRecordsTabMap(prev => ({ ...prev, [t.id]: tab }));

                          const PassIcon = ({ ok }) => ok
                            ? <span className="text-emerald-500 font-bold">✓</span>
                            : <span className="text-rose-500 font-bold">✗</span>;

                          const PlacementBadge = ({ p }) => {
                            const cfg = p === "Spam"
                              ? "bg-rose-100 text-rose-700 border-rose-200"
                              : p === "Promotions"
                                ? "bg-amber-100 text-amber-700 border-amber-200"
                                : "bg-emerald-100 text-emerald-700 border-emerald-200";
                            return <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold border ${cfg}`}>{p}</span>;
                          };

                          return (
                            <React.Fragment key={t.id}>
                              {/* ── Summary row (clickable) ── */}
                              <tr
                                className={`border-b ${borderCls} ${rowBg} cursor-pointer select-none hover:opacity-80 transition-opacity`}
                                onClick={() => toggleExpandedTest(t.id)}
                              >
                                <td className="px-3 py-3 text-center">
                                  <span className={`inline-block transition-transform duration-200 ${isOpen ? "rotate-90" : ""} ${txtSub}`}>▶</span>
                                </td>
                                <td className={`px-4 py-3 font-medium text-xs max-w-[160px] truncate ${td}`} title={t.name}>{t.name}</td>
                                <td className={`px-4 py-3 text-xs max-w-[160px] truncate ${td}`} title={t.senderEmail}>{t.senderEmail}</td>
                                <td className={`px-4 py-3 text-xs ${td}`}>{t.createdAt ? new Date(t.createdAt).toLocaleDateString() : "—"}</td>
                                <td className={`px-4 py-3 text-center tabular-nums text-xs ${td}`}>{(t.total||0).toLocaleString()}</td>
                                <td className={`px-4 py-3 min-w-[110px] ${td}`}>{pctBar(t.inboxPct,    "bg-emerald-500")}</td>
                                <td className={`px-4 py-3 min-w-[110px] ${td}`}>{pctBar(t.spamPct,     "bg-rose-500")}</td>
                                <td className={`px-4 py-3 min-w-[110px] ${td}`}>{pctBar(t.categoryPct, "bg-amber-400")}</td>
                                <td className="px-4 py-3"><StatusBadge s={t.status} /></td>
                              </tr>

                              {/* ── Expanded records panel ── */}
                              {isOpen && (
                                <tr className={`border-b ${borderCls}`}>
                                  <td colSpan="9" className={`p-0 ${dark ? "bg-gray-900/60" : "bg-slate-50/80"}`}>
                                    <div className="px-5 py-4">

                                      {/* Filter tabs + summary counts */}
                                      <div className="flex items-center gap-3 mb-3 flex-wrap">
                                        {[
                                          { key: "all",   label: `All (${recArray.length})` },
                                          { key: "inbox", label: `✅ Inbox (${inboxRecs.length})` },
                                          { key: "spam",  label: `🚫 Spam (${spamRecs.length})` },
                                          { key: "promo", label: `📂 Promotions (${promoRecs.length})` },
                                        ].map(tab => (
                                          <button key={tab.key}
                                            onClick={e => { e.stopPropagation(); setRecTab(tab.key); }}
                                            className={`px-3 py-1 rounded-lg text-xs font-semibold border transition-colors ${recTab === tab.key
                                              ? "bg-indigo-600 border-indigo-600 text-white"
                                              : (dark ? "border-gray-600 text-gray-300 hover:bg-gray-700" : "border-gray-300 text-gray-600 hover:bg-gray-100")}`}>
                                            {tab.label}
                                          </button>
                                        ))}
                                        {recLoading && <span className={`text-xs ${txtSub}`}>⏳ Loading records…</span>}
                                        {!recLoading && !recError && Array.isArray(recState) && (
                                          <div className="ml-auto flex items-center gap-2">
                                            {/* Deliverability Report */}
                                            <button onClick={e => {
                                              e.stopPropagation();
                                              generateDeliverabilityReport(t.name, recArray, senderDateMap, selectedAcc?.name || "");
                                            }}
                                            className={`flex items-center gap-1 text-xs font-semibold px-2.5 py-1 rounded-lg border transition-colors ${dark ? "border-violet-700 text-violet-400 hover:bg-violet-900/30" : "border-violet-300 text-violet-700 hover:bg-violet-50"}`}>
                                              📊 Generate Report
                                            </button>
                                            {/* CSV Export */}
                                            <button onClick={e => {
                                              e.stopPropagation();
                                              const rows = recArray; // always export ALL records, not just the filtered view
                                              if (!rows.length) return;
                                              const headers = ["Date","Recipient Email","Recipient ESP","Sender Email","Sender Date Added","Delivered To","SMTP Blacklist","SPF Pass","DKIM Pass","DMARC Pass"];
                                              const escape = v => {
                                                const s = v == null ? "" : String(v);
                                                return s.includes(",") || s.includes('"') || s.includes("\n") ? `"${s.replace(/"/g,'""')}"` : s;
                                              };
                                              const fmtDate = raw => raw
                                                ? new Date(raw).toLocaleDateString("en-GB", { day:"2-digit", month:"short", year:"numeric" })
                                                : "";
                                              const csvRows = [
                                                headers.join(","),
                                                ...rows.map(r => [
                                                  escape(r.timestamp ? new Date(r.timestamp).toLocaleString([], { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" }) : ""),
                                                  escape(r.recipient_email),
                                                  escape(r.recipient_esp),
                                                  escape(r.sender_email),
                                                  escape(senderDateMap[r.sender_email] || fmtDate(r.sender_date_added)),
                                                  escape(r.placement),
                                                  escape(r.blacklisted ? "Listed" : "Clean"),
                                                  escape(r.spf_pass  ? "Pass" : "Fail"),
                                                  escape(r.dkim_pass ? "Pass" : "Fail"),
                                                  escape(r.dmarc_pass? "Pass" : "Fail"),
                                                ].join(","))
                                              ];
                                              const blob = new Blob([csvRows.join("\n")], { type: "text/csv;charset=utf-8;" });
                                              const url  = URL.createObjectURL(blob);
                                              const a    = document.createElement("a");
                                              a.href = url;
                                              a.download = `inbox-placement-${(selectedAcc?.name||"").replace(/[^a-z0-9]/gi,"_").toLowerCase()}-${t.name.replace(/[^a-z0-9]/gi,"_").toLowerCase()}-${new Date().toISOString().slice(0,10)}.csv`;
                                              a.click();
                                              URL.revokeObjectURL(url);
                                            }}
                                            className={`flex items-center gap-1 text-xs font-semibold px-2.5 py-1 rounded-lg border transition-colors ${dark ? "border-emerald-700 text-emerald-400 hover:bg-emerald-900/30" : "border-emerald-300 text-emerald-700 hover:bg-emerald-50"}`}>
                                              ⬇ Export CSV
                                            </button>
                                            {/* Refresh */}
                                            <button onClick={e => { e.stopPropagation(); setTestRecordsMap(prev => ({ ...prev, [t.id]: undefined })); fetchTestRecords(t.id); }}
                                              className={`text-xs ${txtSub} hover:underline`}>↺ Refresh</button>
                                          </div>
                                        )}
                                      </div>

                                      {/* Error state */}
                                      {recError && (
                                        <div className="text-xs text-rose-500 py-3">Error: {recError}</div>
                                      )}

                                      {/* Loading spinner */}
                                      {recLoading && (
                                        <div className={`text-xs text-center py-6 ${txtSub}`}>
                                          <div className="inline-block w-5 h-5 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin mb-2"></div>
                                          <div>Fetching email records…</div>
                                        </div>
                                      )}

                                      {/* Records table */}
                                      {!recLoading && !recError && Array.isArray(recState) && (
                                        visRecs.length === 0 ? (
                                          <div className={`text-xs text-center py-4 ${txtSub}`}>No records found for this filter.</div>
                                        ) : (
                                          <div className="overflow-x-auto rounded-xl border" style={{ borderColor: dark ? "#374151" : "#e5e7eb" }}>
                                            <table className="w-full text-xs">
                                              <thead>
                                                <tr className={`border-b ${borderCls} ${dark ? "bg-gray-800" : "bg-gray-100"}`}>
                                                  {["Date","Recipient Email","Sender Email","Date Added","Delivered To","SMTP Blacklist","SPF","DKIM","DMARC"].map(h => (
                                                    <th key={h} className={`px-3 py-2 text-left font-semibold uppercase tracking-wider whitespace-nowrap ${th}`}>{h}</th>
                                                  ))}
                                                </tr>
                                              </thead>
                                              <tbody>
                                                {visRecs.map((rec, ri) => (
                                                  <tr key={rec.id || ri} className={`border-b ${borderCls} ${dark ? (ri%2===0?"bg-gray-800/50":"") : (ri%2===0?"bg-white":"bg-gray-50/40")}`}>
                                                    <td className={`px-3 py-2 whitespace-nowrap ${td}`}>
                                                      {rec.timestamp ? new Date(rec.timestamp).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—"}
                                                    </td>
                                                    <td className={`px-3 py-2 max-w-[180px] truncate ${td}`} title={rec.recipient_email}>
                                                      <span>{rec.recipient_email}</span>
                                                      {rec.recipient_esp && rec.recipient_esp !== "Unknown" && (
                                                        <span className={`ml-1.5 text-xs px-1.5 py-0.5 rounded ${dark ? "bg-gray-700 text-gray-300" : "bg-gray-200 text-gray-600"}`}>{rec.recipient_esp}</span>
                                                      )}
                                                    </td>
                                                    <td className={`px-3 py-2 max-w-[160px] truncate ${td}`} title={rec.sender_email}>{rec.sender_email}</td>
                                                    <td className={`px-3 py-2 whitespace-nowrap text-xs ${(senderDateMap[rec.sender_email] || rec.sender_date_added) ? td : txtSub}`}>
                                                      {senderDateMap[rec.sender_email]
                                                        || (rec.sender_date_added
                                                            ? new Date(rec.sender_date_added).toLocaleDateString("en-GB", { day:"2-digit", month:"short", year:"numeric" })
                                                            : "—")}
                                                    </td>
                                                    <td className="px-3 py-2"><PlacementBadge p={rec.placement} /></td>
                                                    <td className="px-3 py-2 text-center">
                                                      {rec.blacklisted
                                                        ? <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold bg-rose-100 text-rose-700 border border-rose-200">Listed</span>
                                                        : <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700 border border-emerald-200">Clean</span>
                                                      }
                                                    </td>
                                                    <td className="px-3 py-2 text-center"><PassIcon ok={rec.spf_pass} /></td>
                                                    <td className="px-3 py-2 text-center"><PassIcon ok={rec.dkim_pass} /></td>
                                                    <td className="px-3 py-2 text-center"><PassIcon ok={rec.dmarc_pass} /></td>
                                                  </tr>
                                                ))}
                                              </tbody>
                                            </table>
                                          </div>
                                        )
                                      )}
                                    </div>
                                  </td>
                                </tr>
                              )}
                            </React.Fragment>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                  <div className={`px-5 py-3 text-xs border-t ${borderCls} ${txtSub}`}>
                    {tests.length} test{tests.length !== 1 ? "s" : ""} total — click a row to see individual email records
                  </div>
                </div>
              )}

              {/* ══ TAB: ALERTS ════════════════════════════════════════ */}
              {activeTab === "alerts" && (
                <div className="space-y-3">
                  {visibleAlerts.length === 0 ? (
                    <div className={`rounded-2xl border p-10 text-center ${card}`}>
                      <div className="text-3xl mb-2">✅</div>
                      <p className={`font-semibold ${dark ? "text-white" : "text-gray-800"}`}>No alerts match your filters</p>
                    </div>
                  ) : visibleAlerts.map((alert, i) => (
                    <div key={i} className={`rounded-2xl border overflow-hidden ${card}`}>
                      <div className="p-4 flex items-start gap-4">
                        <SevBadge s={alert.severity} />
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center gap-3 flex-wrap">
                            <p className={`text-sm font-semibold ${dark ? "text-white" : "text-gray-900"}`}>{alert.email}</p>
                            <span className={`text-xs ${txtSub}`}>{alert.issue}</span>
                          </div>
                          <div className="flex items-center gap-4 mt-2 flex-wrap">
                            <span className={`text-xs ${txtSub}`}>Inbox: <span className="font-semibold text-emerald-500">{alert.inboxPct.toFixed(1)}%</span></span>
                            <span className={`text-xs ${txtSub}`}>Spam: <span className="font-semibold text-rose-500">{alert.spamPct.toFixed(1)}%</span></span>
                            <span className={`text-xs ${txtSub}`}>Promo: <span className="font-semibold text-amber-500">{alert.categoryPct.toFixed(1)}%</span></span>
                          </div>
                        </div>
                        <button onClick={() => setShowRec(showRec === i ? null : i)}
                          className={`flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-lg border transition-colors shrink-0 ${showRec === i
                            ? "bg-indigo-600 border-indigo-600 text-white"
                            : (dark ? "border-gray-600 text-indigo-400 hover:bg-gray-700" : "border-indigo-200 text-indigo-600 hover:bg-indigo-50")}`}>
                          💡 {showRec === i ? "Hide" : "Recommendations"}
                        </button>
                      </div>
                      {showRec === i && alert.recommendations?.length > 0 && (
                        <div className={`px-4 pb-4 border-t ${borderCls} pt-3`}>
                          <p className={`text-xs font-semibold mb-2 ${dark ? "text-gray-300" : "text-gray-600"}`}>Recommended Actions:</p>
                          <ul className="space-y-1.5">
                            {alert.recommendations.map((rec, ri) => (
                              <li key={ri} className={`flex items-start gap-2 text-xs ${txtSub}`}>
                                <span className="text-indigo-500 font-bold mt-0.5">→</span>
                                {rec}
                              </li>
                            ))}
                          </ul>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              )}

            </>
          )}
        </div>
      );
    }

    // ══════════════════════════════════════════════════════════════════
    // MASTER DASHBOARD PAGE
    // Cross-account unified view: global alerts, account health overview,
    // and performance summary cards across ALL saved accounts.
    // ══════════════════════════════════════════════════════════════════
    function MasterDashboardPage({ dark, card, input, th, td, onNavigateToCampaign, startDate, endDate }) {
      const [summary,       setSummary]       = useState(null);
      const [alertsData,    setAlertsData]    = useState(null);
      const [loading,       setLoading]       = useState(false);
      const [alertsLoading, setAlertsLoading] = useState(false);
      const [error,         setError]         = useState(null);
      const [alertFilter,    setAlertFilter]   = useState("all"); // all | critical | warning
      const [alertSort,      setAlertSort]     = useState("severity");
      const [showAlertFilters, setShowAlertFilters] = useState(false);

      // ── Advanced alert filter state ───────────────────────────────
      const [fASearch,     setFASearch]    = useState("");    // campaign/account text
      const [fAAccount,    setFAAccount]   = useState("all"); // specific account
      const [fAIssue,      setFAIssue]     = useState("all"); // issue type
      const [fAOpenMin,    setFAOpenMin]   = useState("");
      const [fAOpenMax,    setFAOpenMax]   = useState("");
      const [fABounceMin,  setFABounceMin] = useState("");
      const [fABounceMax,  setFABounceMax] = useState("");
      const [fASentMin,    setFASentMin]   = useState("");
      const [fASentMax,    setFASentMax]   = useState("");

      const clearAlertFilters = () => {
        setAlertFilter("all"); setFASearch(""); setFAAccount("all"); setFAIssue("all");
        setFAOpenMin(""); setFAOpenMax(""); setFABounceMin(""); setFABounceMax("");
        setFASentMin(""); setFASentMax("");
      };

      const autoRefTimer = useRef(null);
      const AUTO_REFRESH_SECS = 600;
      const [countdown, setCountdown] = useState(AUTO_REFRESH_SECS);

      const txtSub   = dark ? "text-gray-400" : "text-gray-500";
      const border   = dark ? "border-gray-700" : "border-gray-200";

      // ── Load summary (all accounts) ───────────────────────────────
      const loadSummary = useCallback(async () => {
        setLoading(true);
        try {
          let url = "/api/dashboard/summary";
          if (startDate && endDate)
            url += `?start_date=${encodeURIComponent(toISO(startDate))}&end_date=${encodeURIComponent(toISO(endDate))}`;
          const r = await fetch(url);
          const ct = r.headers.get("content-type") || "";
          if (!ct.includes("application/json")) throw new Error("Server returned HTML — restart app.js");
          const json = await r.json();
          if (json.error) throw new Error(json.error);
          setSummary(json);
        } catch (e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      }, [startDate, endDate]); // eslint-disable-line react-hooks/exhaustive-deps

      // ── Load alerts (cross-account) ───────────────────────────────
      const loadAlerts = useCallback(async () => {
        setAlertsLoading(true);
        try {
          let url = "/api/dashboard/alerts?open_threshold=35&bounce_threshold=5";
          if (startDate && endDate)
            url += `&start_date=${encodeURIComponent(toISO(startDate))}&end_date=${encodeURIComponent(toISO(endDate))}`;
          const r = await fetch(url);
          const ct = r.headers.get("content-type") || "";
          if (!ct.includes("application/json")) throw new Error("Server returned HTML — restart app.js");
          const json = await r.json();
          if (json.error) throw new Error(json.error);
          setAlertsData(json);
        } catch (e) {
          console.warn("[master-dashboard] alerts fetch error:", e.message);
        } finally {
          setAlertsLoading(false);
        }
      }, [startDate, endDate]); // eslint-disable-line react-hooks/exhaustive-deps

      const refresh = useCallback(() => {
        loadSummary();
        loadAlerts();
        setCountdown(AUTO_REFRESH_SECS);
      }, [loadSummary, loadAlerts]);

      // Keep a stable ref so the setInterval closure always calls the
      // latest `refresh` (avoids stale-closure silent no-ops on re-renders).
      const refreshRef = useRef(refresh);
      useEffect(() => { refreshRef.current = refresh; }, [refresh]);

      // Mount + auto-refresh every AUTO_REFRESH_SECS seconds
      useEffect(() => {
        refreshRef.current();
        const tick = setInterval(() => {
          setCountdown(c => {
            if (c <= 1) { refreshRef.current(); return AUTO_REFRESH_SECS; }
            return c - 1;
          });
        }, 1000);
        return () => clearInterval(tick);
      }, []); // intentionally empty — runs once on mount

      // Re-fetch whenever the date range changes
      useEffect(() => {
        refreshRef.current();
      }, [startDate, endDate]); // eslint-disable-line react-hooks/exhaustive-deps

      // ── Derived data ──────────────────────────────────────────────
      const accounts     = summary?.accounts || [];
      const totals       = summary?.totals   || {};
      const allAlerts    = alertsData?.alerts || [];
      const globalOpenRate   = totals.sent > 0 ? (totals.opened  / totals.sent) * 100 : 0;
      const globalReplyRate  = totals.sent > 0 ? (totals.replied / totals.sent) * 100 : 0;
      const globalBounceRate = totals.sent > 0 ? (totals.bounced / totals.sent) * 100 : 0;

      // Derive unique account names and issue types for filter dropdowns
      const uniqueAlertAccounts = useMemo(() =>
        ["all", ...Array.from(new Set(allAlerts.map(a => a.account).filter(Boolean))).sort()],
      [allAlerts]);
      const uniqueAlertIssues = useMemo(() =>
        ["all", ...Array.from(new Set(allAlerts.map(a => a.issue).filter(Boolean))).sort()],
      [allAlerts]);

      // Count active alert filters (excluding sort which is not a "filter")
      const activeAlertFilterCount = [
        alertFilter !== "all",
        fASearch !== "",
        fAAccount !== "all",
        fAIssue !== "all",
        fAOpenMin !== "" || fAOpenMax !== "",
        fABounceMin !== "" || fABounceMax !== "",
        fASentMin !== "" || fASentMax !== "",
      ].filter(Boolean).length;

      const visibleAlerts = useMemo(() => {
        const inRange = (val, min, max) => {
          if (val === null || val === undefined) return min === "" && max === "";
          const n = Number(val);
          if (min !== "" && n < Number(min)) return false;
          if (max !== "" && n > Number(max)) return false;
          return true;
        };
        let a = [...allAlerts];
        // Severity quick-filter
        if (alertFilter !== "all") a = a.filter(x => x.severity === alertFilter);
        // Text search — campaign name or account
        if (fASearch) {
          const q = fASearch.toLowerCase();
          a = a.filter(x => (x.campaign || "").toLowerCase().includes(q) || (x.account || "").toLowerCase().includes(q));
        }
        // Account dropdown
        if (fAAccount !== "all") a = a.filter(x => x.account === fAAccount);
        // Issue type dropdown
        if (fAIssue !== "all") a = a.filter(x => x.issue === fAIssue);
        // Numeric range filters
        if (fAOpenMin   !== "" || fAOpenMax   !== "") a = a.filter(x => inRange(x.openRate,   fAOpenMin,   fAOpenMax));
        if (fABounceMin !== "" || fABounceMax !== "") a = a.filter(x => inRange(x.bounceRate, fABounceMin, fABounceMax));
        if (fASentMin   !== "" || fASentMax   !== "") a = a.filter(x => inRange(x.sent,       fASentMin,   fASentMax));
        // Sort
        if (alertSort === "account")       a.sort((a, b) => (a.account  || "").localeCompare(b.account  || ""));
        else if (alertSort === "campaign") a.sort((a, b) => (a.campaign || "").localeCompare(b.campaign || ""));
        else if (alertSort === "openRate") a.sort((a, b) => (a.openRate || 0) - (b.openRate || 0));
        else {
          a.sort((a, b) => {
            if (a.severity === "critical" && b.severity !== "critical") return -1;
            if (b.severity === "critical" && a.severity !== "critical") return  1;
            return (a.openRate || 0) - (b.openRate || 0); // secondary: worst open rate first
          });
        }
        return a;
      }, [allAlerts, alertFilter, fASearch, fAAccount, fAIssue, fAOpenMin, fAOpenMax, fABounceMin, fABounceMax, fASentMin, fASentMax, alertSort]);

      // ── Export alerts CSV ─────────────────────────────────────────
      const exportAlerts = () => {
        if (visibleAlerts.length === 0) return;
        const cols = ["Account","Campaign","Issue","Metric","Severity","Sent","Open Rate","Reply Rate","Bounce Rate"];
        const dataRows = visibleAlerts.map(a => [
          `"${(a.account  || "").replace(/"/g,'""')}"`,
