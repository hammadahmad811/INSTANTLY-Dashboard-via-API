                          {globalOpenRate.toFixed(1)}%
                        </td>
                        <td className={`px-4 py-3 font-mono tabular-nums ${dark ? "text-white" : "text-gray-900"}`}>{globalReplyRate.toFixed(1)}%</td>
                        <td className={`px-4 py-3 font-mono tabular-nums ${globalBounceRate > 5 ? "text-rose-500" : globalBounceRate > 3 ? "text-amber-500" : (dark ? "text-white" : "text-gray-900")}`}>
                          {globalBounceRate.toFixed(1)}%
                        </td>
                        <td className={`px-4 py-3 ${dark ? "text-white" : "text-gray-900"}`}>{totals.activeCampaigns} / {totals.totalCampaigns}</td>
                        <td className="px-4 py-3" />
                      </tr>
                    </tfoot>
                  )}
                </table>
              </div>
            )}
          </div>

        </div>
      );
    }

    // ══════════════════════════════════════════════════════════════════
    function App() {
      const [activePage,   setActivePage] = useState("analytics"); // "analytics" | "tracker" | "email-accounts" | "master-dashboard"
      const [dark,         setDark]      = useState(false);
      const [loading,      setLoading]   = useState(true);
      const [campaigns,    setCampaigns] = useState([]);
      const [dailyData,    setDailyData] = useState([]);
      const [rawDailyRows, setRawDaily]  = useState([]); // raw rows for summary cards
      const [connected,    setConnected] = useState(false);
      const [apiError,     setApiError]  = useState(null);
      const [startDate,    setStartDate] = useState(addDays(TODAY, -13));
      const [endDate,      setEndDate]   = useState(TODAY);

      // ── Account management ────────────────────────────────────────
      const [accountList,  setAccountList]  = useState([]);
      const [selectedAcc,  setSelectedAcc]  = useState(null);   // { id, name }
      const [accLoading,   setAccLoading]   = useState(false);
      const [keyStatus,    setKeyStatus]    = useState({});     // { [id]: { ok, campaigns, error } }
      const [validating,   setValidating]   = useState(false);
      // Add-account modal
      const [showAddModal, setShowAddModal] = useState(false);
      const [modalName,    setModalName]    = useState("");
      const [modalKey,     setModalKey]     = useState("");
      const [modalKeyVis,  setModalKeyVis]  = useState(false);
      const [modalSaving,  setModalSaving]  = useState(false);
      const [modalError,   setModalError]   = useState("");
      // Inline rename
      const [editId,       setEditId]       = useState(null);
      const [editName,     setEditName]     = useState("");
      // Toast notifications
      const [toast,        setToast]        = useState(null);   // { msg, type }

      // ── Alert system ──────────────────────────────────────────────
      const [alertThreshold,       setAlertThreshold]       = useState(() => {
        try { return Number(localStorage.getItem("alert_threshold")) || 35; } catch { return 35; }
      });
      const [showAlertsOnly,       setShowAlertsOnly]       = useState(false);
      const [showThresholdPanel,   setShowThresholdPanel]   = useState(false);
      const [alertPanelCollapsed,  setAlertPanelCollapsed]  = useState(false);

      // Persist threshold
      useEffect(() => {
        try { localStorage.setItem("alert_threshold", String(alertThreshold)); } catch {}
      }, [alertThreshold]);

      const [search,       setSearch]    = useState("");
      const [statusFilter, setStatus]    = useState("All");
      const [sortCol,      setSortCol]   = useState("email_sent");
      const [sortDir,      setSortDir]   = useState("desc");
      const [page,         setPage]      = useState(1);
      const [pageSize,     setPageSize]  = useState(10);
      const abortRef    = useRef(null);
      const dailyCache  = useRef({});
      const [expandedId, setExpandedId] = useState(null);
      const dSearch  = useDebounce(search, 300);

      useEffect(() => { setPage(1); }, [dSearch, statusFilter, startDate, endDate]);

      // ── Load data ────────────────────────────────────────────────
      const loadData = useCallback(async (start, end, isReal) => {
        if (abortRef.current) abortRef.current.abort();
        const ctrl = new AbortController();
        abortRef.current = ctrl;
        setLoading(true);
        setApiError(null);

        if (!isReal) {
          await new Promise(r => setTimeout(r, 300));
          if (ctrl.signal.aborted) return;
          setCampaigns(mockCampaigns(start, end));
          setDailyData(mockDaily(start, end));
          setRawDaily([]);
          setLoading(false);
          return;
        }

        try {
          // Load campaigns list and analytics in parallel
          const [rawC, anaResult] = await Promise.all([
            loadCampaigns(ctrl.signal),
            loadAnalytics(start, end, ctrl.signal).catch(() => ({ allTimeMap: {}, dailyRows: [] })),
          ]);
          if (ctrl.signal.aborted) return;

          const { allTimeMap, dailyRows } = anaResult;

          // ── DIAGNOSTIC: compare analytics endpoint vs daily endpoint ────────
          // Open the browser console (F12) to see raw field values from both
          // sources. This helps confirm which fields are lifetime vs date-filtered.
          console.group(`[loadData] Data source comparison (${toISO(start)}→${toISO(end)})`);
          {
            const ids = Object.keys(allTimeMap);
            if (ids.length > 0) {
              const firstId = ids[0];
              const a = allTimeMap[firstId];
              console.log(`[analytics endpoint] campaign=${firstId}`, {
                emails_sent_count:       a.emails_sent_count,       // LIFETIME — do not use for open rate
                open_count_unique:       a.open_count_unique,       // date-filtered opens
                reply_count_unique:      a.reply_count_unique,
                link_click_count_unique: a.link_click_count_unique,
                bounced_count:           a.bounced_count,
                new_leads_contacted:     a.new_leads_contacted,
                sequence_started:        a.sequence_started,
                contacted:               a.contacted,
                _allKeys:                Object.keys(a),
              });
            }
          }
          console.groupEnd();

          // ── STEP 4: Override with per-campaign daily data ────────────────────
          // emails_sent_count from /campaigns/analytics is LIFETIME regardless of
          // the date params (Instantly ignores the date filter for that field).
          // We use /campaigns/:id/analytics/daily to get accurate, date-filtered values.
          //
          // OPTIMIZATION: Skip entirely when the date range includes today.
          // Instantly doesn't finalize today's sends until ~24 h later, so every
          // campaign would return sent=0 → we'd fall back to analytics values anyway.
          // Skipping avoids N slow API calls that block the page from loading.
          const rangeEndStr = toISO(end);
          const todayStr    = toISO(TODAY);
          const skipDailyLookup = rangeEndStr >= todayStr;
          if (skipDailyLookup) {
            console.log(`[loadData] Date range includes today (${rangeEndStr}) — skipping per-campaign daily calls, using analytics endpoint values directly`);
          }

          if (!skipDailyLookup && rawC.length > 0) {
            try {
              const ids = rawC.map(c => c.id).filter(Boolean);
              const dailySent = await loadPerCampaignDailySent(ids, start, end, ctrl.signal);
              if (!ctrl.signal.aborted) {
                let overrideCount = 0, unfinalizedCount = 0;
                Object.entries(dailySent).forEach(([id, daily]) => {
                  // Guard: never overwrite a real analytics value with zero.
                  // daily.sent === 0 means one of:
                  //   (a) endpoint returned data but Instantly hasn't processed it yet
                  //   (b) field name mismatch → sent resolved to 0 in fillDateRange
                  //   (c) campaign genuinely sent nothing (still fine — analytics shows same)
                  // In all three cases, keeping the analytics endpoint value is safer.
                  if (daily._unfinalized || daily.sent === 0) {
                    unfinalizedCount++;
                    console.warn(`[loadData] id=${id}: daily.sent=${daily.sent} _unfinalized=${daily._unfinalized} → keeping analytics fallback`);
                    return;
                  }
                  // Both sent AND opens come from the same date window → open rate is correct.
                  allTimeMap[id] = {
                    ...(allTimeMap[id] || {}),
                    emails_sent_count:       daily.sent,
                    open_count_unique:       daily.unique_opened,
                    reply_count_unique:      daily.replied,
                    link_click_count_unique: daily.clicked,
                    bounced_count:           daily.bounced,
                    _source:                 "daily_endpoint",
                  };
                  overrideCount++;
                  console.log(
                    `[loadData] ✓ id=${id} sent=${daily.sent} unique_opened=${daily.unique_opened} ` +
                    `openRate=${((daily.unique_opened/daily.sent)*100).toFixed(1)}%`
                  );
                });
                console.log(`[loadData] Overrode ${overrideCount} campaigns with daily data; ${unfinalizedCount} kept alltime fallback`);
              }
            } catch (e) {
              console.warn("[loadData] per-campaign daily fetch error — falling back to analytics endpoint:", e.message);
            }
          }

          setCampaigns(buildCampaignRows(rawC, allTimeMap));
          // Raw daily rows stored for summary cards (date-filtered aggregate)
          setRawDaily(dailyRows);
          // Chart: date-filtered daily bars
          setDailyData(buildDailyChart(dailyRows, start, end));
          setApiError(null);
        } catch (e) {
          if (e.name === "AbortError") return;
          setApiError(e.message);
          setCampaigns(prev => prev.length > 0 ? prev : mockCampaigns(start, end));
          setDailyData(mockDaily(start, end));
        } finally {
          if (!ctrl.signal.aborted) setLoading(false);
        }
      }, []);

      useEffect(() => { loadData(startDate, endDate, connected); }, [startDate, endDate, connected]);

      // ── Detect how the page was opened ───────────────────────────
      // file://  → opened directly from disk (server not running)
      // http://  → served by app.js at localhost:3000 ✓
      const isFileProtocol = window.location.protocol === "file:";

      // ═════════════════════════════════════════════════════════════
      // ACCOUNT MANAGEMENT FUNCTIONS
      // ═════════════════════════════════════════════════════════════

      // Show a temporary toast notification
      const showToast = useCallback((msg, type = "success") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3200);
      }, []);

      // Load the account list from the backend (returns array for chaining)
      const loadAccounts = useCallback(async () => {
        try {
          const r = await fetch("/api/accounts");
          const list = await r.json();
          const accounts = Array.isArray(list) ? list : [];
          setAccountList(accounts);
          return accounts;
        } catch {
          return [];
        }
      }, []);

      // Activate an account on the backend, then trigger data load
      const selectAccount = useCallback(async (acc) => {
        if (!acc) {
          setSelectedAcc(null);
          setConnected(false);
          try { localStorage.removeItem("instantly_account_id"); } catch {}
          return;
        }
        setAccLoading(true);
        try {
          const r = await fetch("/api/accounts/select", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ account_id: acc.id }),
          });
          const json = await r.json();
          if (!r.ok || json.error) throw new Error(json.error || "Failed to activate account");
          setSelectedAcc(acc);
          setConnected(true);
          try { localStorage.setItem("instantly_account_id", acc.id); } catch {}
        } catch (e) {
          setApiError("Could not connect account: " + e.message);
        } finally {
          setAccLoading(false);
        }
      }, []);

      // Validate all saved API keys live against Instantly
      const validateAllKeys = useCallback(async () => {
        setValidating(true);
        setKeyStatus({});
        try {
          const r = await fetch("/api/accounts/validate", { method: "POST" });
          const ct = r.headers.get("content-type") || "";
          if (!ct.includes("application/json")) throw new Error("Server returned HTML — restart app.js");
          const results = await r.json();
          if (!Array.isArray(results)) throw new Error("Unexpected response");
          const map = {};
          results.forEach(item => { map[item.id] = item; });
          setKeyStatus(map);
        } catch (e) {
          console.error("[validate] Error:", e.message);
        } finally {
          setValidating(false);
        }
      }, []);

      // Load accounts once on mount, then restore last selected from localStorage
      useEffect(() => {
        if (isFileProtocol) return;
        loadAccounts().then(list => {
          if (!Array.isArray(list) || list.length === 0) return;
          let savedId = null;
          try { savedId = localStorage.getItem("instantly_account_id"); } catch {}
          if (savedId) {
            const saved = list.find(a => a.id === savedId);
            if (saved) selectAccount(saved);
          }
        });
      }, []); // eslint-disable-line react-hooks/exhaustive-deps

      // Save a new account from the modal
      const handleSaveAccount = useCallback(async () => {
        const name = modalName.trim(), key = modalKey.trim();
        if (!name) { setModalError("Account name is required."); return; }
        if (!key)  { setModalError("API key is required."); return; }
        setModalSaving(true);
        setModalError("");
        try {
          const r = await fetch("/api/accounts", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, api_key: key }),
          });
          const json = await r.json();
          if (!r.ok || json.error) { setModalError(json.error || "Failed to save account."); return; }

          // Refresh list and auto-select the newly added account
          const updatedList = await loadAccounts();
          const newAcc = updatedList.find(a => a.id === json.account?.id)
                      || updatedList[updatedList.length - 1];
          if (newAcc) await selectAccount(newAcc);

          setShowAddModal(false);
          setModalName(""); setModalKey(""); setModalError("");
          showToast(`"${name}" added and connected!`, "success");
        } catch (e) {
          setModalError(e.message || "Network error. Is app.js running?");
        } finally {
          setModalSaving(false);
        }
      }, [modalName, modalKey, loadAccounts, selectAccount, showToast]);

      // Delete an account
      const handleDeleteAccount = useCallback(async (id, name) => {
        if (!window.confirm(`Remove account "${name}"? This cannot be undone.`)) return;
        try {
          const r = await fetch(`/api/accounts/${encodeURIComponent(id)}`, { method: "DELETE" });
          if (!r.ok) throw new Error("Delete failed");
          if (selectedAcc?.id === id) { setSelectedAcc(null); setConnected(false); }
          loadAccounts();
          showToast(`"${name}" removed.`, "success");
        } catch (e) {
          showToast("Could not remove account: " + e.message, "error");
        }
      }, [selectedAcc, loadAccounts, showToast]);

      // Commit inline rename
      const commitRename = useCallback(async () => {
        if (!editName.trim() || !editId) { setEditId(null); return; }
        try {
          const r = await fetch(`/api/accounts/${encodeURIComponent(editId)}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: editName.trim() }),
          });
          const json = await r.json();
          if (!r.ok || json.error) throw new Error(json.error || "Rename failed");
          setAccountList(prev => prev.map(a => a.id === editId ? { ...a, name: editName.trim() } : a));
          if (selectedAcc?.id === editId) setSelectedAcc(prev => ({ ...prev, name: editName.trim() }));
          showToast("Account renamed.", "success");
        } catch (e) {
          showToast("Could not rename: " + e.message, "error");
        } finally {
          setEditId(null); setEditName("");
        }
      }, [editId, editName, selectedAcc, showToast]);

      // ── Alert engine ─────────────────────────────────────────────
      // Recalculates instantly whenever campaigns or threshold changes.
      const alerts = useMemo(() => {
        return campaigns
          .filter(c => c.email_sent > 0)
          .map(c => {
            // Cap at 100% — narrow date ranges can produce opens > sent
            const openRate = Math.min((c.email_opened / c.email_sent) * 100, 100);
            if (openRate >= alertThreshold) return null;
            return {
              ...c,
              _openRate:  openRate,
              _severity:  openRate < 25 ? "critical" : "warning",
            };
          })
          .filter(Boolean)
          .sort((a, b) => a._openRate - b._openRate); // worst first
      }, [campaigns, alertThreshold]);

      // Export flagged campaigns as CSV
      const exportAlertsCSV = () => {
        if (alerts.length === 0) return;
        const cols = [
          "Campaign","Sent","Open Rate","Total Opens",
          "Reply Rate","Total Clicks","Click Rate",
          "Bounced","Opportunities","Status","Alert Level",
        ];
        const rows = alerts.map(r => {
          const clickRate = r.email_sent > 0 ? (r.click_count / r.email_sent) * 100 : 0;
          return [
            `"${r.name.replace(/"/g,'""')}"`,
            r.email_sent,
            r._openRate.toFixed(1) + "%",
            r.email_opened,
            pct(r.reply_count, r.email_sent),
            r.click_count,
            clickRate.toFixed(1) + "%",
            r.bounce_count,
            r.opportunities,
            r.status,
            r._severity === "critical" ? "Critical (<25%)" : `Warning (<${alertThreshold}%)`,
          ].join(",");
        });
        const csv  = [cols.join(","), ...rows].join("\n");
        const blob = new Blob([csv], { type: "text/csv" });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement("a");
        a.href = url;
        a.download = `alerts_${(selectedAcc?.name||"").replace(/[^a-z0-9]/gi,"_").toLowerCase()}_${toISO(startDate)}_to_${toISO(endDate)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      };

      // ── Sorting ──────────────────────────────────────────────────
      const toggleSort = col => {
        if (sortCol === col) setSortDir(d => d === "asc" ? "desc" : "asc");
        else { setSortCol(col); setSortDir("desc"); }
        setPage(1);
      };

      // ── Filtered + sorted campaigns ──────────────────────────────
      const filtered = useMemo(() => {
        let rows = campaigns;
        if (dSearch) rows = rows.filter(r => r.name.toLowerCase().includes(dSearch.toLowerCase()));
        if (statusFilter !== "All") rows = rows.filter(r => r.status === statusFilter);
        // Alert filter: show only campaigns below threshold
        if (showAlertsOnly) rows = rows.filter(r =>
          r.email_sent > 0 && (r.email_opened / r.email_sent) * 100 < alertThreshold
        );
        rows = [...rows].sort((a, b) => {
          const v = typeof a[sortCol] === "string"
            ? a[sortCol].localeCompare(b[sortCol])
            : (a[sortCol] ?? 0) - (b[sortCol] ?? 0);
          return sortDir === "asc" ? v : -v;
        });
        return rows;
      }, [campaigns, dSearch, statusFilter, sortCol, sortDir, showAlertsOnly, alertThreshold]);

      const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
      const pageRows   = filtered.slice((page - 1) * pageSize, page * pageSize);

      // ── Summary metrics (date-filtered from daily aggregate rows) ──
      // Uses calculateMetricsByDateRange() — both cards and table reflect selected range.
      const totals = useMemo(() => {
        if (connected && rawDailyRows.length > 0) {
          // Live data: use date-filtered daily aggregate
          const r = calculateMetricsByDateRange(rawDailyRows, startDate, endDate);
          return {
            sent: r.sent, opened: r.opened, replied: r.replies,
            clicked: r.clicks, bounced: r.bounced, opps: r.opps,
            openRate: r.openRate, replyRate: r.replyRate, clickRate: r.clickRate,
            hasData: r.hasData,
          };
        }
        // Demo mode or no daily rows: sum from campaign table rows
        const sent    = campaigns.reduce((s, c) => s + c.email_sent,    0);
        const opened  = campaigns.reduce((s, c) => s + c.email_opened,  0);
        const replied = campaigns.reduce((s, c) => s + c.reply_count,   0);
        const clicked = campaigns.reduce((s, c) => s + c.click_count,   0);
        const bounced = campaigns.reduce((s, c) => s + c.bounce_count,  0);
        const opps    = campaigns.reduce((s, c) => s + c.opportunities, 0);
        const openRate  = sent > 0 ? (opened  / sent) * 100 : 0;
        const replyRate = sent > 0 ? (replied / sent) * 100 : 0;
        const clickRate = sent > 0 ? (clicked / sent) * 100 : 0;
        return { sent, opened, replied, clicked, bounced, opps,
                 openRate, replyRate, clickRate, hasData: sent > 0 };
      }, [rawDailyRows, campaigns, startDate, endDate, connected]);

      // ── CSV export ───────────────────────────────────────────────
      const exportCSV = () => {
        const cols = ["Campaign","Sent","Opened","Open Rate","Replied","Reply Rate","Clicked","Bounced","Opportunities","Status","Alert Level"];
        const rows = filtered.map(r => {
          const openRate  = r.email_sent > 0 ? Math.min((r.email_opened / r.email_sent) * 100, 100) : 0;
          const alertLvl  = r.email_sent > 0 && openRate < alertThreshold
            ? (openRate < 25 ? "Critical" : "Warning")
            : "OK";
          return [
            `"${r.name.replace(/"/g,'""')}"`,
            r.email_sent, r.email_opened, openRate.toFixed(1) + "%",
            r.reply_count, pct(r.reply_count, r.email_sent),
            r.click_count, r.bounce_count, r.opportunities, r.status,
            alertLvl,
          ].join(",");
        });
        const csv  = [cols.join(","), ...rows].join("\n");
        const blob = new Blob([csv], { type: "text/csv" });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement("a");
        a.href = url;
        a.download = `instantly_campaigns_${(selectedAcc?.name||"").replace(/[^a-z0-9]/gi,"_").toLowerCase()}_${toISO(startDate)}_to_${toISO(endDate)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      };

      // ── Theme classes ────────────────────────────────────────────
      const bg    = dark ? "bg-gray-900 text-gray-100" : "bg-gray-50 text-gray-900";
      const card  = dark ? "bg-gray-800 border-gray-700" : "bg-white border-gray-200";
      const input = dark ? "bg-gray-700 border-gray-600 text-white placeholder-gray-500 focus:ring-indigo-400" : "bg-white border-gray-300 text-gray-900 placeholder-gray-400 focus:ring-indigo-500";
      const th    = dark ? "bg-gray-700 text-gray-300" : "bg-gray-50 text-gray-600";
      const td    = dark ? "border-gray-700 text-gray-200" : "border-gray-100 text-gray-700";

      // ── Render ───────────────────────────────────────────────────
      return (
        <div className={`min-h-screen ${bg} transition-colors`}>

          {/* ── File:// protocol warning banner ──────────────────── */}
          {isFileProtocol && (
            <div className="bg-red-600 text-white text-sm px-5 py-3 flex items-start gap-3">
              <span className="text-lg leading-none mt-0.5">⚠</span>
              <div>
                <span className="font-bold">Wrong way to open this file.</span>
                {" "}You opened dashboard.html directly from your computer. The Connect button won't work this way.
                <span className="block mt-1">
                  <span className="font-semibold">Fix:</span> Double-click <span className="font-mono bg-red-500 px-1 rounded">start.bat</span> (Windows) or <span className="font-mono bg-red-500 px-1 rounded">start.command</span> (Mac).
                  Your browser will automatically open to <span className="font-mono font-bold">http://localhost:3000</span> where everything works.
                </span>
              </div>
            </div>
          )}

          {/* ── Header ──────────────────────────────────────────── */}
          <header className={`sticky top-0 z-20 border-b px-6 py-3 flex items-center gap-3 ${card}`}>
            <div className="flex items-center gap-2 font-bold text-lg tracking-tight shrink-0">
              <span className="w-7 h-7 rounded-lg bg-indigo-600 flex items-center justify-center">
                <Icon name="send" size={14} className="text-white" />
              </span>
              Instantly Analytics
            </div>

            {/* ── Account selector dropdown ── */}
            {!isFileProtocol && (
              <div className="relative flex items-center gap-1.5 ml-2">
                <Icon name="user" size={14} className={dark ? "text-gray-400" : "text-gray-400"} />
                <select
                  value={selectedAcc?.id || ""}
                  disabled={accLoading}
                  onChange={e => {
                    if (e.target.value === "__add__") {
                      setShowAddModal(true);
                      e.target.value = selectedAcc?.id || "";
                    } else if (e.target.value) {
                      const acc = accountList.find(a => a.id === e.target.value);
                      if (acc) selectAccount(acc);
                    }
                  }}
                  className={`text-sm border rounded-lg pl-3 pr-7 py-1.5 focus:outline-none focus:ring-2 min-w-[160px] ${input}`}
                >
                  {!selectedAcc && <option value="">— Select account —</option>}
                  {accountList.map(a => (
                    <option key={a.id} value={a.id}>{a.name}</option>
                  ))}
                  <option disabled>──────────────</option>
                  <option value="__add__">➕  Add New Account</option>
                </select>
                {accLoading && (
                  <span className="absolute right-2 top-1/2 -translate-y-1/2 animate-spin text-indigo-500 text-sm pointer-events-none">↻</span>
                )}
              </div>

            <div className={`flex items-center rounded-lg border overflow-hidden text-xs font-semibold ml-2 ${dark ? "border-gray-600" : "border-gray-200"}`}>

                ["email-accounts",    "📬 Email Accounts"],
                ["inbox-placement",   "🔬 Inbox Placement"],
                ["master-dashboard",  "🌐 Master Dashboard"],

                <button key={key} onClick={() => setActivePage(key)}

                  {label}

            {activePage === "analytics" && !loading && alerts.length > 0 && (
              <button
                onClick={() => { setAlertPanelCollapsed(false); document.getElementById("alert-panel")?.scrollIntoView({ behavior: "smooth", block: "start" }); }}

                ⚠️ Alerts
                <span className="px-1.5 py-0.5 rounded-full bg-rose-600 text-white text-xs font-bold leading-none">

                </span>
              </button>

            <div className="flex-1" />
            {/* Chart date range pickers */}

            <label className={`text-xs ${dark ? "text-gray-400" : "text-gray-500"}`}>From</label>
            <input type="date" value={toISO(startDate)} max={toISO(endDate)}
              onChange={e => { const [y,m,d] = e.target.value.split("-"); setStartDate(new Date(+y,+m-1,+d)); }}
              className={`text-xs border rounded-lg px-2 py-1.5 focus:outline-none focus:ring-2 ${input}`} />
            <label className={`text-xs ${dark ? "text-gray-400" : "text-gray-500"}`}>To</label>
            <input type="date" value={toISO(endDate)} min={toISO(startDate)}
              onChange={e => { const [y,m,d] = e.target.value.split("-"); setEndDate(new Date(+y,+m-1,+d)); }}
              className={`text-xs border rounded-lg px-2 py-1.5 focus:outline-none focus:ring-2 ${input}`} />
            <button onClick={() => loadData(startDate, endDate, connected)}
              className="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
              <Icon name="refresh" size={15} className={dark ? "text-gray-400" : "text-gray-500"} />
            </button>
            <button onClick={() => setDark(d => !d)}
              className={`p-1.5 rounded-lg transition-colors ${dark ? "hover:bg-gray-700" : "hover:bg-gray-100"}`}>
              <Icon name={dark ? "sun" : "moon"} size={15} className={dark ? "text-yellow-400" : "text-gray-500"} />
            </button>
          </header>

          {/* ── Campaign Tracker Page ────────────────────────────── */}
          {activePage === "tracker" && (
            <CampaignTracker
              dark={dark} connected={connected} selectedAcc={selectedAcc}
              card={card} input={input} th={th} td={td}
            />
          )}

          {/* ── Email Accounts Page ──────────────────────────────── */}
          {activePage === "email-accounts" && (
            <EmailAccountsPage
              dark={dark} connected={connected} selectedAcc={selectedAcc}
              card={card} input={input} th={th} td={td}
              startDate={startDate} endDate={endDate}
            />
          )}

          {/* ── Inbox Placement Page ─────────────────────────────── */}
          {activePage === "inbox-placement" && (
            <InboxPlacementPage
              dark={dark} connected={connected} selectedAcc={selectedAcc}
              card={card} input={input} th={th} td={td}
              startDate={startDate} endDate={endDate}
            />
          )}

          {/* ── Master Dashboard Page ────────────────────────────── */}
          {activePage === "master-dashboard" && (
            <MasterDashboardPage
              dark={dark} card={card} input={input} th={th} td={td}
              startDate={startDate} endDate={endDate}
              onNavigateToCampaign={(alert) => {
                // Switch to Analytics and pre-search for the campaign
                setActivePage("analytics");
                setSearch(alert.campaign || "");
                // Switch to the account that owns this alert
                if (alert.accountId && alert.accountId !== selectedAcc?.id) {
                  const acc = accountList.find(a => a.id === alert.accountId);
                  if (acc) selectAccount(acc);
                }
              }}
            />
          )}

          <main className={`max-w-screen-2xl mx-auto px-4 sm:px-6 py-6 space-y-6 ${activePage !== "analytics" ? "hidden" : ""}`}>

            {/* ── Account management panel ──────────────────────── */}
            {connected && selectedAcc ? (
              /* Connected badge */
              <div className="flex items-center gap-2 flex-wrap">
                <div className="flex items-center gap-2 px-3 py-2 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-medium">
                  <Icon name="check" size={13} />
                  <span className="font-semibold">{selectedAcc.name}</span>
                  <span className={`${dark ? "text-emerald-400" : "text-emerald-500"}`}>· live data</span>
                  <button onClick={() => selectAccount(null)}
                    className="ml-1 text-emerald-400 hover:text-emerald-700 transition-colors" title="Disconnect">
                    <Icon name="x" size={12} />
                  </button>
                </div>
                <button onClick={() => setShowAddModal(true)}
                  className={`flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-medium rounded-lg border transition-colors ${dark ? "border-gray-600 hover:bg-gray-700 text-gray-300" : "border-gray-300 hover:bg-gray-50 text-gray-600"}`}>
                  <Icon name="plus" size={12} /> Add Account
                </button>
              </div>
            ) : (
              /* Not connected — account list */
              <div className={`rounded-2xl border ${card}`}>
                {/* Panel header */}
                <div className="flex items-center justify-between px-5 pt-5 pb-4">
                  <div className="flex items-center gap-3">
                    <div className={`w-9 h-9 rounded-xl flex items-center justify-center shrink-0 ${dark ? "bg-indigo-900/50" : "bg-indigo-50"}`}>
                      <Icon name="key" size={16} className="text-indigo-500" />
                    </div>
                    <div>
                      <p className={`font-semibold text-sm ${dark ? "text-white" : "text-gray-900"}`}>
                        {accountList.length === 0 ? "Connect your Instantly account" : "Select an account"}

                      <p className={`text-xs ${dark ? "text-gray-400" : "text-gray-500"}`}>
                        {accountList.length === 0
                          ? "API keys are stored securely on the server — never in the browser"
                          : "Showing demo data · select an account to load live data"}
                      </p>
                    </div>
                  </div>
                  <div className="flex items-center gap-2 shrink-0">
                    <button
                      onClick={validateAllKeys}
                      disabled={validating || accountList.length === 0}
                      title="Test each API key live against Instantly to check if it's valid"
                      className={`flex items-center gap-1.5 px-3 py-2 text-xs font-semibold rounded-lg border transition-colors ${
                        validating
                          ? (dark ? "border-gray-600 text-gray-500 cursor-wait" : "border-gray-200 text-gray-400 cursor-wait")
                          : (dark ? "border-gray-600 hover:bg-gray-700 text-gray-300" : "border-gray-300 hover:bg-gray-50 text-gray-600")
                      }`}>
                      {validating ? <span className="animate-spin inline-block">↻</span> : <Icon name="check" size={12} />}
                      {validating ? "Checking…" : "Validate Keys"}
                    </button>
                    <button onClick={() => setShowAddModal(true)}
                      className="flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg transition-colors whitespace-nowrap">
                      <Icon name="plus" size={13} /> Add Account
                    </button>
                  </div>
                </div>

                {/* Account list or empty state */}
                {accountList.length === 0 ? (
                  <div className={`mx-5 mb-5 flex flex-col items-center gap-3 py-8 rounded-xl border-2 border-dashed ${dark ? "border-gray-700" : "border-gray-100"}`}>
                    <Icon name="wifi" size={28} className={dark ? "text-gray-700" : "text-gray-200"} />
                    <p className={`text-sm font-medium ${dark ? "text-gray-500" : "text-gray-400"}`}>No accounts saved yet</p>
                    <p className={`text-xs text-center max-w-xs ${dark ? "text-gray-600" : "text-gray-400"}`}>
                      Click "Add Account" to save your Instantly API key.<br/>
                      It's stored on the server — never exposed in the browser.
                    </p>
                    <button onClick={() => setShowAddModal(true)}
                      className="flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-lg transition-colors mt-1">
                      <Icon name="key" size={14} /> Add Your First Account
                    </button>
                  </div>
                ) : (
                  <div className="px-5 pb-5 space-y-2">
                    {accountList.map(acc => (
                      <div key={acc.id}
                        onClick={() => editId !== acc.id && selectAccount(acc)}
                        className={`group flex items-center gap-3 px-4 py-3 rounded-xl border transition-colors ${editId === acc.id ? "" : "cursor-pointer"} ${
                          dark ? "border-gray-700 hover:border-indigo-600 hover:bg-indigo-900/20" : "border-gray-200 hover:border-indigo-300 hover:bg-indigo-50/50"
                        }`}>
                        {/* API key status badge (shown after Validate Keys is run) */}
                        {keyStatus[acc.id] ? (
                          <div className={`w-8 h-8 rounded-lg flex items-center justify-center shrink-0 text-base ${
                            keyStatus[acc.id].ok
                              ? (dark ? "bg-emerald-900/40" : "bg-emerald-50")
                              : (dark ? "bg-rose-900/40"    : "bg-rose-50")
                          }`}
                          title={keyStatus[acc.id].ok
                            ? `✅ Key valid — ${keyStatus[acc.id].campaigns} campaign(s) found`
                            : `❌ ${keyStatus[acc.id].error}`}>
                            {keyStatus[acc.id].ok ? "✅" : "❌"}
                          </div>
                        ) : (
                          <div className={`w-8 h-8 rounded-lg flex items-center justify-center shrink-0 ${dark ? "bg-gray-700" : "bg-indigo-50"}`}>
                            <Icon name="wifi" size={14} className="text-indigo-500" />
                          </div>
                        )}

                        {editId === acc.id ? (
                          /* Inline rename input */
                          <input
                            className={`flex-1 text-sm px-2.5 py-1 rounded-lg border focus:outline-none focus:ring-2 ${input}`}
                            value={editName}
                            onChange={e => setEditName(e.target.value)}
                            onKeyDown={e => {
                              if (e.key === "Enter")  commitRename();
                              if (e.key === "Escape") { setEditId(null); setEditName(""); }
                            }}
                            onClick={e => e.stopPropagation()}
                            autoFocus
                          />
                        ) : (
                          <div className="flex-1 min-w-0">
                            <span className={`text-sm font-medium ${dark ? "text-white" : "text-gray-800"}`}>
                              {acc.name}
                            </span>
                            {keyStatus[acc.id] && (
                              <p className={`text-xs mt-0.5 truncate ${
                                keyStatus[acc.id].ok
                                  ? (dark ? "text-emerald-400" : "text-emerald-600")
                                  : (dark ? "text-rose-400"    : "text-rose-600")
                              }`}>
                                {keyStatus[acc.id].ok
                                  ? `${keyStatus[acc.id].campaigns} campaign(s) accessible`
                                  : keyStatus[acc.id].error}
                              </p>
                            )}
                          </div>
                        )}

                        {/* Action buttons */}
                        <div className="flex items-center gap-1 shrink-0" onClick={e => e.stopPropagation()}>
                          {editId === acc.id ? (
                            <>
                              <button onClick={commitRename}
                                className="p-1.5 rounded-lg text-emerald-500 hover:bg-emerald-50 transition-colors" title="Save name">
                                <Icon name="check" size={13} />
                              </button>
                              <button onClick={() => { setEditId(null); setEditName(""); }}
                                className={`p-1.5 rounded-lg transition-colors ${dark ? "hover:bg-gray-700 text-gray-400" : "hover:bg-gray-100 text-gray-400"}`} title="Cancel">
                                <Icon name="x" size={13} />
                              </button>
                            </>
                          ) : (
                            <>
                              {accLoading && selectedAcc?.id === acc.id ? (
                                <span className="animate-spin text-indigo-500 text-sm mr-1">↻</span>
                              ) : null}
                              <button
                                onClick={() => { setEditId(acc.id); setEditName(acc.name); }}
                                className={`p-1.5 rounded-lg transition-colors opacity-0 group-hover:opacity-100 ${dark ? "hover:bg-gray-700 text-gray-500" : "hover:bg-gray-100 text-gray-400"}`}
                                title="Rename">
                                <Icon name="pencil" size={13} />
                              </button>
                              <button
                                onClick={() => handleDeleteAccount(acc.id, acc.name)}
                                className={`p-1.5 rounded-lg transition-colors opacity-0 group-hover:opacity-100 ${dark ? "hover:bg-rose-900/30 text-gray-500 hover:text-rose-400" : "hover:bg-rose-50 text-gray-400 hover:text-rose-500"}`}
                                title="Remove">
                                <Icon name="x" size={13} />
                              </button>
                            </>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* ── API error banner ──────────────────────────────── */}
            {apiError && (
              <div className="flex items-start gap-3 px-4 py-3 rounded-xl border border-amber-200 bg-amber-50 text-amber-800 text-sm">
                <Icon name="wifiOff" size={16} className="mt-0.5 shrink-0 text-amber-500" />
                <span className="flex-1"><b>API error — </b>{apiError}</span>
                <button onClick={() => setApiError(null)} className="text-amber-400 hover:text-amber-700">
                  <Icon name="x" size={14} />
                </button>
              </div>
            )}

            {/* ── "No data in range" banner ─────────────────────── */}
            {connected && !loading && !totals.hasData && (
              <div className={`flex items-center gap-3 px-4 py-3 rounded-xl border text-sm ${dark ? "border-gray-600 bg-gray-800 text-gray-400" : "border-gray-200 bg-gray-50 text-gray-500"}`}>
                <Icon name="calendar" size={15} className={dark ? "text-gray-500" : "text-gray-400"} />
                <span>No activity data found for <strong>{toISO(startDate)}</strong> → <strong>{toISO(endDate)}</strong>. Try widening the date range.</span>
              </div>
            )}

            {/* ══════════════════════════════════════════════════════
                ALERT PANEL
            ══════════════════════════════════════════════════════ */}
            {!loading && campaigns.length > 0 && (
              <div id="alert-panel" className={`rounded-2xl border transition-colors ${
                alerts.length > 0
                  ? (dark ? "border-rose-800 bg-rose-950/30" : "border-rose-200 bg-rose-50/40")
                  : (dark ? "border-emerald-800 bg-emerald-950/20" : "border-emerald-200 bg-emerald-50/40")
              }`}>
                {/* Panel header */}
                <div className="flex items-center justify-between px-5 py-3.5">
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => setAlertPanelCollapsed(v => !v)}
                      className="flex items-center gap-2 group">
                      <span className="text-base leading-none">{alerts.length > 0 ? "⚠️" : "✅"}</span>
                      <span className={`font-semibold text-sm ${dark ? "text-white" : "text-gray-800"}`}>
                        Campaign Alerts
                      </span>
                      {alerts.length > 0 && (
                        <span className="px-2 py-0.5 text-xs font-bold rounded-full bg-rose-500 text-white">
                          {alerts.length}
                        </span>
                      )}
                      <Icon
                        name={alertPanelCollapsed ? "chevR" : "chevDown"}
                        size={12}
                        className={dark ? "text-gray-500" : "text-gray-400"}
                      />
                    </button>
                  </div>
                  <div className="flex items-center gap-2">
                    {/* Threshold configurator */}
                    <button
                      onClick={() => setShowThresholdPanel(v => !v)}
                      className={`flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-medium rounded-lg border transition-colors ${dark ? "border-gray-600 hover:bg-gray-700 text-gray-300" : "border-gray-300 hover:bg-gray-100 text-gray-600"}`}>
                      <Icon name="target" size={11} /> Threshold: {alertThreshold}%
                    </button>
                    {/* Export alerts */}
                    {alerts.length > 0 && (
                      <button
                        onClick={exportAlertsCSV}
                        className={`flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-medium rounded-lg border transition-colors ${dark ? "border-gray-600 hover:bg-gray-700 text-gray-300" : "border-gray-300 hover:bg-gray-50 text-gray-600"}`}>
                        <Icon name="download" size={11} /> Export Alerts
                      </button>
                    )}
                  </div>
                </div>

                {/* Threshold slider */}
                {showThresholdPanel && (
                  <div className={`flex flex-wrap items-center gap-4 px-5 pb-3.5 pt-0 border-t ${dark ? "border-gray-700" : "border-gray-200"}`}
                       style={{ marginTop: 0 }}>
                    <span className={`text-xs font-medium ${dark ? "text-gray-400" : "text-gray-500"}`}>
                      Alert when Open Rate is below:
                    </span>
                    <div className="flex items-center gap-2">
                      <input
                        type="range" min="5" max="60" step="1"
                        value={alertThreshold}
                        onChange={e => setAlertThreshold(+e.target.value)}
                        className="w-28 accent-indigo-600"
                      />
                      <span className={`text-sm font-bold tabular-nums w-10 ${alerts.length > 0 ? "text-rose-500" : "text-emerald-500"}`}>
                        {alertThreshold}%
                      </span>
                    </div>
                    <button
                      onClick={() => setAlertThreshold(35)}
                      className="text-xs text-indigo-500 hover:text-indigo-700 font-medium transition-colors">
                      Reset to 35%
                    </button>
                  </div>
                )}

                {/* Alert list */}
                {!alertPanelCollapsed && (
                  <div className={`px-5 pb-5 ${showThresholdPanel ? "" : "pt-0"}`}>
                    {alerts.length === 0 ? (
                      <div className={`flex items-center gap-2 text-sm font-medium ${dark ? "text-emerald-400" : "text-emerald-600"}`}>
                        <Icon name="check" size={15} />
                        All {campaigns.filter(c => c.email_sent > 0).length} active campaigns have open rate ≥ {alertThreshold}%
                      </div>
                    ) : (
                      <div className="space-y-2">
                        {/* Column header — 16 cols: 3 name | 1 open rate | 1 opens | 1 sent | 1 bounced | 1 clicks | 1 click rate | 2 severity | 1 action */}
                        <div className={`grid grid-cols-12 px-3 pb-1 text-xs font-semibold tracking-wide ${dark ? "text-gray-500" : "text-gray-400"}`}
                             style={{ gridTemplateColumns: "3fr 1fr 1fr 1fr 1fr 1fr 1fr 1.6fr 0.5fr" }}>
                          <span>Campaign</span>
                          <span className="text-right">Open Rate</span>
                          <span className="text-right">Total Opens</span>
                          <span className="text-right">Sent</span>
                          <span className="text-right">Bounced</span>
                          <span className="text-right">Total Clicks</span>
                          <span className="text-right">Click Rate</span>
                          <span className="text-center">Severity</span>
                          <span />
                        </div>
                        {alerts.map(c => {
                          const isCritical = c._severity === "critical";
                          const clickRate  = c.email_sent > 0 ? (c.click_count / c.email_sent) * 100 : 0;
                          return (
                            <div
                              key={c.id}
                              title="Low open rate may indicate a weak subject line, poor list targeting, or deliverability issues. Consider A/B testing subject lines and reviewing sending domain health."
                              className={`grid items-center px-3 py-2.5 rounded-xl border text-sm transition-colors ${
                                isCritical
                                  ? (dark ? "border-rose-800 bg-rose-900/30 hover:bg-rose-900/50" : "border-rose-200 bg-rose-50 hover:bg-rose-100/70")
                                  : (dark ? "border-amber-800 bg-amber-900/20 hover:bg-amber-900/40" : "border-amber-200 bg-amber-50 hover:bg-amber-100/70")
                              }`}
                              style={{ gridTemplateColumns: "3fr 1fr 1fr 1fr 1fr 1fr 1fr 1.6fr 0.5fr" }}>
                              {/* Campaign name */}
                              <span className={`font-medium truncate pr-2 ${dark ? "text-white" : "text-gray-800"}`}>
                                {c.name}
                              </span>
                              {/* Open rate */}
                              <span className={`text-right font-bold tabular-nums ${isCritical ? "text-rose-500" : "text-amber-500"}`}>
                                {c._openRate.toFixed(1)}%
                              </span>
                              {/* Total opens */}
                              <span className={`text-right tabular-nums ${dark ? "text-gray-300" : "text-gray-600"}`}>
                                {c.email_opened.toLocaleString()}
                              </span>
                              {/* Sent */}
                              <span className={`text-right tabular-nums ${dark ? "text-gray-400" : "text-gray-500"}`}>
                                {c.email_sent.toLocaleString()}
                              </span>
                              {/* Bounced */}
                              <span className={`text-right tabular-nums font-medium ${c.bounce_count > 0 ? "text-rose-500" : (dark ? "text-gray-500" : "text-gray-400")}`}>
                                {c.bounce_count.toLocaleString()}
                              </span>
                              {/* Total clicks */}
                              <span className={`text-right tabular-nums ${dark ? "text-gray-300" : "text-gray-600"}`}>
                                {c.click_count.toLocaleString()}
                              </span>
                              {/* Click rate */}
                              <span className={`text-right tabular-nums ${dark ? "text-gray-400" : "text-gray-500"}`}>
                                {clickRate.toFixed(1)}%
                              </span>
                              {/* Severity badge */}
                              <span className="flex justify-center">
                                <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold ${
                                  isCritical
                                    ? "bg-rose-100 text-rose-700 border border-rose-200"
                                    : "bg-amber-100 text-amber-700 border border-amber-200"
                                }`}>
                                  {isCritical ? "🔴 Critical" : "🟠 Warning"}
                                </span>
                              </span>
                              {/* Quick filter */}
                              <span className="flex justify-end">
                                <button
                                  onClick={() => { setSearch(c.name.slice(0, 15)); setShowAlertsOnly(false); document.getElementById("campaign-table")?.scrollIntoView({ behavior: "smooth" }); }}
                                  className={`text-xs px-1.5 py-0.5 rounded transition-colors ${dark ? "hover:bg-gray-700 text-gray-500" : "hover:bg-gray-200 text-gray-400"}`}
                                  title="Find in table">
                                  →
                                </button>
                              </span>
                            </div>
                          );
                        })}
                        <p className={`text-xs pt-1 ${dark ? "text-gray-600" : "text-gray-400"}`}>
                          💡 Hover any row for improvement suggestions. Threshold is {alertThreshold}% — adjustable above.
                        </p>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            {/* ── Summary metric cards (date-filtered via calculateMetricsByDateRange) ── */}
            <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-4">
              {[
                { label: "Emails Sent",  icon: "mail",    value: fmt(totals.sent),                            sub: `${campaigns.length} campaigns`,               color: "text-indigo-500" },
                { label: "Open Rate",    icon: "eye",     value: totals.openRate.toFixed(1) + "%",             sub: fmt(totals.opened)  + " unique opens",          color: "text-blue-500" },
                { label: "Reply Rate",   icon: "reply",   value: totals.replyRate.toFixed(1) + "%",            sub: fmt(totals.replied) + " unique replies",        color: "text-violet-500" },
                { label: "Click Rate",   icon: "click",   value: totals.clickRate.toFixed(1) + "%",            sub: fmt(totals.clicked) + " unique clicks",         color: "text-cyan-500" },
                { label: "Bounce Rate",  icon: "bounce",  value: totals.sent > 0 ? pct(totals.bounced, totals.sent) : "0%", sub: fmt(totals.bounced) + " bounced", color: "text-rose-500" },
                { label: "Opportunities",icon: "target",  value: fmt(totals.opps),                             sub: "identified",                                   color: "text-amber-500" },
              ].map(({ label, icon, value, sub, color }) => (
                <div key={label} className={`rounded-2xl border p-4 ${card}`}>
                  {loading ? (
                    <div className="animate-pulse space-y-2">
                      <div className={`h-4 w-16 rounded ${dark ? "bg-gray-700" : "bg-gray-200"}`} />
                      <div className={`h-7 w-20 rounded ${dark ? "bg-gray-700" : "bg-gray-200"}`} />
                      <div className={`h-3 w-24 rounded ${dark ? "bg-gray-700" : "bg-gray-200"}`} />
                    </div>
                  ) : (
                    <>
                      <div className={`flex items-center gap-1.5 text-xs font-medium mb-1 ${dark ? "text-gray-400" : "text-gray-500"}`}>
                        <Icon name={icon} size={12} className={color} /> {label}
                      </div>
                      <div className={`text-2xl font-bold ${dark ? "text-white" : "text-gray-900"}`}>{value}</div>
                      <div className={`text-xs mt-0.5 ${dark ? "text-gray-500" : "text-gray-400"}`}>{sub}</div>

            {/* ── Chart: Sent vs Opens vs Replies ───────────────── */}

                  Activity — daily
                </h3>
                <span className={`text-xs px-2 py-1 rounded-md font-medium ${dark ? "bg-gray-700 text-gray-400" : "bg-gray-100 text-gray-500"}`}>

              </div>
              {loading ? (
                <div className={`h-48 rounded-xl animate-pulse ${dark ? "bg-gray-700" : "bg-gray-100"}`} />

                  <BarChart data={dailyData} margin={{ top: 5, right: 20, left: 0, bottom: 5 }}>

                    <XAxis dataKey="label" tick={{ fontSize: 11, fill: dark ? "#9ca3af" : "#6b7280" }} tickLine={false} />

                    />
                    <Legend iconSize={10} wrapperStyle={{ fontSize: 11 }} />
                    <Bar dataKey="sent"    name="Sent"    fill="#6366f1" radius={[3,3,0,0]} maxBarSize={24} />
                    <Bar dataKey="opened"  name="Opened"  fill="#3b82f6" radius={[3,3,0,0]} maxBarSize={24} />

            {/* ── Campaign table ────────────────────────────────── */}
            <div id="campaign-table" className={`rounded-2xl border ${card}`}>

                <div className="relative flex-1 min-w-48">

                  <input

                <select value={statusFilter} onChange={e => setStatus(e.target.value)}

                  {["All","Active","Paused","Completed"].map(s => <option key={s}>{s}</option>)}

                {/* Alert filter toggle */}
                <button
                  onClick={() => { setShowAlertsOnly(v => !v); setPage(1); }}
                  className={`flex items-center gap-1.5 px-3 py-2 text-sm font-medium rounded-lg border transition-colors ${
                    showAlertsOnly
                      ? "border-rose-400 bg-rose-50 text-rose-700 hover:bg-rose-100"

                </button>
                <select value={pageSize} onChange={e => { setPageSize(+e.target.value); setPage(1); }}
                  className={`text-sm border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 ${input}`}>

                <button onClick={exportCSV}

              {/* Table */}
              <div className="overflow-x-auto no-scrollbar">
                <table className="w-full text-sm">
                  <thead>
                    <tr className={th}>

                        ["name",         "Campaign",     "text-left pl-2"],
                        ["email_sent",   "Sent",         "text-right"],
                        ["email_opened", "Open Rate",    "text-right"],
                        ["reply_count",  "Reply Rate",   "text-right"],
                        ["click_count",  "Click Rate",   "text-right"],
                        ["bounce_count", "Bounced",      "text-right"],

                  <tbody>
                    {loading ? (
                      Array.from({ length: 5 }, (_, i) => (

                            <td key={j} className="py-3 px-3">

                    ) : pageRows.length === 0 ? (

                    ) : (
                      pageRows.map((r, i) => {
                        // Per-row alert level for highlighting
                        // Note: opens_exceed_sent flags date-range skew (narrow range can show
                        // opens from older emails counted today → open_count_unique > emails_sent_count).
                        // We cap the displayed rate at 100% and show a ⚠ badge in those cases.
                        const rawOpenRate = r.email_sent > 0 ? (r.email_opened / r.email_sent) * 100 : 0;
                        const rowOpenRate = Math.min(rawOpenRate, 100);
                        const rowAlert = r.email_sent > 0 && rowOpenRate < alertThreshold
                          ? (rowOpenRate < 25 ? "critical" : "warning")

                        return (
                        <React.Fragment key={r.id || i}>
                          {/* Clickable campaign row */}
                          <tr
                            onClick={() => {
                              setExpandedId(prev => prev === r.id ? null : r.id);

                            title={rowAlert ? "Low open rate may indicate a weak subject line, poor list targeting, or deliverability issues." : undefined}
                            className={`border-t transition-colors cursor-pointer select-none ${
                              expandedId === r.id
                                ? (dark ? "bg-indigo-900/30" : "bg-indigo-50")
                                : rowAlert === "critical"
                                  ? (dark ? "border-rose-900 bg-rose-900/20 hover:bg-rose-900/30" : "border-rose-100 bg-rose-50/70 hover:bg-rose-50")
                                  : rowAlert === "warning"
                                    ? (dark ? "border-amber-900 bg-amber-900/15 hover:bg-amber-900/25" : "border-amber-100 bg-amber-50/60 hover:bg-amber-50")
                                    : (dark ? "border-gray-700 hover:bg-gray-700/50" : "border-gray-100 hover:bg-gray-50")
                            }`}
                          >
                            {/* Chevron expand indicator */}
                            <td className="py-3 pl-3 pr-1 w-8">
                              <Icon
                                name={expandedId === r.id ? "chevDown" : "chevR"}
                                size={12}
                                className={`transition-transform ${dark ? "text-gray-500" : "text-gray-400"}`}
                              />
                            </td>
                            <td className={`py-3 pl-2 pr-3 font-medium max-w-xs truncate ${dark ? "text-white" : "text-gray-900"}`}>
                              {rowAlert && <span className="mr-1">{rowAlert === "critical" ? "🔴" : "🟠"}</span>}
                              {r.name}
                            </td>
                            <td className={`py-3 px-3 text-right tabular-nums ${td}`}>{r.email_sent.toLocaleString()}</td>
                            {/* Open Rate — colored by alert level; capped at 100% if opens > sent */}
                            <td className={`py-3 px-3 text-right tabular-nums font-medium ${
                              rowAlert === "critical" ? "text-rose-600" :
                              rowAlert === "warning"  ? "text-amber-600" : td
                            }`}
                              title={r.opens_exceed_sent
                                ? `Open count (${r.email_opened}) exceeds emails sent (${r.email_sent}) — this happens when the date range is narrow and Instantly counts opens from previously sent emails. Showing capped rate.`

                              {rowOpenRate.toFixed(1)}%{r.opens_exceed_sent && <span className="ml-0.5 text-amber-500" title="Open count exceeds sent — date-range skew">⚠</span>}
                            </td>
                            <td className={`py-3 px-3 text-right tabular-nums ${td}`}>{pct(r.reply_count, r.email_sent)}</td>
                            <td className={`py-3 px-3 text-right tabular-nums ${td}`}>{pct(r.click_count, r.email_sent)}</td>
                            <td className={`py-3 px-3 text-right tabular-nums text-rose-500 font-medium`}>{r.bounce_count.toLocaleString()}</td>
                            <td className={`py-3 px-3 text-right tabular-nums ${td}`}
                                title={r.opps_derived ? "Estimated: 30% of replies (CRM integration not active)" : undefined}>
                              {r.opps_derived
                                ? <span className={`${dark ? "text-amber-400" : "text-amber-600"}`}>~{r.opportunities.toLocaleString()}</span>
                                : r.opportunities.toLocaleString()

                            </td>
                            <td className={`py-3 px-3 text-right tabular-nums ${td}`}>
                              {r.email_gap != null ? `${r.email_gap}d` : "—"}
                            </td>
                            <td className="py-3 px-3 pr-4 text-center">
                              <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ${
                                r.status === "Active"    ? "bg-emerald-100 text-emerald-700" :
                                r.status === "Paused"    ? "bg-amber-100 text-amber-700" :
                                "bg-gray-100 text-gray-500"}`}>
                                {r.status}
                              </span>
                            </td>
                          </tr>

                          {/* Accordion: DailyBreakdown panel */}
                          {expandedId === r.id && (
                            <tr className={`border-t ${dark ? "border-indigo-800" : "border-indigo-100"}`}>
                              <td colSpan={10} className="p-0">
                                <DailyBreakdown

                                  dark={dark}
                                  onClose={() => setExpandedId(null)}
                                />

                      );})
                    )}

                </table>

              {/* Pagination */}

                  <div className="flex items-center gap-1">
                    <PagBtn icon="chevLL" disabled={page === 1}         onClick={() => setPage(1)} dark={dark} />

          </main>

          {/* ══════════════════════════════════════════════════════
              ADD ACCOUNT MODAL
          ══════════════════════════════════════════════════════ */}
          {showAddModal && (
            <div
              className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm"
              onClick={e => { if (e.target === e.currentTarget) { setShowAddModal(false); setModalError(""); } }}>
              <div className={`rounded-2xl border shadow-2xl w-full max-w-md mx-4 p-6 ${card}`}
                   onClick={e => e.stopPropagation()}>

                {/* Modal header */}
                <div className="flex items-center justify-between mb-5">
                  <div className="flex items-center gap-3">
                    <div className={`w-9 h-9 rounded-xl flex items-center justify-center ${dark ? "bg-indigo-900/50" : "bg-indigo-50"}`}>
                      <Icon name="plus" size={16} className="text-indigo-500" />
                    </div>
                    <div>
                      <h2 className={`font-semibold text-base ${dark ? "text-white" : "text-gray-900"}`}>
                        Add New Account
                      </h2>
                      <p className={`text-xs ${dark ? "text-gray-400" : "text-gray-500"}`}>
                        API key is stored on the server only
                      </p>
                    </div>
                  </div>
                  <button onClick={() => { setShowAddModal(false); setModalError(""); setModalName(""); setModalKey(""); }}
                    className={`p-1.5 rounded-lg transition-colors ${dark ? "hover:bg-gray-700 text-gray-400" : "hover:bg-gray-100 text-gray-500"}`}>
                    <Icon name="x" size={16} />
                  </button>
                </div>

                <div className="space-y-4">
                  {/* Account name field */}
                  <div>
                    <label className={`block text-xs font-semibold mb-1.5 ${dark ? "text-gray-300" : "text-gray-700"}`}>
                      Account Name
                    </label>
                    <input
                      type="text"
                      placeholder="e.g. Main Account, Client A, Agency…"
                      value={modalName}
                      onChange={e => { setModalName(e.target.value); setModalError(""); }}
                      onKeyDown={e => e.key === "Enter" && handleSaveAccount()}
                      className={`w-full px-3 py-2.5 rounded-lg border text-sm focus:outline-none focus:ring-2 transition ${input}`}
                    />

                  {/* API key field */}

                    <label className={`block text-xs font-semibold mb-1.5 ${dark ? "text-gray-300" : "text-gray-700"}`}>
                      Instantly API Key

                    <div className="relative">
                      <input
                        type={modalKeyVis ? "text" : "password"}
                        placeholder="Paste your API key from app.instantly.ai…"
                        value={modalKey}
                        onChange={e => { setModalKey(e.target.value); setModalError(""); }}
                        onKeyDown={e => e.key === "Enter" && handleSaveAccount()}
                        className={`w-full pl-3 pr-9 py-2.5 rounded-lg border text-sm font-mono focus:outline-none focus:ring-2 transition ${input}`}
                      />
                      <button onClick={() => setModalKeyVis(v => !v)}
                        className={`absolute right-2.5 top-1/2 -translate-y-1/2 ${dark ? "text-gray-400 hover:text-gray-200" : "text-gray-400 hover:text-gray-600"}`}>
                        <Icon name={modalKeyVis ? "eyeOff" : "eye"} size={14} />
                      </button>

                    <p className={`text-xs mt-1.5 ${dark ? "text-gray-500" : "text-gray-400"}`}>
                      Find it at{" "}
                      <span className="text-indigo-500 font-medium">app.instantly.ai → Settings → API</span>.
                      Stored in <span className="font-medium">accounts.json</span> on the server — never sent to the browser.
                    </p>

                  {/* Error message */}
                  {modalError && (
                    <div className="flex items-start gap-2.5 px-3.5 py-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-sm">

                      {modalSaving ? "Saving & Testing…" : "Save & Connect"}
                    </button>
                    <button
                      onClick={() => { setShowAddModal(false); setModalError(""); setModalName(""); setModalKey(""); }}
                      disabled={modalSaving}
                      className={`px-4 py-2.5 text-sm font-medium rounded-lg border transition-colors disabled:opacity-50 ${dark ? "border-gray-600 hover:bg-gray-700 text-gray-300" : "border-gray-300 hover:bg-gray-50 text-gray-700"}`}>

          {toast && (

              toast.type === "success"
                ? "bg-emerald-600 text-white"
                : "bg-rose-600 text-white"
            }`}>
              <Icon name={toast.type === "success" ? "check" : "bounce"} size={14} />
