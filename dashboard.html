    // ══════════════════════════════════════════════════════════════════
    // CAMPAIGN TRACKER PAGE  (Phase 3 — new page, zero changes to existing)
    // ══════════════════════════════════════════════════════════════════
    function CampaignTracker({ dark, connected, selectedAcc, card, input, th, td }) {

      const [rows,              setRows]             = useState([]);
      const [meta,              setMeta]             = useState({});
      const [loading,           setLoading]          = useState(false);
      const [lastSync,          setLastSync]         = useState(null);
      const [autoRefresh,       setAutoRefresh]      = useState(true);
      const [search,            setSearch]           = useState("");
      const [stageFilter,       setStageFilter]      = useState("All");
      const [showAdd,           setShowAdd]          = useState(false);
      const [editId,            setEditId]           = useState(null);
      const [editForm,          setEditForm]         = useState({});
      const [savingMeta,        setSavingMeta]       = useState(false);
      // Add modal — select existing Instantly campaign + fill metadata
      const [allInstantly,      setAllInstantly]     = useState([]); // all campaigns from Instantly
      const [addSelectedId,     setAddSelectedId]    = useState(""); // chosen campaign id
      const [addForm,           setAddForm]          = useState({
        email_group:"", event_date:"", campaign_start_date: toISO(TODAY),
        total_steps:"", tammy_exhibitors:"", twentyx20_exhibitors:"",
        apollo_exhibitors:"", campaign_limit:"", sequence_gap:"", today_prediction:"",
      });
      const [addError,          setAddError]         = useState("");
      const [addSaving,         setAddSaving]        = useState(false);

      // ── Data loading ─────────────────────────────────────────────
      const buildRows = useCallback((rawCampaigns, analyticsMap, metaData) => {
        // Safety guard: if Instantly returns an error object instead of array,
        // never let it reach .map() — that would throw and leave rows empty
        if (!Array.isArray(rawCampaigns)) {
          console.warn("[buildRows] rawCampaigns is not an array:", rawCampaigns);
          return [];
        }
        return rawCampaigns.map(raw => {
          const id    = raw.id;
          const stats = analyticsMap[id] || {};
          const m     = metaData[id]     || {};

          const emailSent = Number(stats.emails_sent_count ?? 0);
          const bounced   = Number(stats.bounced_count     ?? 0);
          const replied   = Number(stats.reply_count_unique ?? stats.reply_count ?? 0);
          const rawOpps   = stats.total_opportunities ?? stats.opportunities ?? -1;
          const totalLeads= rawOpps >= 0 ? Number(rawOpps) : (replied > 0 ? Math.round(replied * 0.3) : 0);
          const replyRate = emailSent > 0 ? (replied / emailSent * 100) : 0;

          // Status
          const st = raw.status ?? "";
          const status = st===2||/paus/i.test(String(st)) ? "Paused"
                       : st===3||/complet/i.test(String(st)) ? "Completed" : "Active";

          // Dates
          const eventDateStr = m.event_date || "";
          const startDateStr = m.campaign_start_date
            || (raw.timestamp_created ? raw.timestamp_created.slice(0,10) : "");
          const eventDate  = eventDateStr  ? new Date(eventDateStr  + "T00:00:00") : null;
          const startDate_ = startDateStr  ? new Date(startDateStr  + "T00:00:00") : null;

          // BI Stage (weeks total = event - campaign start)
          const biStageWeeks = eventDate && startDate_
            ? Math.ceil((eventDate - startDate_) / (7*24*60*60*1000)) : null;

          // BI Stage (current) = based on weeks remaining before event
          const weeksLeft = eventDate
            ? Math.ceil((eventDate - TODAY) / (7*24*60*60*1000)) : null;
          const biStageCurrent =
            weeksLeft === null  ? "—"
            : weeksLeft > 12   ? "Planning"
            : weeksLeft > 8    ? "Pre-Campaign"
            : weeksLeft > 4    ? "Active Campaign"
            : weeksLeft > 0    ? "Final Push"
            : "Post-Event";

          // Total steps (meta overrides, then sequence inspection)
          let totalSteps = Number(m.total_steps || 0);
          if (!totalSteps && Array.isArray(raw.sequences)) {
            totalSteps = raw.sequences[0]?.steps?.length || 0;
          }

          // Sequence gap (meta overrides, then sequence inspection)
          let seqGap = m.sequence_gap != null ? Number(m.sequence_gap) : null;
          if (seqGap == null && Array.isArray(raw.sequences)) {
            const steps = raw.sequences[0]?.steps || [];
            if (steps.length > 1) {
              seqGap = steps[1]?.delay ?? steps[1]?.wait_days ?? steps[1]?.timing ?? null;
            }
          }
          if (seqGap == null) seqGap = raw.email_gap ?? raw.sequence_gap ?? null;
          if (seqGap != null) seqGap = Number(seqGap) || null;

          // Current step estimate
          const tammyEx = Number(m.tammy_exhibitors || 0);
          const currentStep = totalSteps > 0 && tammyEx > 0
            ? Math.min(totalSteps, Math.ceil(emailSent / Math.max(1, tammyEx))) : null;

          // Campaign limit / today prediction / remaining
          const campaignLimit   = m.campaign_limit  != null ? Number(m.campaign_limit) : null;
          const todayPrediction = m.today_prediction!= null ? Number(m.today_prediction): null;
          const remainingEmails = todayPrediction != null
            ? Math.max(0, todayPrediction - emailSent) : null;

          // Next trigger date
          let nextTriggerDate = null;
          if (seqGap != null && currentStep != null && currentStep < totalSteps) {
            const d = new Date(TODAY);
            d.setDate(d.getDate() + seqGap);
            nextTriggerDate = toISO(d);
          }

          return {
            id, name: raw.name || "Untitled", status,
            email_group:            m.email_group              || "—",
            event_date:             eventDateStr               || null,
            campaign_start_date:    startDateStr               || null,
            total_steps:            totalSteps,
            bi_stage_weeks:         biStageWeeks,
            today_date:             toISO(TODAY),
            bi_stage_current:       biStageCurrent,
            tammy_exhibitors:       Number(m.tammy_exhibitors        || 0),
            twentyx20_exhibitors:   Number(m.twentyx20_exhibitors    || m.booth_size_exhibitors || 0),
            apollo_exhibitors:      Number(m.apollo_exhibitors       || m.apollo_extracted      || 0),
            total_leads:            totalLeads,
            reply_rate:             replyRate,
            bounced,
            today_prediction:       todayPrediction,
            campaign_limit:         campaignLimit,
            email_sent:             emailSent,
            remaining_emails:       remainingEmails,
            current_step:           currentStep,
            sequence_gap:           seqGap,
            next_trigger_date:      nextTriggerDate,
            _hasMeta:               !!metaData[id],
          };
        });
      }, []);

      const [syncError, setSyncError] = useState(null);

      const loadAll = useCallback(async () => {
        if (!connected) return;
        setLoading(true);
        setSyncError(null);
        try {
          // ── loadCampaigns() handles cursor pagination + apiGet() error handling ──
          // Raw fetch() was silently returning { error: "..." } objects (not arrays),
          // causing buildRows to throw on .map() and leaving rows = [].
          const [campR, anaR, metaR] = await Promise.allSettled([
            loadCampaigns(null),                              // cursor-paginated, returns array
            apiGet("/campaigns/analytics?limit=1000", null), // throws on non-2xx
            fetch("/api/campaigns-meta").then(r => {
              if (!r.ok) throw new Error(`campaigns-meta returned ${r.status}`);
              return r.json();
            }),
          ]);

          // Always ensure we have arrays — never pass error objects to buildRows
          const rawC  = campR.status  === "fulfilled" && Array.isArray(campR.value)
            ? campR.value : [];
          const rawA  = anaR.status   === "fulfilled"
            ? (Array.isArray(anaR.value) ? anaR.value
               : Array.isArray(anaR.value?.items) ? anaR.value.items
               : Array.isArray(anaR.value?.data)  ? anaR.value.data  : [])
            : [];
          const metaD = metaR.status  === "fulfilled" && metaR.value && typeof metaR.value === "object"
            ? metaR.value : {};

          if (campR.status === "rejected") {
            console.error("[CampaignTracker] campaigns fetch failed:", campR.reason?.message);
            setSyncError("Could not load campaigns: " + (campR.reason?.message || "unknown error"));
          }

          const aMap = {};
          rawA.forEach(a => { const id = a.id || a.campaign_id; if (id) aMap[id] = a; });

          setMeta(metaD);
          setRows(buildRows(rawC, aMap, metaD));
          setLastSync(new Date());
          console.log(`[CampaignTracker] loaded ${rawC.length} campaigns, ${rawA.length} analytics rows`);
        } catch(e) {
          console.error("[CampaignTracker] loadAll error:", e.message);
          setSyncError(e.message);
        } finally {
          setLoading(false);
        }
      }, [connected, buildRows]);

      useEffect(() => {
        loadAll();
        if (!autoRefresh) return;
        const iv = setInterval(loadAll, 5 * 60 * 1000);
        return () => clearInterval(iv);
      }, [loadAll, autoRefresh]);

      // ── Sort state ───────────────────────────────────────────────
      const [trackerSortCol, setTrackerSortCol] = useState("email_sent");
      const [trackerSortDir, setTrackerSortDir] = useState("desc");

      const handleTrackerSort = useCallback((key) => {
        setTrackerSortCol(prev => {
          if (prev === key) { setTrackerSortDir(d => d === "asc" ? "desc" : "asc"); return key; }
          setTrackerSortDir("desc");
          return key;
        });
      }, []);

      // ── Filtered + sorted rows ───────────────────────────────────
      const filtered = useMemo(() => {
        let r = rows;
        if (search) r = r.filter(c => c.name.toLowerCase().includes(search.toLowerCase())
          || c.email_group.toLowerCase().includes(search.toLowerCase()));
        if (stageFilter !== "All") r = r.filter(c => c.bi_stage_current === stageFilter);
        // Sort
        r = [...r].sort((a, b) => {
          const av = a[trackerSortCol] ?? (typeof a[trackerSortCol] === "number" ? -Infinity : "");
          const bv = b[trackerSortCol] ?? (typeof b[trackerSortCol] === "number" ? -Infinity : "");
          let cmp = 0;
          if (typeof av === "number" && typeof bv === "number") {
            cmp = av - bv;
          } else {
            cmp = String(av ?? "").localeCompare(String(bv ?? ""));
          }
          return trackerSortDir === "asc" ? cmp : -cmp;
        });
        return r;
      }, [rows, search, stageFilter, trackerSortCol, trackerSortDir]);

      const allStages = useMemo(() =>
        ["All", ...new Set(rows.map(c => c.bi_stage_current).filter(s => s !== "—"))],
      [rows]);

      // ── Save meta for a campaign ─────────────────────────────────
      const [saveError, setSaveError] = useState(null);

      const saveMeta = useCallback(async (campaignId, fields) => {
        setSavingMeta(true);
        setSaveError(null);
        try {
          const r = await fetch("/api/campaigns-meta", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({ campaign_id: campaignId, ...fields }),
          });
          // Check content-type before parsing — HTML response means server restart needed
          const ct = r.headers.get("content-type") || "";
          if (!ct.includes("application/json")) {
            throw new Error(`Server returned HTML instead of JSON. Please restart app.js (stop it with Ctrl+C and run it again).`);
          }
          const json = await r.json();
          if (!r.ok || json.error) throw new Error(json.error || `Server error ${r.status}`);
          setMeta(prev => ({ ...prev, [campaignId]: { ...(prev[campaignId]||{}), ...fields } }));
          await loadAll();
          setEditId(null);
        } catch(e) {
          console.error("[saveMeta] error:", e.message);
          setSaveError(e.message);
        }
        finally { setSavingMeta(false); }
      }, [loadAll]);

      // ── Open Add modal — fetch Instantly campaigns for the picker ──
      const openAddModal = useCallback(async () => {
        setAddError(""); setAddSelectedId(""); setAddSaving(false);
        setAddForm({
          email_group:"", event_date:"", campaign_start_date: toISO(TODAY),
          total_steps:"", tammy_exhibitors:"", twentyx20_exhibitors:"",
          apollo_exhibitors:"", campaign_limit:"", sequence_gap:"", today_prediction:"",
        });
        setShowAdd(true);       // open modal first so user sees it immediately
        setAllInstantly(null);  // null = loading state

        try {
          // Use loadCampaigns() — handles full cursor pagination so all campaigns appear
          const list = await loadCampaigns(null);
          // Only show campaigns NOT already tracked in campaigns-meta.json
          const alreadyTracked = new Set(Object.keys(meta));
          const available = list.filter(c => !alreadyTracked.has(c.id));
          console.log(`[openAddModal] ${list.length} total, ${available.length} available to add`);
          setAllInstantly(available);
        } catch(e) {
          console.error("[openAddModal] fetch error:", e.message);
          setAllInstantly([]); // empty → show "no campaigns" message
        }
      }, [meta]);

      // ── Save metadata for selected existing Instantly campaign ────
      const handleAddCampaign = useCallback(async () => {
        if (!addSelectedId) { setAddError("Please select a campaign from the list."); return; }
        setAddSaving(true); setAddError("");
        try {
          const r = await fetch("/api/campaigns-meta", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({ campaign_id: addSelectedId, ...addForm }),
          });
          const json = await r.json();
          if (!r.ok || json.error) { setAddError(json.error || "Failed to save."); return; }
          setShowAdd(false);
          await loadAll();
        } catch(e) { setAddError(e.message); }
        finally { setAddSaving(false); }
      }, [addSelectedId, addForm, loadAll]);

      // ── Export CSV (matches Google Sheet column order exactly) ──
      const exportCSV = () => {
        const cols = [
          "Email Group","Event Date","Campaign Start Date","Total Steps",
          "Standard Campaign Name (11w - 18w)",
          "BI-Stage (weeks)","Today's date","BI-Stage (Current)",
          "Tammy Exhibitors","20x20 Exhibitors","Apollo Exhibitors",
          "Total Leads","Reply Rate","Bounced",
          toISO(TODAY),          // yellow col: today's prediction labeled with today's date
          "Campaign Limit","Email Sent",
          "Column U (-) Column W", // remaining = campaign limit - email sent
          "Current Step","Seq Gap","Next Trigger Date","Status",
        ];
        const dataRows = filtered.map(c => [
          c.email_group, c.event_date||"", c.campaign_start_date||"", c.total_steps||"",
          `"${c.name.replace(/"/g,'""')}"`,
          c.bi_stage_weeks != null ? c.bi_stage_weeks + " w" : "",
          c.today_date, c.bi_stage_current,
          c.tammy_exhibitors||"", c.twentyx20_exhibitors||"", c.apollo_exhibitors||"",
          c.total_leads, c.reply_rate != null ? c.reply_rate.toFixed(1) + "%" : "",
          c.bounced,
          c.today_prediction??"",
          c.campaign_limit??"", c.email_sent,
          c.remaining_emails??"",
          c.current_step??"", c.sequence_gap??"",
          c.next_trigger_date||"", c.status,
        ].join(","));
        const blob = new Blob([[cols.join(","), ...dataRows].join("\n")], {type:"text/csv"});
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement("a"); a.href=url;
        a.download = `campaign_tracker_${(selectedAcc?.name||"").replace(/[^a-z0-9]/gi,"_").toLowerCase()}_${toISO(TODAY)}.csv`; a.click();
        URL.revokeObjectURL(url);
      };

      // ── Cell helpers ─────────────────────────────────────────────
      const NUM  = (v, fallback="—") => v!=null ? Number(v).toLocaleString() : fallback;
      const STAT = (v, fallback="—") => v!=null ? v : fallback;
      const stageColor = s => ({
        "Planning":       dark?"text-gray-400":"text-gray-500",
        "Pre-Campaign":   dark?"text-blue-400":"text-blue-600",
        "Active Campaign":dark?"text-emerald-400":"text-emerald-600",
        "Final Push":     dark?"text-amber-400":"text-amber-600",
        "Post-Event":     dark?"text-gray-500":"text-gray-400",
      }[s] || "");

      const bgCard = dark ? "bg-gray-900" : "bg-gray-50";

      // ── Edit form field helper ───────────────────────────────────
      const ef = (field) => ({
        value: editForm[field] ?? "",
        onChange: e => setEditForm(f => ({...f, [field]: e.target.value})),
        className: `w-full px-2 py-1 text-xs border rounded focus:outline-none focus:ring-1 focus:ring-indigo-400 ${input}`,
      });

      // Columns matching Google Sheet exactly (key, label, minWidth, colColor)
      const todayLabel = toISO(TODAY); // yellow column header = today's date
      const COLS = [
        ["email_group",           "Email Group",                    "130px", "purple"],
        ["event_date",            "Event Date",                     "100px", "purple"],
        ["campaign_start_date",   "Campaign Start Date",            "110px", "purple"],
        ["total_steps",           "Total Steps",                    "70px",  "purple"],
        ["name",                  "Standard Campaign Name (11w-18w)","240px", "purple"],
        ["bi_stage_weeks",        "BI-Stage (weeks)",               "90px",  "purple"],
        ["today_date",            "Today's date",                   "100px", "purple"],
        ["bi_stage_current",      "BI-Stage (Current)",             "115px", "purple"],
        ["tammy_exhibitors",      "Tammy Exhibitors",               "100px", "purple"],
        ["twentyx20_exhibitors",  "20x20 Exhibitors",               "100px", "purple"],
        ["apollo_exhibitors",     "Apollo Exhibitors",              "100px", "purple"],
        ["total_leads",           "Total Leads",                    "80px",  "purple"],
        ["reply_rate",            "Reply Rate",                     "80px",  "purple"],
        ["bounced",               "Bounced",                        "75px",  "purple"],
        ["today_prediction",      todayLabel,                       "100px", "yellow"],
        ["campaign_limit",        "Campaign Limit",                 "100px", "blue"],
        ["email_sent",            "Email Sent",                     "80px",  "blue"],
        ["remaining_emails",      "Column U (-) Column W",          "130px", "green"],
        ["current_step",          "Current Step",                   "80px",  "green"],
        ["sequence_gap",          "Seq Gap",                        "70px",  "green"],
        ["next_trigger_date",     "Next Trigger Date",              "120px", "green"],
      ];

      const EDITABLE_META_FIELDS = [
        ["email_group",          "Email Group",          "text"],
        ["event_date",           "Event Date",           "date"],
        ["campaign_start_date",  "Campaign Start Date",  "date"],
        ["total_steps",          "Total Steps",          "number"],
        ["tammy_exhibitors",     "Tammy Exhibitors",     "number"],
        ["twentyx20_exhibitors", "20x20 Exhibitors",     "number"],
        ["apollo_exhibitors",    "Apollo Exhibitors",    "number"],
        ["today_prediction",     "Today's Prediction",  "number"],
        ["campaign_limit",       "Campaign Limit",       "number"],
        ["sequence_gap",         "Seq Gap (days)",       "number"],
      ];

      return (
        <div className={`${bgCard} min-h-screen`}>
          {/* ── Tracker header bar ──────────────────────────────── */}
          <div className={`border-b px-6 py-4 flex flex-wrap items-center gap-3 ${card}`}>
            <h2 className={`font-bold text-base ${dark?"text-white":"text-gray-900"}`}>
              🗂 Campaign Tracker
            </h2>
            <span className={`text-xs px-2 py-0.5 rounded-full border ${dark?"border-gray-600 text-gray-400":"border-gray-200 text-gray-500"}`}>
              {filtered.length} campaigns
            </span>

            {/* Sync error badge */}
            {syncError && (
              <span className={`flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-lg border font-medium ${dark?"border-rose-800 bg-rose-900/30 text-rose-300":"border-rose-200 bg-rose-50 text-rose-700"}`}
                    title={syncError}>
                ⚠ Sync error — check console (F12)
                <button onClick={()=>setSyncError(null)} className="opacity-60 hover:opacity-100">✕</button>
              </span>
            )}

            <div className="flex-1" />

            {/* Search */}
            <div className="relative">
              <Icon name="search" size={13} className={`absolute left-2.5 top-1/2 -translate-y-1/2 ${dark?"text-gray-500":"text-gray-400"}`} />
              <input placeholder="Search campaigns…" value={search} onChange={e=>setSearch(e.target.value)}
                className={`pl-8 pr-3 py-1.5 text-sm rounded-lg border focus:outline-none focus:ring-2 w-48 ${input}`} />
            </div>

            {/* Stage filter */}
            <select value={stageFilter} onChange={e=>setStageFilter(e.target.value)}
              className={`text-sm border rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 ${input}`}>
              {allStages.map(s=><option key={s}>{s}</option>)}
            </select>

            {/* Manual refresh */}
            <button onClick={loadAll} disabled={loading}
              className={`flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-lg border transition-colors ${dark?"border-gray-600 hover:bg-gray-700 text-gray-300":"border-gray-300 hover:bg-gray-50 text-gray-600"} disabled:opacity-50`}>
              <Icon name="refresh" size={11} className={loading?"animate-spin":""} />
              {loading ? "Syncing…" : "Refresh"}
            </button>

            {/* Auto-refresh toggle */}
            <button onClick={()=>setAutoRefresh(v=>!v)}
              className={`flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-lg border transition-colors ${
                autoRefresh ? "border-emerald-400 bg-emerald-50 text-emerald-700" : (dark?"border-gray-600 text-gray-400 hover:bg-gray-700":"border-gray-300 text-gray-500 hover:bg-gray-50")
              }`}>
              <Icon name="refresh" size={11} /> {autoRefresh?"Auto-sync ON":"Auto-sync OFF"}
            </button>

            {/* Last sync */}
            {lastSync && (
              <span className={`text-xs ${dark?"text-gray-500":"text-gray-400"}`}>
                Synced {lastSync.toLocaleTimeString()}
              </span>
            )}

            <button onClick={exportCSV}
              className={`flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-lg border transition-colors ${dark?"border-gray-600 hover:bg-gray-700 text-gray-300":"border-gray-300 hover:bg-gray-50 text-gray-600"}`}>
              <Icon name="download" size={12} /> Export CSV
            </button>

            {/* Add Campaign — selects existing Instantly campaign */}
            {connected && (
              <button onClick={openAddModal}
                className="flex items-center gap-2 px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-lg transition-colors">
                <Icon name="plus" size={13} /> Add Campaign
              </button>
            )}

            {!connected && (
              <span className={`text-xs ${dark?"text-amber-400":"text-amber-600"}`}>
                ⚠️ Connect an account to load campaigns
              </span>
            )}
          </div>

          {/* ── Table ───────────────────────────────────────────── */}
          <div className="overflow-x-auto">
            <table className="text-xs border-collapse w-max min-w-full">
              <thead>
                <tr>
                  <th className="sticky left-0 z-10 py-2 px-3 text-left font-semibold w-8 border-b"
                      style={{background: dark?"#374151":"#f9fafb", borderColor: dark?"#4b5563":"#e5e7eb"}} />
                  {COLS.map(([key, label, width, colColor]) => {
                    const bg = dark ? "#374151" : {
                      purple: "#e9d5ff", yellow: "#fde68a",
                      blue: "#bfdbfe",  green: "#bbf7d0",
                    }[colColor] || "#f9fafb";
                    const txtColor = dark ? "#d1d5db" : {
                      purple:"#6b21a8", yellow:"#92400e",
                      blue:"#1e3a8a",   green:"#14532d",
                    }[colColor] || "#374151";
                    const isActive = trackerSortCol === key;
                    const arrow = isActive ? (trackerSortDir === "asc" ? " ↑" : " ↓") : "";
                    return (
                      <th key={key}
                        onClick={() => handleTrackerSort(key)}
                        className={`py-2 px-3 font-semibold text-xs tracking-wide whitespace-nowrap border-b cursor-pointer select-none ${dark?"border-gray-600":"border-gray-300"} ${key==="name"?"sticky left-8 z-10 text-left":"text-right"} hover:opacity-75 transition-opacity`}
                        style={{ minWidth: width, background: bg, color: txtColor }}>
                        {label}{arrow}
                      </th>
                    );
                  })}
                </tr>
              </thead>
              <tbody>
                {loading ? (
                  Array.from({length:5},(_,i)=>(
                    <tr key={i} className={`border-b ${dark?"border-gray-700":"border-gray-100"}`}>
                      {Array.from({length:COLS.length+1},(_,j)=>(
                        <td key={j} className="py-2.5 px-3">
                          <div className={`h-3 rounded animate-pulse ${dark?"bg-gray-700":"bg-gray-100"}`} style={{width:j===1?"120px":"60px"}} />
                        </td>
                      ))}
                    </tr>
                  ))
                ) : filtered.length === 0 ? (
                  <tr><td colSpan={COLS.length+1} className={`py-16 text-center text-sm ${dark?"text-gray-500":"text-gray-400"}`}>
                    {connected ? "No campaigns found. Click \"Add Campaign\" to get started." : "Connect an account to load campaigns."}
                  </td></tr>
                ) : filtered.map(c => {
                  const isEditing = editId === c.id;
                  const isLowPerf = c.email_sent > 0 && (c.total_leads / c.email_sent) < 0.02;
                  const isNearLimit = c.remaining_emails != null && c.remaining_emails < 10;
                  const rowBg = isEditing
                    ? (dark?"bg-indigo-900/30":"bg-indigo-50")
                    : isNearLimit
                      ? (dark?"bg-amber-900/15":"bg-amber-50/60")
                      : (dark?"hover:bg-gray-700/40":"hover:bg-gray-50/80");

                  return (
                    <React.Fragment key={c.id}>
                      <tr className={`border-b transition-colors ${dark?"border-gray-700":"border-gray-100"} ${rowBg}`}>
                        {/* Edit toggle */}
                        <td className="sticky left-0 z-10 py-2 px-2 text-center"
                            style={{background: dark?(isEditing?"#1e1b4b":"#111827"):(isEditing?"#eef2ff":"#ffffff")}}>
                          <button
                            onClick={() => {
                              if (isEditing) { setEditId(null); }
                              else { setEditId(c.id); setEditForm(meta[c.id] || {}); }
                            }}
                            className={`p-1 rounded transition-colors ${isEditing?(dark?"bg-indigo-700 text-white":"bg-indigo-600 text-white"):(dark?"hover:bg-gray-700 text-gray-500":"hover:bg-gray-100 text-gray-400")}`}
                            title={isEditing?"Close edit":"Edit metadata"}>
                            <Icon name={isEditing?"x":"pencil"} size={11} />
                          </button>
                        </td>

                        {/* ── Data cells ───────────────────────── */}
                        {COLS.map(([key]) => {
                          const isNameCol = key === "name";
                          const stickyStyle = isNameCol
                            ? { background: dark?(isEditing?"#1e1b4b":"#111827"):(isEditing?"#eef2ff":"#ffffff") }
                            : {};

                          let cellContent;
                          switch(key) {
                            case "name":
                              cellContent = (
                                <span className={`font-medium ${dark?"text-white":"text-gray-800"}`}>
                                  {c.name}
                                  {!c._hasMeta && <span className={`ml-1.5 text-xs px-1 rounded ${dark?"bg-gray-700 text-gray-500":"bg-gray-100 text-gray-400"}`}>✎ add info</span>}
                                </span>

                            case "today_date":

                            default:
                              const v = c[key];

                          return (
                            <td key={key}

                              style={stickyStyle}>

                      </tr>

                      {/* ── Inline edit row ────────────────────── */}
                      {isEditing && (

          </div>

          {/* ── Add Campaign Modal ──────────────────────────────── */}

                 onClick={e=>{ if(e.target===e.currentTarget){setShowAdd(false);setAddError("");} }}>
              <div className={`rounded-2xl border shadow-2xl w-full max-w-2xl mx-4 p-6 max-h-[90vh] overflow-y-auto ${card}`}
                   onClick={e=>e.stopPropagation()}>

                <div className="flex items-center justify-between mb-5">
                  <div>
                    <h2 className={`font-bold text-base ${dark?"text-white":"text-gray-900"}`}>+ Add Campaign to Tracker</h2>

                  {allInstantly === null ? (

                    {addSaving ? <span className="animate-spin">↻</span> : <Icon name="plus" size={14} />}

    // ══════════════════════════════════════════════════════════════════
    // DAILY BREAKDOWN COMPONENT
    // Shown when a campaign row is expanded.
    // Fetches /campaign-daily/:id?from=&to= and renders line charts.
    // ══════════════════════════════════════════════════════════════════
    // ── Step Distribution sub-component ──────────────────────────────────────
    // Fetches a wider date window (covering the full sequence length) and groups
    // daily `sent` counts into per-step buckets based on email_gap intervals.
    // The first non-zero send day is treated as "Step 1 Day 0".
    function StepDistribution({ campaign, endDate, dark }) {
      const { step_count, email_gap, id: campaignId, name } = campaign;
      const [steps,    setSteps]    = useState(null); // [{ label, sent, isActive }, ...]
      const [loading,  setLoading]  = useState(true);

      useEffect(() => {
        if (!step_count || step_count < 2 || !email_gap) { setLoading(false); return; }
        setLoading(true);
        // Fetch enough history to cover the full sequence: step_count × email_gap × 1.5
        const daysBack  = Math.ceil(step_count * email_gap * 1.5) + 7;
        const wideStart = new Date(endDate);
        wideStart.setDate(wideStart.getDate() - daysBack);
        const from = toISO(wideStart);
        const to   = toISO(endDate);

        fetch(`/campaign-daily/${encodeURIComponent(campaignId)}?from=${from}&to=${to}`)
          .then(r => r.json())
          .then(payload => {
            const rows = (payload.daily_stats || []).filter(r => r.sent > 0 || r.opened > 0);
            if (rows.length === 0) { setSteps([]); setLoading(false); return; }

            // Find the first day with any sends — treat as "Day 0 of campaign"
            const firstSendRow = rows.find(r => r.sent > 0);
            if (!firstSendRow) { setSteps([]); setLoading(false); return; }
            const day0 = new Date(firstSendRow.date + "T00:00:00");

            // Group each row into a step bucket based on (date - day0) / email_gap
            const buckets = Array.from({ length: step_count }, () => 0);
            rows.forEach(r => {
              if (r.sent <= 0) return;
              const dayOffset = Math.round(
                (new Date(r.date + "T00:00:00") - day0) / (24 * 3600 * 1000)
              );
              const stepIdx = Math.min(
                Math.floor(dayOffset / email_gap),
                step_count - 1
              );
              if (stepIdx >= 0) buckets[stepIdx] += r.sent;
            });

            // Determine which step is "currently active" — last non-zero bucket
            const lastActiveIdx = buckets.reduce((best, v, i) => v > 0 ? i : best, 0);

            setSteps(buckets.map((sent, i) => ({
              label: `Step ${i + 1}`,
              sent,
              isActive: i === lastActiveIdx,
              dayStart: i === 0 ? "Day 1" : `Day ${i * email_gap + 1}`,
            })));
            setLoading(false);
          })
          .catch(() => { setSteps([]); setLoading(false); });
      }, [campaignId, endDate, step_count, email_gap]);

      if (!step_count || step_count < 2 || !email_gap) return null;
      if (loading) return (
        <div className={`animate-pulse h-28 rounded-xl ${dark ? "bg-gray-800" : "bg-gray-100"}`} />
      );
      if (!steps || steps.length === 0) return null;

      const maxSent = Math.max(...steps.map(s => s.sent), 1);
      const barColor = dark ? "#6366f1" : "#4f46e5";
      const barActive = "#10b981";
      const txtSub = dark ? "text-gray-400" : "text-gray-500";

      return (
        <div>
          <p className={`text-xs font-medium mb-3 ${txtSub}`}>
            Step Distribution — {step_count} steps, {email_gap}d gap
          </p>
          {/* Recharts BarChart for step distribution */}
          <ResponsiveContainer width="100%" height={130}>
            <BarChart data={steps} margin={{ top: 4, right: 16, left: 0, bottom: 4 }}
              barCategoryGap="20%">
              <CartesianGrid strokeDasharray="3 3" stroke={dark ? "#374151" : "#e5e7eb"} vertical={false} />
              <XAxis dataKey="label" tick={{ fontSize: 10, fill: dark ? "#9ca3af" : "#6b7280" }}
                tickLine={false} />
              <YAxis tick={{ fontSize: 10, fill: dark ? "#9ca3af" : "#6b7280" }}
                tickLine={false} axisLine={false} width={36} />
              <Tooltip
                contentStyle={{ background: dark ? "#1f2937" : "#fff",
                  border: `1px solid ${dark ? "#374151" : "#e5e7eb"}`, borderRadius: 8, fontSize: 12 }}
                labelStyle={{ color: dark ? "#f3f4f6" : "#111827", fontWeight: 600 }}
                formatter={(v, _, { payload }) => [
                  `${v.toLocaleString()} emails`,
                  payload.isActive ? "Active step ✓" : "Step",
                ]}
              />
              <Bar dataKey="sent" radius={[4, 4, 0, 0]}
                label={{ position: "top", fontSize: 9, fill: dark ? "#9ca3af" : "#6b7280",
                  formatter: v => v > 0 ? v.toLocaleString() : "" }}>
                {steps.map((s, i) => (
                  <Cell key={i}
                    fill={s.isActive ? barActive : barColor}
                    fillOpacity={s.sent === 0 ? 0.25 : 1} />
                ))}
              </Bar>
            </BarChart>
          </ResponsiveContainer>
          {/* Step timeline legend */}
          <div className="flex flex-wrap gap-2 mt-2">
            {steps.map((s, i) => (
              <span key={i} className={`text-xs px-2 py-0.5 rounded-full border font-medium ${
                s.isActive
                  ? "border-emerald-400 bg-emerald-50 text-emerald-700"
                  : s.sent > 0
                    ? (dark ? "border-indigo-700 bg-indigo-900/30 text-indigo-300" : "border-indigo-200 bg-indigo-50 text-indigo-700")
                    : (dark ? "border-gray-700 text-gray-600" : "border-gray-200 text-gray-400")
              }`}>
                {s.label}{s.isActive ? " ← active" : ""}: {s.sent > 0 ? s.sent.toLocaleString() : "0"}
              </span>
            ))}
          </div>
        </div>
      );
    }

    // ══════════════════════════════════════════════════════════════════
    // DAILY BREAKDOWN COMPONENT
    // Shown when a campaign row is expanded.
    // Fetches /campaign-daily/:id?from=&to= and renders line charts.
    // ══════════════════════════════════════════════════════════════════
    function DailyBreakdown({ campaign, startDate, endDate, dark, onClose }) {
      const [status,   setStatus]   = useState("loading"); // loading | ready | nodata | error
      const [data,     setData]     = useState(null);
      const [source,   setSource]   = useState("");
      const [errMsg,   setErrMsg]   = useState("");
      const [cumView,  setCumView]  = useState(false); // toggle cumulative vs daily
      const [retryKey, setRetryKey] = useState(0);     // bump to re-fetch

      useEffect(() => {
        setStatus("loading");
        setErrMsg("");
        const from = toISO(startDate), to = toISO(endDate);
        const url = `/campaign-daily/${encodeURIComponent(campaign.id)}?from=${from}&to=${to}`;
        console.log("[DailyBreakdown] fetching:", url);

        fetch(url)
          .then(r => {
            // Backend always returns JSON — parse regardless of HTTP status
            if (!r.ok) console.warn("[DailyBreakdown] non-OK HTTP status:", r.status);
            return r.json();
          })
          .then(payload => {
            console.log("[DailyBreakdown] source:", payload.source, "| rows:", (payload.daily_stats||[]).length);
            const src = payload.source || "";
            setSource(src);

            // Backend caught an internal error and returned source="error"
            if (src === "error") {
              setErrMsg(payload.error || "Server error while fetching daily data.");
              setStatus("error");
              return;
            }

            const stats = payload.daily_stats || [];
            setData({ stats, alltime: payload.alltime || null, message: payload.message || "" });
            const hasAny = stats.some(r => (r.sent||0) + (r.opened||0) + (r.replies||0) + (r.clicks||0) > 0);
            setStatus(hasAny ? "ready" : "nodata");
          })
          .catch(err => {
            console.error("[DailyBreakdown] fetch error:", err);
            setErrMsg(err.message || "Network error — could not reach the server.");
            setStatus("error");
          });
      }, [campaign.id, startDate, endDate, retryKey]);

      // Build cumulative version of the stats array
      const chartRows = useMemo(() => {
        if (!data?.stats) return [];
        if (!cumView) return data.stats.map(r => ({
          ...r,
          label: (() => { const [y,m,d] = r.date.split("-"); return new Date(+y,+m-1,+d).toLocaleDateString("en-US",{month:"short",day:"numeric"}); })(),
        }));
        let cSent=0, cOpened=0, cReplies=0, cClicks=0;
        return data.stats.map(r => {
          cSent    += r.sent;    cOpened  += r.opened;
          cReplies += r.replies; cClicks  += r.clicks;
          const [y,m,d] = r.date.split("-");
          return {
            date: r.date,
            label: new Date(+y,+m-1,+d).toLocaleDateString("en-US",{month:"short",day:"numeric"}),
            sent: cSent, opened: cOpened, replies: cReplies, clicks: cClicks,
          };
        });
      }, [data, cumView]);

      const cardBg  = dark ? "bg-gray-900" : "bg-gray-50";
      const line    = dark ? "#374151" : "#e5e7eb";
      const txtSub  = dark ? "text-gray-400" : "text-gray-500";
      const tooltip = { background: dark ? "#1f2937" : "#fff", border: `1px solid ${line}`, borderRadius: 8, fontSize: 12 };
      const lblStyle = { color: dark ? "#f3f4f6" : "#111827", fontWeight: 600 };

      return (
        <div className={`${cardBg} border-t px-6 py-5`} style={{ borderColor: line }}>
          {/* Header */}
          <div className="flex items-center justify-between mb-4">
            <div>
              <p className={`text-xs font-semibold uppercase tracking-wider mb-0.5 ${txtSub}`}>Daily Breakdown</p>
              <p className={`font-semibold text-sm ${dark ? "text-white" : "text-gray-800"}`}>{campaign.name}</p>
            </div>
            <div className="flex items-center gap-2">
              {status === "ready" && (
                <div className={`flex rounded-lg border text-xs overflow-hidden ${dark ? "border-gray-600" : "border-gray-200"}`}>
                  <button onClick={() => setCumView(false)}
                    className={`px-3 py-1.5 font-medium transition-colors ${!cumView ? "bg-indigo-600 text-white" : dark ? "bg-gray-800 text-gray-400 hover:bg-gray-700" : "bg-white text-gray-600 hover:bg-gray-50"}`}>
                    Daily
                  </button>
                  <button onClick={() => setCumView(true)}
                    className={`px-3 py-1.5 font-medium transition-colors ${cumView ? "bg-indigo-600 text-white" : dark ? "bg-gray-800 text-gray-400 hover:bg-gray-700" : "bg-white text-gray-600 hover:bg-gray-50"}`}>
                    Cumulative
                  </button>
                </div>
              )}
              <button onClick={onClose}
                className={`p-1.5 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors ${txtSub}`}>
                <Icon name="x" size={14} />
              </button>
            </div>
          </div>

          {/* Loading skeleton */}
          {status === "loading" && (
            <div className="space-y-3 animate-pulse">
              <div className={`h-4 w-40 rounded ${dark ? "bg-gray-700" : "bg-gray-200"}`} />
              <div className={`h-40 rounded-xl ${dark ? "bg-gray-700" : "bg-gray-200"}`} />
            </div>
          )}

          {/* Error — shows real error message + retry button */}
          {status === "error" && (
            <div className={`flex flex-col gap-3 py-5 ${txtSub}`}>
              <div className="flex items-start gap-3">
                <Icon name="wifiOff" size={16} className="mt-0.5 shrink-0 text-rose-400" />
                <div>
                  <p className={`text-sm font-medium ${dark ? "text-rose-300" : "text-rose-600"}`}>
                    Could not load daily data
                  </p>
                  {errMsg && (
                    <p className={`text-xs mt-1 font-mono ${dark ? "text-gray-500" : "text-gray-400"}`}>
                      {errMsg}
                    </p>
                  )}
                  <p className={`text-xs mt-1 ${txtSub}`}>
                    Check the server console (the terminal window running app.js) for full details.
                  </p>
                </div>
              </div>
              <button
                onClick={() => setRetryKey(k => k + 1)}
                className={`self-start flex items-center gap-2 px-3 py-1.5 text-xs font-medium rounded-lg border transition-colors ${dark ? "border-gray-600 hover:bg-gray-700 text-gray-300" : "border-gray-300 hover:bg-gray-50 text-gray-600"}`}>
                <Icon name="refresh" size={12} /> Retry
              </button>
            </div>
          )}

          {/* No data in range — show all-time summary or note about global data */}
          {status === "nodata" && (
            <div className="space-y-4">
              <div className={`flex items-center gap-3 px-4 py-3 rounded-xl border-2 border-dashed text-sm ${dark ? "border-gray-700 text-gray-500" : "border-gray-200 text-gray-400"}`}>
                <Icon name="calendar" size={15} className="shrink-0" />
                <span>
                  No daily activity found for <strong>{toISO(startDate)}</strong> → <strong>{toISO(endDate)}</strong>.
                  {source === "alltime_only" && " The Instantly API does not expose per-campaign daily data — showing all-time totals below."}
                  {source === "global_daily" && " No activity recorded for this period."}
                </span>
              </div>
              {data?.alltime && (
                <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                  {[
                    ["Sent",    data.alltime.sent,    "text-indigo-500"],
                    ["Opened",  data.alltime.opened,  "text-blue-500"],
                    ["Replies", data.alltime.replies, "text-violet-500"],
                    ["Clicks",  data.alltime.clicks,  "text-cyan-500"],
                    ["Bounced", data.alltime.bounced, "text-rose-500"],
                  ].map(([label, val, color]) => (
                    <div key={label} className={`rounded-xl border p-3 ${dark ? "bg-gray-800 border-gray-700" : "bg-white border-gray-200"}`}>
                      <p className={`text-xs ${txtSub} mb-0.5`}>{label} (all-time)</p>
                      <p className={`text-xl font-bold tabular-nums ${color}`}>{(val||0).toLocaleString()}</p>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Charts */}
          {status === "ready" && (
            <div className="space-y-5">
              {/* Global daily fallback notice */}
              {source === "global_daily" && data?.message && (
                <div className={`flex items-center gap-2 px-3 py-2 rounded-lg text-xs border ${dark ? "border-amber-800 bg-amber-900/20 text-amber-300" : "border-amber-200 bg-amber-50 text-amber-700"}`}>
                  <Icon name="bounce" size={12} className="shrink-0" />
                  <span>{data.message}</span>
                </div>
              )}

              {/* Date range + stat pills */}
              <div className="flex flex-wrap items-center gap-3">
                <span className={`text-xs px-2 py-1 rounded-md font-medium ${dark ? "bg-gray-700 text-gray-400" : "bg-gray-100 text-gray-500"}`}>
                  {toISO(startDate)} → {toISO(endDate)}
                </span>
                {[
                  ["Sent",    chartRows.reduce((s,r)=>s+(cumView?0:r.sent),0)   || chartRows[chartRows.length-1]?.sent,    "#6366f1"],
                  ["Opened",  chartRows.reduce((s,r)=>s+(cumView?0:r.opened),0) || chartRows[chartRows.length-1]?.opened,  "#3b82f6"],
                  ["Replies", chartRows.reduce((s,r)=>s+(cumView?0:r.replies),0)|| chartRows[chartRows.length-1]?.replies, "#8b5cf6"],
                  ["Clicks",  chartRows.reduce((s,r)=>s+(cumView?0:r.clicks),0) || chartRows[chartRows.length-1]?.clicks,  "#06b6d4"],
                ].map(([label, val, color]) => (
                  <span key={label} className={`text-xs px-2.5 py-1 rounded-full font-medium ${dark ? "bg-gray-800 border border-gray-700" : "bg-white border border-gray-200"}`}
                    style={{ color }}>
                    {label}: {(val||0).toLocaleString()}
                  </span>
                ))}
              </div>

              {/* Sent + Opens chart */}
              <div>
                <p className={`text-xs font-medium mb-2 ${txtSub}`}>Sent & Opens</p>
                <ResponsiveContainer width="100%" height={160}>
                  <LineChart data={chartRows} margin={{ top: 4, right: 16, left: 0, bottom: 4 }}>
                    <CartesianGrid strokeDasharray="3 3" stroke={line} />
                    <XAxis dataKey="label" tick={{ fontSize: 10, fill: dark ? "#9ca3af" : "#6b7280" }} tickLine={false} interval="preserveStartEnd" />
                    <YAxis tick={{ fontSize: 10, fill: dark ? "#9ca3af" : "#6b7280" }} tickLine={false} axisLine={false} width={36} />
                    <Tooltip contentStyle={tooltip} labelStyle={lblStyle} />
                    <Legend iconSize={8} wrapperStyle={{ fontSize: 10 }} />
                    <Line type="monotone" dataKey="sent"   name="Sent"   stroke="#6366f1" strokeWidth={2} dot={false} activeDot={{ r: 4 }} />
                    <Line type="monotone" dataKey="opened" name="Opened" stroke="#3b82f6" strokeWidth={2} dot={false} activeDot={{ r: 4 }} />
                  </LineChart>
                </ResponsiveContainer>
              </div>

              {/* Replies + Clicks chart */}
              <div>
                <p className={`text-xs font-medium mb-2 ${txtSub}`}>Replies & Clicks</p>
                <ResponsiveContainer width="100%" height={130}>
                  <LineChart data={chartRows} margin={{ top: 4, right: 16, left: 0, bottom: 4 }}>
                    <CartesianGrid strokeDasharray="3 3" stroke={line} />
                    <XAxis dataKey="label" tick={{ fontSize: 10, fill: dark ? "#9ca3af" : "#6b7280" }} tickLine={false} interval="preserveStartEnd" />
                    <YAxis tick={{ fontSize: 10, fill: dark ? "#9ca3af" : "#6b7280" }} tickLine={false} axisLine={false} width={36} />
                    <Tooltip contentStyle={tooltip} labelStyle={lblStyle} />
                    <Legend iconSize={8} wrapperStyle={{ fontSize: 10 }} />
                    <Line type="monotone" dataKey="replies" name="Replies" stroke="#8b5cf6" strokeWidth={2} dot={false} activeDot={{ r: 4 }} />
                    <Line type="monotone" dataKey="clicks"  name="Clicks"  stroke="#06b6d4" strokeWidth={2} dot={false} activeDot={{ r: 4 }} />
                  </LineChart>
                </ResponsiveContainer>
              </div>

              {/* Step Distribution chart — shown when campaign has step_count + email_gap */}
              {campaign.step_count > 1 && campaign.email_gap > 0 && (
                <div className={`rounded-xl border p-4 ${dark ? "bg-gray-800/50 border-gray-700" : "bg-white border-gray-200"}`}>
                  <StepDistribution
                    campaign={campaign}
                    endDate={endDate}
                    dark={dark}
                  />
                </div>
              )}

              {/* Source note — only shown for daily_endpoint (true per-campaign data) */}
              {source === "daily_endpoint" && (
                <p className={`text-xs ${dark ? "text-gray-600" : "text-gray-400"}`}>
                  Source: per-campaign daily endpoint ✓
                </p>
              )}
            </div>
          )}
        </div>
      );
    }

    // ── Pagination button ──────────────────────────────────────────────
    function PagBtn({ icon, disabled, onClick, dark }) {
      return (
        <button onClick={onClick} disabled={disabled}
          className={`p-1.5 rounded transition-colors disabled:opacity-30 ${dark ? "hover:bg-gray-700" : "hover:bg-gray-100"}`}>
          <Icon name={icon} size={14} />
        </button>
      );
    }

    // ── Mount ──────────────────────────────────────────────────────────
    ReactDOM.createRoot(document.getElementById("root")).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
