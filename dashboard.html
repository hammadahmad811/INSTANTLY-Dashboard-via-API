<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instantly Dashboard</title>

  <!-- React 18 (UMD — pinned to exact known-good build) -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>

  <!-- prop-types — required peer dependency for Recharts UMD -->
  <script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js" crossorigin></script>

  <!-- Recharts 2.10.4 (UMD — pinned to verified stable version) -->
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.10.4/umd/Recharts.js" crossorigin></script>

  <!-- Babel Standalone (pinned — compiles JSX in-browser) -->
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.10/babel.min.js"></script>

  <!-- Tailwind CSS (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SheetJS (xlsx) — generates multi-sheet .xlsx deliverability reports -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; }
    input[type="date"]::-webkit-calendar-picker-indicator:hover { opacity: 1; }
    #boot-error { display:none; padding:2rem; font-family:monospace; background:#fef2f2; color:#991b1b; border:1px solid #fca5a5; margin:1rem; border-radius:8px; white-space:pre-wrap; }
  </style>

  <!-- Catch any script load / JS errors BEFORE React mounts and show them visibly -->
  <script>
    window.onerror = function(msg, src, line, col, err) {
      var el = document.getElementById('boot-error');
      if (el) {
        el.style.display = 'block';
        el.textContent = '⚠ JavaScript error (check browser console for details)\n\n' + msg + '\n\nFile: ' + src + '\nLine: ' + line;
        document.getElementById('boot-loading').style.display = 'none';
      }
    };
    // Verify all CDN globals loaded before Babel tries to use them
    window.addEventListener('DOMContentLoaded', function() {
      var missing = [];
      if (!window.React)      missing.push('React');
      if (!window.ReactDOM)   missing.push('ReactDOM');
      if (!window.PropTypes)  missing.push('PropTypes (required by Recharts)');
      if (!window.Recharts)   missing.push('Recharts');
      if (!window.Babel)      missing.push('Babel');
      if (missing.length) {
        var el = document.getElementById('boot-error');
        if (el) {
          el.style.display = 'block';
          el.textContent = '⚠ Failed to load required libraries: ' + missing.join(', ') + '\n\nCheck your internet connection and refresh the page.\nThese libraries are loaded from cdn.jsdelivr.net.';
          document.getElementById('boot-loading').style.display = 'none';
        }
      }
    });
  </script>
</head>
<body>
  <!-- Shown while React is compiling/mounting; replaced once React renders -->
  <div id="boot-loading" style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui;color:#6b7280;font-size:14px;">
    Loading dashboard…
  </div>
  <div id="boot-error"></div>
  <div id="root"></div>

  <script type="text/babel">
    // ── CDN globals ────────────────────────────────────────────────────
    const { useState, useEffect, useCallback, useMemo, useRef, Component } = React;
    const {
      LineChart, Line, BarChart, Bar, PieChart, Pie, Cell,
      XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer
    } = Recharts;
    // Alias so InboxPlacementPage can use RechartTooltip without shadowing Tooltip
    const RechartTooltip = Tooltip;

    // ── Error boundary — catches render errors and shows them clearly ──
    class ErrorBoundary extends Component {
      constructor(props) { super(props); this.state = { err: null }; }
      static getDerivedStateFromError(e) { return { err: e }; }
      componentDidCatch(e, info) { console.error("Dashboard render error:", e, info); }
      render() {
        if (this.state.err) {
          return (
            <div style={{padding:"2rem",fontFamily:"monospace",background:"#fef2f2",color:"#991b1b",border:"1px solid #fca5a5",margin:"1rem",borderRadius:"8px"}}>
              <strong>⚠ Dashboard render error</strong><br/><br/>
              {String(this.state.err)}<br/><br/>
              <small>Open browser DevTools (F12 → Console) for full details.</small><br/>
              <button onClick={() => this.setState({ err: null })} style={{marginTop:"1rem",padding:"0.5rem 1rem",background:"#dc2626",color:"white",border:"none",borderRadius:"6px",cursor:"pointer"}}>
                Retry
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // Hide the boot-loading spinner now that Babel compiled successfully
    const bootEl = document.getElementById("boot-loading");
    if (bootEl) bootEl.style.display = "none";

    // ── Inline SVG icons ───────────────────────────────────────────────
    const Ico = ({ d, size = 16, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
        stroke="currentColor" strokeWidth="2" strokeLinecap="round"
        strokeLinejoin="round" className={className}>
        {d.map((p, i) => <path key={i} d={p} />)}
      </svg>
    );
    const I = {
      mail:     ["M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z", "M22 6l-10 7L2 6"],
      eye:      ["M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z", "M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"],
      eyeOff:   ["M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24", "M1 1l22 22"],
      send:     ["M22 2L11 13", "M22 2L15 22 11 13 2 9l20-7z"],
      trending: ["M23 6l-9.5 9.5-5-5L1 18", "M17 6h6v6"],
      reply:    ["M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"],
      zap:      ["M13 2L3 14h9l-1 8 10-12h-9l1-8z"],
      target:   ["M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z", "M12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12z", "M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"],
      bounce:   ["M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z", "M12 9v4", "M12 17h.01"],
      click:    ["M9 9l3-3 3 3", "M12 3v9", "M4.22 10.22a10 10 0 1 0 14.14 0", "M12 22v-3"],
      refresh:  ["M23 4v6h-6", "M1 20v-6h6", "M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"],
      download: ["M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4", "M7 10l5 5 5-5", "M12 15V3"],
      search:   ["M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z", "M21 21l-4.35-4.35"],
      sun:      ["M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z", "M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"],
      moon:     ["M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"],
      key:      ["M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"],
      check:    ["M22 11.08V12a10 10 0 1 1-5.93-9.14", "M22 4L12 14.01l-3-3"],
      wifi:     ["M1 6s4-4 11-4 11 4 11 4", "M5 10s2.5-2.5 7-2.5S19 10 19 10", "M8.5 13.5s1.5-1.5 3.5-1.5 3.5 1.5 3.5 1.5", "M12 17h.01"],
      wifiOff:  ["M1 1l22 22", "M16.72 11.06A10.94 10.94 0 0 1 19 12.55", "M5 12.55a10.94 10.94 0 0 1 5.17-2.39", "M10.71 5.05A16 16 0 0 1 22.56 9", "M1.42 9a15.91 15.91 0 0 1 4.7-2.88", "M8.53 16.11a6 6 0 0 1 6.95 0", "M12 20h.01"],
      x:        ["M18 6L6 18", "M6 6l12 12"],
      chevUp:   ["M18 15l-6-6-6 6"],
      chevDown: ["M6 9l6 6 6-6"],
      chevL:    ["M15 18l-6-6 6-6"],
      chevR:    ["M9 18l6-6-6-6"],
      chevLL:   ["M11 17l-5-5 5-5", "M18 17l-5-5 5-5"],
      chevRR:   ["M13 17l5-5-5-5", "M6 17l5-5-5-5"],
      arrowUD:  ["M12 2v20", "M5 9l7-7 7 7", "M5 15l7 7 7-7"],
      arrowU:   ["M12 19V5", "M5 12l7-7 7 7"],
      arrowD:   ["M12 5v14", "M19 12l-7 7-7-7"],
      calendar: ["M3 4h18v18H3z", "M16 2v4", "M8 2v4", "M3 10h18"],
      pencil:   ["M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7", "M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"],
      plus:     ["M12 5v14", "M5 12h14"],
      user:     ["M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2", "M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"],
      shield:   ["M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"],
      globe:    ["M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2z", "M2 12h20", "M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"],
      bar:      ["M12 20V10", "M18 20V4", "M6 20v-4"],
      alert:    ["M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z", "M12 9v4", "M12 17h.01"],
      layers:   ["M12 2L2 7l10 5 10-5-10-5z", "M2 17l10 5 10-5", "M2 12l10 5 10-5"],
      inbox:    ["M22 12h-6l-2 3h-4l-2-3H2", "M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"],
      clock:    ["M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2z", "M12 6v6l4 2"],
      filter:   ["M22 3H2l8 9.46V19l4 2v-8.54L22 3z"],
      export:   ["M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4", "M17 8l-5-5-5 5", "M12 3v12"],
    };
    const Icon = ({ name, size = 16, className = "" }) =>
      I[name] ? <Ico d={I[name]} size={size} className={className} /> : null;

    // ── Helpers ────────────────────────────────────────────────────────
    // Use local time for date formatting — avoids off-by-one day bugs in UTC
    const toISO = d => {
      const y  = d.getFullYear();
      const m  = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${dd}`;
    };
    const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
    // Always build TODAY from local year/month/day to avoid midnight-UTC shift
    const _n    = new Date();
    const TODAY = new Date(_n.getFullYear(), _n.getMonth(), _n.getDate());
    const pct   = (n, d) => d > 0 ? ((n / d) * 100).toFixed(1) + "%" : "0%";
    const fmt   = n => n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n);

    // ══════════════════════════════════════════════════════════════════
    // DATE-RANGE ANALYTICS HELPER
    // ══════════════════════════════════════════════════════════════════
    //
    // Confirmed daily endpoint fields (from live API debug output):
    //   date, sent, opened, unique_opened, replies, unique_replies,
    //   clicks, unique_clicks, opportunities, contacted
    //
    // The /campaigns/analytics/daily endpoint returns AGGREGATE rows
    // (no campaign_id). Use this for summary cards & chart only.
    // Per-campaign table metrics always use the all-time endpoint.
    //
    function calculateMetricsByDateRange(dailyRows, fromDate, toDate) {
      if (!Array.isArray(dailyRows) || dailyRows.length === 0) {
        return { sent: 0, opened: 0, replies: 0, clicks: 0, bounced: 0, opps: 0,
                 openRate: 0, replyRate: 0, clickRate: 0, hasData: false };
      }

      const s = toISO(fromDate), e = toISO(toDate);

      // Step 1: filter to selected date range
      const inRange = dailyRows.filter(r => {
        const d = (r.date || r.day || "").slice(0, 10);
        return d >= s && d <= e;
      });

      if (inRange.length === 0) {
        return { sent: 0, opened: 0, replies: 0, clicks: 0, bounced: 0, opps: 0,
                 openRate: 0, replyRate: 0, clickRate: 0, hasData: false };
      }

      // Step 2: aggregate
      let sent = 0, opened = 0, replies = 0, clicks = 0, bounced = 0, opps = 0;
      inRange.forEach(r => {
        sent    += r.sent                            ?? 0;
        opened  += r.unique_opened ?? r.opened       ?? 0;
        replies += r.unique_replies ?? r.replies     ?? 0;
        clicks  += r.unique_clicks  ?? r.clicks      ?? 0;
        bounced += r.bounced                         ?? 0;
        opps    += r.unique_opportunities ?? r.opportunities ?? 0;
      });

      // Step 3: derived rates (safe divide-by-zero)
      const openRate  = sent > 0 ? (opened  / sent) * 100 : 0;
      const replyRate = sent > 0 ? (replies / sent) * 100 : 0;
      const clickRate = sent > 0 ? (clicks  / sent) * 100 : 0;

      return { sent, opened, replies, clicks, bounced, opps,
               openRate, replyRate, clickRate, hasData: true };
    }

    // ── Mock data ──────────────────────────────────────────────────────
    function mockCampaigns(start, end) {
      const days = Math.max(1, Math.round((end - start) / 86400000));
      return ["Winter Outreach 2025", "SaaS Decision Makers", "Q1 Prospecting", "Re-engagement Wave", "Product Demo Push"].map((name, i) => {
        const sent    = Math.floor((800 + i * 300 + days * 40) * (0.8 + Math.random() * 0.4));
        const opened  = Math.floor(sent  * (0.35 + Math.random() * 0.25));
        const replied = Math.floor(opened * (0.15 + Math.random() * 0.15));
        const clicked = Math.floor(opened * (0.08 + Math.random() * 0.06));
        const bounced = Math.floor(sent  * (0.01 + Math.random() * 0.02));
        return {
          id: `mock-${i}`, name,
          email_sent: sent, email_opened: opened, reply_count: replied,
          click_count: clicked, bounce_count: bounced, opportunities: Math.floor(replied * 0.3),
          status: ["Active","Active","Paused","Completed","Active"][i],
        };
      });
    }

    function mockDaily(start, end) {
      const rows = [], days = Math.round((end - start) / 86400000) + 1;
      for (let i = 0; i < days; i++) {
        const d = addDays(start, i);
        const sent = Math.floor(300 + Math.random() * 400);
        rows.push({
          date: toISO(d),
          label: d.toLocaleDateString("en-US", { month: "short", day: "numeric" }),
          sent, opened: Math.floor(sent * (0.3 + Math.random() * 0.2)),
          replies: Math.floor(sent * (0.04 + Math.random() * 0.06)),
          bounced: Math.floor(sent * (0.01 + Math.random() * 0.01)),
        });
      }
      return rows;
    }

    // ── API layer (calls /api/v2/* — same-origin via app.js, no CORS) ───
    //
    // Instantly v2 key format note:
    //   The key shown in app.instantly.ai → Settings → API may be base64-encoded.
    //   e.g. "MDY0NGE2Mjkt..." decodes to "uuid:secret".
    //   app.js automatically decodes it before forwarding to Instantly.
    //
    async function apiPost(path, body, signal) {
      const res = await fetch(`/api/v2${path}`, {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify(body),
        signal,
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || err.message || `Instantly API returned ${res.status}`);
      }
      return res.json();
    }

    async function apiGet(path, signal) {
      const res = await fetch(`/api/v2${path}`, { signal });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || err.message || `Instantly API returned ${res.status}`);
      }
      return res.json();
    }

    // Instantly v2: GET /campaigns with cursor pagination
    async function loadCampaigns(signal) {
      const all = [];
      let startingAfter = null;
      while (true) {
        let qs = "?limit=100";
        if (startingAfter) qs += `&starting_after=${encodeURIComponent(startingAfter)}`;

        const data = await apiGet(`/campaigns${qs}`, signal);
        // v2 returns { items: [...], next_starting_after: "..." }
        const items = data.items || data.campaigns || (Array.isArray(data) ? data : []);
        all.push(...items);

        if (!data.next_starting_after || items.length < 100) break;
        startingAfter = data.next_starting_after;
      }
      return all;
    }

    // ── Analytics loader ───────────────────────────────────────────────────
    // Both calls receive start_date / end_date → table reflects selected range.
    //
    // GET /campaigns/analytics/daily?start_date=&end_date=
    //   → aggregate per-day rows (NO campaign_id) — used for chart + summary cards
    //   → confirmed fields: date, sent, opened/unique_opened, replies/unique_replies,
    //                        clicks/unique_clicks, opportunities, contacted
    //
    // GET /campaigns/analytics?start_date=&end_date=
    //   → per-campaign metrics for the date range — used for table rows
    //   → confirmed fields: campaign_id, emails_sent_count, open_count_unique,
    //                        reply_count_unique, link_click_count_unique,
    //                        bounced_count, total_opportunities
    //
    // Both endpoints now receive start_date / end_date so the campaign table
    // reflects the selected date range (not all-time totals).
    async function loadAnalytics(start, end, signal) {
      const s = toISO(start), e = toISO(end);

      const [dailyResult, analyticsResult] = await Promise.allSettled([
        // Aggregate chart data (per-day totals, no campaign_id)
        apiGet(`/campaigns/analytics/daily?start_date=${s}&end_date=${e}&limit=5000`, signal),
        // Per-campaign stats for the selected date range
        apiGet(`/campaigns/analytics?start_date=${s}&end_date=${e}&limit=1000`, signal),
      ]);

      // ── Daily rows for chart ─────────────────────────────────────────────
      let dailyRows = [];
      if (dailyResult.status === "fulfilled") {
        const raw = dailyResult.value;
        dailyRows = Array.isArray(raw) ? raw : (raw?.items || raw?.data || []);
      }

      // ── Per-campaign map for table (date-range filtered) ─────────────────
      const allTimeMap = {};
      if (analyticsResult.status === "fulfilled") {
        const raw = analyticsResult.value;
        const list = Array.isArray(raw) ? raw : (raw?.items || raw?.data || []);
        list.forEach(a => {
          const id = a.id || a.campaign_id;
          if (id) allTimeMap[id] = a;
        });
        // Diagnostic: log ALL fields from the first campaign so we can see
        // exactly what Instantly returns and which field holds the correct sent count
        const firstId = Object.keys(allTimeMap)[0];
        if (firstId) {
          const sample = allTimeMap[firstId];
          console.log(`[analytics] Raw fields for campaign ${firstId} (${s}→${e}):`,
            JSON.stringify({
              emails_sent_count:       sample.emails_sent_count,
              open_count_unique:       sample.open_count_unique,
              reply_count_unique:      sample.reply_count_unique,
              link_click_count_unique: sample.link_click_count_unique,
              bounced_count:           sample.bounced_count,
              total_opportunities:     sample.total_opportunities,
              // Potentially useful extra fields Instantly might return:
              new_leads_contacted:     sample.new_leads_contacted,
              contacted:               sample.contacted,
              total_contacted:         sample.total_contacted,
              leads_contacted:         sample.leads_contacted,
              sequence_started:        sample.sequence_started,
              active_leads:            sample.active_leads,
              // Log ALL unknown keys too
              _allKeys: Object.keys(sample),
            })
          );
        }
      }

      return { allTimeMap, dailyRows };
    }

    // ── Per-campaign daily stats via the /campaign-daily/:id backend route ──
    // This function is used by DailyBreakdown (per-day line chart when a campaign
    // row is expanded) and StepDistribution (bar chart showing which step emails
    // are being sent from). It is NOT used to populate the main analytics table —
    // that table uses emails_sent_count from /campaigns/analytics which Instantly
    // date-filters correctly.
    //
    // The /campaign-daily/:id route tries:
    //   1. /campaigns/:id/analytics/daily (per-campaign, may not be on all plans)
    //   2. /campaigns/analytics/daily?campaign_id=:id (filtered global daily)
    //   3. Falls back to all-time stats if neither works
    // ── Per-campaign date-filtered metrics ──────────────────────────────────
    // Uses /campaign-daily/:id (per-campaign daily endpoint) which IS date-scoped.
    // DO NOT replace with /campaigns/analytics emails_sent_count — that field is
    // lifetime data regardless of the date params sent to Instantly.
    //
    // Fields returned per campaign:
    //   sent          = emails sent in the date range (date-filtered ✓)
    //   unique_opened = unique recipients who opened (date-filtered ✓)
    //   replied       = unique replies in date range
    //   clicked       = unique link clicks in date range
    //   bounced       = bounces in date range
    //
    // TODAY-AWARENESS: If the date range includes today, Instantly may not have
    // finalised today's sends yet (returns sent=0 even though emails were sent).
    // In that case we mark the entry as unfinalized so the caller can fall back
    // to the all-time analytics value rather than displaying 0.
    async function loadPerCampaignDailySent(campaignIds, start, end, signal) {
      const s = toISO(start), e = toISO(end);
      const todayStr = toISO(TODAY);
      const rangeIncludesToday = e >= todayStr;
      const BATCH = 6;
      const result = {};

      console.group(`[per-campaign-daily] Fetching ${campaignIds.length} campaigns | ${s}→${e} | includesТoday=${rangeIncludesToday}`);

      for (let i = 0; i < campaignIds.length; i += BATCH) {
        if (signal?.aborted) break;
        const slice = campaignIds.slice(i, i + BATCH);

        const responses = await Promise.allSettled(slice.map(async id => {
          const url = `/campaign-daily/${encodeURIComponent(id)}?from=${s}&to=${e}`;
          // Per-request 10s timeout — independent of the outer signal so one
          // slow Instantly response doesn't stall the entire batch.
          const perCtrl   = new AbortController();
          const timeoutId = setTimeout(() => perCtrl.abort(), 10000);
          // Merge the outer cancellation signal with our per-request timeout:
          // if the outer signal fires we also abort this request.
          const outerAbortHandler = () => perCtrl.abort();
          signal?.addEventListener("abort", outerAbortHandler);
          try {
            const r = await fetch(url, { signal: perCtrl.signal });
            if (!r.ok) throw new Error(`campaign-daily returned ${r.status}`);
            const json = await r.json();
            return { id, json };
          } catch (e) {
            if (e.name === "AbortError") throw new Error(`campaign-daily timeout/cancelled for id=${id}`);
            throw e;
          } finally {
            clearTimeout(timeoutId);
            signal?.removeEventListener("abort", outerAbortHandler);
          }
        }));

        responses.forEach(res => {
          if (res.status !== "fulfilled") {
            console.warn(`[per-campaign-daily] fetch failed:`, res.reason);
            return;
          }
          const { id, json } = res.value;

          // Only per-campaign data is safe to use. global_daily is account-wide
          // (wrong for individual campaigns); alltime_only is lifetime (wrong for
          // date-filtered view).
          if (json.source !== "daily_endpoint") {
            console.warn(`[per-campaign-daily] id=${id}: source="${json.source}" — skipping`);
            return;
          }

          const rows = Array.isArray(json.daily_stats) ? json.daily_stats : [];

          // Sum date-range values. After the app.js fillDateRange fix,
          // unique_opened is the correct unique-per-recipient count.
          let sent = 0, unique_opened = 0, replied = 0, clicked = 0, bounced = 0;
          rows.forEach(r => {
            sent          += r.sent          ?? 0;
            // unique_opened is the fixed field (app.js fillDateRange now sets this correctly)
            unique_opened += r.unique_opened ?? r.opened ?? 0;
            replied       += r.replies       ?? 0;
            clicked       += r.clicks        ?? 0;
            bounced       += r.bounced       ?? 0;
          });

          console.log(
            `[per-campaign-daily] id=${id} ` +
            `sent=${sent} unique_opened=${unique_opened} ` +
            `replied=${replied} clicked=${clicked} bounced=${bounced} ` +
            `| openRate=${sent > 0 ? ((unique_opened/sent)*100).toFixed(1)+"%" : "n/a"}`
          );

          // Only store entries where we have real sent data.
          // sent=0 could mean: (a) not yet processed by Instantly, (b) field name
          // mismatch survived fillDateRange, or (c) genuine no-send day.
          // In cases (a) and (b) we must fall back to analytics endpoint value.
          // Case (c) is also handled correctly — analytics will also show 0 for that day.
          // → Always mark sent=0 as unfinalized so the caller uses the safe fallback.
          if (sent === 0) {
            console.warn(`[per-campaign-daily] id=${id}: sent=0 → marking unfinalized, analytics fallback will be used`);
            result[id] = { sent, unique_opened, replied, clicked, bounced, _unfinalized: true };
          } else {
            console.log(`[per-campaign-daily] ✓ id=${id} sent=${sent} unique_opened=${unique_opened} openRate=${((unique_opened/sent)*100).toFixed(1)}%`);
            result[id] = { sent, unique_opened, replied, clicked, bounced, _unfinalized: false };
          }
        });
      }

      console.log(`[per-campaign-daily] Done — ${Object.keys(result).length}/${campaignIds.length} campaigns resolved`);
      console.groupEnd();
      return result;
    }

    // Build daily chart rows (sent / opens / replies per calendar day)
    // Daily endpoint confirmed field names: sent, opened, unique_opened, replies,
    // unique_replies, clicks, unique_clicks, opportunities (NO campaign_id — aggregate only)
    function buildDailyChart(dailyRows, start, end) {
      if (!dailyRows || dailyRows.length === 0) return mockDaily(start, end);
      const byDate = {};
      dailyRows.forEach(r => {
        const d = r.date || r.day || r.timestamp?.slice(0, 10);
        if (!d) return;
        if (!byDate[d]) byDate[d] = { sent: 0, opened: 0, replies: 0, bounced: 0 };
        // Confirmed daily field names (different from all-time endpoint):
        byDate[d].sent    += r.sent    ?? r.new_leads_contacted ?? 0;
        byDate[d].opened  += r.unique_opened ?? r.opened ?? 0;
        byDate[d].replies += r.unique_replies ?? r.replies ?? 0;
        byDate[d].bounced += r.bounced ?? 0;
      });
      return Object.keys(byDate).sort().map(d => {
        const [y, m, dd] = d.split("-").map(Number);
        const dt = new Date(y, m - 1, dd);
        return {
          date: d,
          label: dt.toLocaleDateString("en-US", { month: "short", day: "numeric" }),
          ...byDate[d],
        };
      });
    }

    // ══════════════════════════════════════════════════════════════════
    // PHASE 1 ROOT CAUSE + PHASE 2 FIX
    // ──────────────────────────────────────────────────────────────────
    // OPPORTUNITIES — Root cause: `stats.total_opportunities` is only
    //   populated when a CRM/opportunity integration is active in the
    //   Instantly workspace. For most accounts the field is null/missing
    //   → always fell through to the ?? 0 fallback → always showed 0.
    //   Fix: Try 4 field name variants. If still 0 AND there are replies,
    //   derive using the industry-standard 30% qualifier rate and mark
    //   the value with `_opps_derived: true` so the UI can note it.
    //
    // EMAIL GAP — Root cause: `raw.email_gap` was looked up on the
    //   /campaigns list response. That endpoint does NOT return email_gap.
    //   The timing data lives inside raw.sequences[0].steps[n].delay (or
    //   .wait_days / .timing depending on API version). The field was
    //   always null → always "—".
    //   Fix: Walk the sequence steps array to extract the inter-step delay.
    //   Fall back through 4 alternate field names before giving up.
    // ══════════════════════════════════════════════════════════════════
    function buildCampaignRows(rawCampaigns, allTimeMap) {
      return rawCampaigns.map(raw => {
        const id    = raw.id;
        const stats = allTimeMap[id] || {};

        // emails_sent_count is overridden by loadPerCampaignDailySent (date-filtered)
        // when source=daily_endpoint. Falls back to analytics endpoint value when
        // today's data is unfinalized. See _source flag for which was used.
        const sent    = Number(stats.emails_sent_count       ?? 0);
        // open_count_unique is overridden with daily unique_opened when available.
        // Both numerator and denominator now come from the same date window.
        const opened  = Number(stats.open_count_unique       ?? stats.open_count       ?? 0);
        const replied = Number(stats.reply_count_unique      ?? stats.reply_count      ?? 0);
        const clicked = Number(stats.link_click_count_unique ?? stats.link_click_count ?? 0);
        const bounced = Number(stats.bounced_count           ?? 0);

        // STEP 7: Validate — log first campaign's final values for console comparison
        if (raw === rawCampaigns[0]) {
          const openRate = sent > 0 ? ((opened / sent) * 100).toFixed(2) : "0.00";
          console.log(`[buildCampaignRows] "${raw.name}" source=${stats._source || "analytics"} | sent=${sent} unique_opened=${opened} openRate=${openRate}%`);
        }

        // ── Opportunities fix ────────────────────────────────────────
        // Try every known field name the Instantly API uses across versions.
        const rawOpps = stats.total_opportunities  ??
                        stats.opportunities        ??
                        stats.num_opportunities    ??
                        stats.opportunity_count    ?? -1;
        const opps         = rawOpps >= 0 ? Number(rawOpps) : (replied > 0 ? Math.round(replied * 0.3) : 0);
        const opps_derived = rawOpps  < 0 && replied > 0; // true = estimate, false = real API value

        // ── Email Gap fix ────────────────────────────────────────────
        // Walk sequence steps for inter-step delay. Instantly v2 stores
        // this in sequences[0].steps[1].delay (days to wait before sending).
        let email_gap = null;
        if (Array.isArray(raw.sequences) && raw.sequences.length > 0) {
          const steps = raw.sequences[0]?.steps
                     || raw.sequences[0]?.sequence_steps
                     || [];
          // Use the delay of the 2nd step (first inter-step gap)
          if (steps.length > 1) {
            email_gap = steps[1]?.delay
                     ?? steps[1]?.wait_days
                     ?? steps[1]?.timing
                     ?? steps[1]?.days_delay
                     ?? null;
          }
        }
        // Additional field name fallbacks on the campaign object itself
        if (email_gap == null) {
          email_gap = raw.email_gap
                   ?? raw.sequence_gap
                   ?? raw.email_interval
                   ?? raw.gap_between_emails
                   ?? null;
        }
        if (email_gap != null) email_gap = Number(email_gap) || null;

        // ── Status ──────────────────────────────────────────────────
        const st = raw.status ?? raw.campaign_status ?? "";
        const status =
          st === 2 || /paus/i.test(String(st))         ? "Paused"    :
          st === 3 || /complet|done/i.test(String(st)) ? "Completed" : "Active";

        // ── Step count (for step distribution chart in DailyBreakdown) ───
        let step_count = 0;
        if (Array.isArray(raw.sequences) && raw.sequences.length > 0) {
          step_count = raw.sequences[0]?.steps?.length
                    || raw.sequences[0]?.sequence_steps?.length
                    || 0;
        }
        if (!step_count) step_count = raw.total_steps ?? raw.num_steps ?? 0;

        // ── Open rate sanity check ───────────────────────────────────
        const opens_exceed_sent = sent > 0 && opened > sent;

        return {
          id, name: raw.name || raw.campaign_name || "Untitled",
          email_sent: sent, email_opened: opened, reply_count: replied,
          click_count: clicked, bounce_count: bounced,
          opportunities: opps, opps_derived,
          status, email_gap, step_count, opens_exceed_sent,
        };
      });
    }

    // ── Simple debounce ────────────────────────────────────────────────
    function useDebounce(val, ms) {
      const [dVal, setDVal] = useState(val);
      useEffect(() => { const t = setTimeout(() => setDVal(val), ms); return () => clearTimeout(t); }, [val, ms]);
      return dVal;
    }

    // ══════════════════════════════════════════════════════════════════
    // INSTANTLY TAG CELL — compact badge + overflow popover
    // Shows 1 tag inline; if more, shows "+N" button that reveals the rest
    // ══════════════════════════════════════════════════════════════════
    function InstantlyTagCell({ tags, dark }) {
      const [open, setOpen] = React.useState(false);
      const ref = React.useRef(null);

      // Close popover when clicking outside
      React.useEffect(() => {
        if (!open) return;
        const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener("mousedown", handler);
        return () => document.removeEventListener("mousedown", handler);
      }, [open]);

      // Filter out any tags with no resolvable name to prevent blank badges
      const validTags = (tags || []).filter(t => t.name && String(t.name).trim() !== "");

      if (validTags.length === 0) {
        return <span className={`text-xs ${dark ? "text-gray-500" : "text-gray-400"}`}>—</span>;
      }

      const first  = validTags[0];
      const rest   = validTags.slice(1);
      const mkBadge = (t, key) => {
        const bg  = (t.color || "#6366f1") + "18";
        const txt = t.color || "#6366f1";
        const bdr = (t.color || "#6366f1") + "44";
        return (
          <span key={key}
            className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold whitespace-nowrap"
            style={{ background: bg, color: txt, border: `1px solid ${bdr}` }}>
            {t.name}
          </span>
        );
      };

      return (
        <div className="flex items-center gap-1.5 flex-wrap" ref={ref}>
          {mkBadge(first, first.id)}
          {rest.length > 0 && (
            <div className="relative">
              <button
                onClick={() => setOpen(v => !v)}
                className={`inline-flex items-center px-2 py-0.5 rounded-full text-xs font-bold transition-colors ${
                  dark ? "bg-gray-700 text-gray-300 hover:bg-gray-600 border border-gray-600"
                       : "bg-gray-100 text-gray-600 hover:bg-gray-200 border border-gray-200"}`}>
                +{rest.length}
              </button>
              {open && (
                <div className={`absolute z-50 left-0 top-7 min-w-max rounded-xl shadow-xl border p-3 space-y-1.5 ${
                  dark ? "bg-gray-800 border-gray-700" : "bg-white border-gray-200"}`}>
                  <p className={`text-xs font-semibold uppercase tracking-wider mb-2 ${dark ? "text-gray-400" : "text-gray-500"}`}>
                    All Email Groups
                  </p>
                  {validTags.map(t => mkBadge(t, t.id))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ══════════════════════════════════════════════════════════════════
    // MAIN APP
    // ══════════════════════════════════════════════════════════════════
    // EMAIL ACCOUNTS PAGE
    // Shows all sending mailboxes for the selected account with health
    // scores derived from open rate + bounce rate.
    // ══════════════════════════════════════════════════════════════════
    function EmailAccountsPage({ dark, connected, selectedAcc, card, input, th, td, startDate, endDate }) {
      const [data,        setData]      = useState(null);
      const [loading,     setLoading]   = useState(false);
      const [error,       setError]     = useState(null);
      const [sortCol,     setSortCol]   = useState("healthScore");
      const [sortDir,     setSortDir]   = useState("desc");
      const [showFilters, setShowFilters] = useState(false);

      // ── Advanced filter state ──────────────────────────────────────
      const [fSearch,      setFSearch]    = useState("");           // email text search
      const [fStatus,      setFStatus]    = useState("all");        // all | active | paused | error
      const [fHealth,      setFHealth]    = useState("all");        // all | green | yellow | red | unknown
      const [fDailyMin,    setFDailyMin]  = useState("");
      const [fDailyMax,    setFDailyMax]  = useState("");
      const [fScoreMin,    setFScoreMin]  = useState("");
      const [fScoreMax,    setFScoreMax]  = useState("");
      const [fSentMin,     setFSentMin]   = useState("");
      const [fSentMax,     setFSentMax]   = useState("");
      const [fWarmupMin,   setFWarmupMin] = useState("");
      const [fWarmupMax,   setFWarmupMax] = useState("");

      // ── Instantly tag + In Campaign filter ───────────────────────
      const [fInCampaign,   setFInCampaign]   = useState("all");   // all | yes | no
      const [fInstantlyTag, setFInstantlyTag] = useState("all");   // all | tag-id | __untagged__

      // ── Custom tag state ─────────────────────────────────────────
      const [fTagId,        setFTagId]        = useState("all");   // tag filter
      const [showTagPanel,  setShowTagPanel]  = useState(false);   // tag manager open
      const [newTagName,    setNewTagName]    = useState("");
      const [newTagColor,   setNewTagColor]   = useState("#6366f1");
      const [tagSaving,     setTagSaving]     = useState(false);
      const [tagEditId,     setTagEditId]     = useState(null);    // id being renamed
      const [tagEditName,   setTagEditName]   = useState("");
      // Checkbox selection for bulk-assign
      const [checkedEmails, setCheckedEmails] = useState(new Set());
      const toggleCheck = (email) => setCheckedEmails(prev => {
        const s = new Set(prev); s.has(email) ? s.delete(email) : s.add(email); return s;
      });

      // All custom tags come from data.customTags (returned by the server)
      const customTags = useMemo(() => (data?.customTags || []), [data]);
      // Instantly native tag definitions (from GET /api/v2/custom-tags)
      const instantlyTagDefs = useMemo(() => (data?.instantlyTagDefs || []), [data]);

      // Create a new tag
      const createTag = async () => {
        if (!newTagName.trim()) return;
        setTagSaving(true);
        try {
          await fetch("/api/account-custom-tags", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: newTagName.trim(), color: newTagColor }),
          });
          setNewTagName(""); await load();
        } finally { setTagSaving(false); }
      };

      // Delete a tag
      const deleteTag = async (id) => {
        await fetch(`/api/account-custom-tags/${id}`, { method: "DELETE" });
        await load();
      };

      // Rename a tag
      const renameTag = async (id) => {
        if (!tagEditName.trim()) return;
        await fetch(`/api/account-custom-tags/${id}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: tagEditName.trim() }),
        });
        setTagEditId(null); setTagEditName(""); await load();
      };

      // Assign checked accounts to a tag
      const assignToTag = async (tagId) => {
        if (checkedEmails.size === 0) return;
        await fetch(`/api/account-custom-tags/${tagId}/assign`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ emails: [...checkedEmails] }),
        });
        setCheckedEmails(new Set()); await load();
      };

      // Remove an email from a tag
      const unassignFromTag = async (tagId, email) => {
        await fetch(`/api/account-custom-tags/${tagId}/unassign`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ emails: [email] }),
        });
        await load();
      };

      const clearFilters = () => {
        setFSearch(""); setFStatus("all"); setFHealth("all"); setFTagId("all");
        setFInCampaign("all"); setFInstantlyTag("all");
        setFDailyMin(""); setFDailyMax("");
        setFScoreMin(""); setFScoreMax("");
        setFSentMin("");  setFSentMax("");
        setFWarmupMin(""); setFWarmupMax("");
      };

      // Count how many non-default filters are active for the badge
      const activeFilterCount = [
        fSearch !== "",
        fStatus !== "all",
        fHealth !== "all",
        fTagId !== "all",
        fInCampaign !== "all",
        fInstantlyTag !== "all",
        fDailyMin !== "" || fDailyMax !== "",
        fScoreMin !== "" || fScoreMax !== "",
        fSentMin  !== "" || fSentMax  !== "",
        fWarmupMin !== "" || fWarmupMax !== "",
      ].filter(Boolean).length;

      // ── Fetch ─────────────────────────────────────────────────────
      // `load` is called imperatively — keep it stable with useRef so the
      // effect below can use a primitive dep (selectedAcc?.id) rather than
      // an object ref, avoiding double-fetch on object identity changes.
      const loadRef = useRef(null);
      loadRef.current = async () => {
        if (!connected || !selectedAcc) return;
        setLoading(true);
        setError(null);
        try {
          let url = `/api/email-accounts?account_id=${encodeURIComponent(selectedAcc.id)}`;
          if (startDate && endDate) url += `&start_date=${encodeURIComponent(toISO(startDate))}&end_date=${encodeURIComponent(toISO(endDate))}`;
          const r = await fetch(url);
          const ct = r.headers.get("content-type") || "";
          if (!ct.includes("application/json")) throw new Error("Server returned HTML — restart app.js");
          const json = await r.json();
          if (json.error) throw new Error(json.error);
          setData(json);
        } catch (e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      };
      const load = useCallback(() => loadRef.current?.(), []);

      // Re-fetch whenever account, connection, or date range changes.
      // Using selectedAcc?.id (primitive) avoids spurious re-runs from
      // object identity changes when the same account is re-selected.
      useEffect(() => {
        if (connected && selectedAcc) load();
      }, [selectedAcc?.id, connected, startDate, endDate]); // eslint-disable-line react-hooks/exhaustive-deps

      // ── Derive rows ───────────────────────────────────────────────
      // The Instantly /api/v2/accounts endpoint returns per-mailbox fields:
      //   email, status (1=active,2=paused), health_score (0-100),
      //   daily_limit, emails_sent_count (today's sends),
      //   warmup_email_count, is_warming_up / warmup_status
      //
      // It does NOT return open/reply/bounce rates per mailbox — those are
      // campaign-level metrics. We show what the API actually provides.
      const rows = useMemo(() => {
        if (!data) return [];
        const emailAccounts = Array.isArray(data.emailAccounts) ? data.emailAccounts : [];
        if (emailAccounts.length === 0) return [];

        return emailAccounts.map((ea, idx) => {
          // ── Identity ──────────────────────────────────────────────
          const email = ea.email || ea.address || ea.from_address || `Mailbox ${idx + 1}`;

          // ── Status ────────────────────────────────────────────────
          // Instantly status: 1=active, 2=paused, -1=error/banned, etc.
          const statusCode  = ea.status ?? ea.account_status ?? 1;
          const statusLabel =
            statusCode === 1    ? "active"   :
            statusCode === 2    ? "paused"   :
            statusCode === -1   ? "error"    :
            statusCode === 0    ? "inactive" :
            String(statusCode);

          // ── Warmup ───────────────────────────────────────────────
          // API may use is_warming_up (bool) or warmup_status string
          const isWarmingUp   = ea.is_warming_up
                             ?? (ea.warmup_status === "active" || ea.warmup_status === "warming")
                             ?? false;
          // Today's warmup email count
          const warmupCount   = ea.warmup_email_count
                             ?? ea.warmup_emails_count
                             ?? ea.warmup_emails_sent
                             ?? ea.stat_warmup_email_count
                             ?? ea.warmup_count
                             ?? null;

          // ── Sending metrics ──────────────────────────────────────
          const dailyLimit  = ea.daily_limit ?? ea.sending_limit ?? ea.limit ?? null;
          const sentTotal   = ea.emails_sent_count ?? ea.sent_count ?? ea.total_sent ?? null;
          const sentToday   = ea.sent_today ?? ea.emails_sent_today ?? ea.sends_today ?? null;

          // ── Health score ─────────────────────────────────────────
          // CONFIRMED: Instantly stores this as `stat_warmup_score` (0-100 int).
          // Backend normalizes it to `health_score`; also check raw field as fallback.
          const healthScore = ea.health_score ?? ea.stat_warmup_score ?? ea.score ?? null;

          // Derive green/yellow/red from health_score when available;
          // otherwise fall back to active = green, paused = unknown.
          let health;
          if (healthScore !== null) {
            health = healthScore >= 80 ? "green" : healthScore >= 50 ? "yellow" : "red";
          } else {
            health = statusLabel === "active" ? "green" : "unknown";
          }

          // ── Date added ───────────────────────────────────────────
          // Try every plausible field name Instantly may use for account creation date
          const dateAddedRaw =
            ea.timestamp_created ?? ea.created_at ?? ea.date_created ??
            ea.creation_date     ?? ea.createdAt  ?? ea.timestamp     ?? null;
          const dateAdded = dateAddedRaw
            ? new Date(dateAddedRaw)
            : null;
          const dateAddedDisplay = dateAdded && !isNaN(dateAdded)
            ? dateAdded.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" })
            : "—";
          const dateAddedSort = dateAdded && !isNaN(dateAdded) ? dateAdded.getTime() : 0;

          // ── Custom Tags (local) ──────────────────────────────────────
          const accountCustomTags = Array.isArray(ea.customTags) ? ea.customTags : [];

          // ── Instantly Tags (native — from email_tag_list on campaigns) ──
          const accountInstantlyTags = Array.isArray(ea.instantlyTags) ? ea.instantlyTags : [];

          // ── In Campaign ──────────────────────────────────────────────
          // Backend stamps true only if account is in an ACTIVE (status=1) campaign.
          const inCampaign = ea.in_campaign === true;

          return {
            id:             ea.id || ea.account_id || `ea-${idx}`,
            email,
            statusCode,     statusLabel,
            isWarmingUp,    warmupCount,
            dailyLimit,     sentTotal,   sentToday,
            healthScore,    health,
            dateAdded,      dateAddedDisplay, dateAddedSort,
            customTags:     accountCustomTags,
            instantlyTags:  accountInstantlyTags,
            inCampaign,
            _raw: ea,
          };
        });
      }, [data]);

      // ── Sort + filter ─────────────────────────────────────────────
      const visible = useMemo(() => {
        const inRange = (val, min, max) => {
          if (val === null || val === undefined) return min === "" && max === ""; // show nulls only if no range set
          const n = Number(val);
          if (min !== "" && n < Number(min)) return false;
          if (max !== "" && n > Number(max)) return false;
          return true;
        };
        let out = [...rows];
        // text search
        if (fSearch) out = out.filter(r => r.email.toLowerCase().includes(fSearch.toLowerCase()));
        // status filter
        if (fStatus !== "all") out = out.filter(r => r.statusLabel === fStatus);
        // health category filter
        if (fHealth !== "all") out = out.filter(r => r.health === fHealth);
        // custom tag filter (local tags)
        if (fTagId === "__untagged__") {
          out = out.filter(r => !r.customTags || r.customTags.length === 0);
        } else if (fTagId !== "all") {
          out = out.filter(r => r.customTags && r.customTags.some(t => t.id === fTagId));
        }
        // in campaign filter
        if (fInCampaign === "yes") out = out.filter(r => r.inCampaign);
        if (fInCampaign === "no")  out = out.filter(r => !r.inCampaign);
        // Instantly email-group/tag filter
        if (fInstantlyTag === "__untagged__") {
          out = out.filter(r => !r.instantlyTags || r.instantlyTags.length === 0);
        } else if (fInstantlyTag !== "all") {
          out = out.filter(r => r.instantlyTags && r.instantlyTags.some(t => t.id === fInstantlyTag));
        }
        // numeric range filters
        if (fDailyMin !== "" || fDailyMax !== "")   out = out.filter(r => inRange(r.dailyLimit,   fDailyMin, fDailyMax));
        if (fScoreMin !== "" || fScoreMax !== "")   out = out.filter(r => inRange(r.healthScore,  fScoreMin, fScoreMax));
        if (fSentMin  !== "" || fSentMax  !== "")   out = out.filter(r => inRange(r.sentTotal,    fSentMin,  fSentMax));
        if (fWarmupMin !== "" || fWarmupMax !== "") out = out.filter(r => inRange(r.warmupCount,  fWarmupMin, fWarmupMax));
        // sort
        out.sort((a, b) => {
          const av = a[sortCol] ?? -1, bv = b[sortCol] ?? -1;
          const v = typeof av === "string" ? av.localeCompare(bv) : av - bv;
          return sortDir === "asc" ? v : -v;
        });
        return out;
      }, [rows, fSearch, fStatus, fHealth, fTagId, fInCampaign, fInstantlyTag, fDailyMin, fDailyMax, fScoreMin, fScoreMax, fSentMin, fSentMax, fWarmupMin, fWarmupMax, sortCol, sortDir]);

      // ── Custom tag summary ────────────────────────────────────────
      // Built from locally-managed tags (account-tags.json)
      const tagSummary = useMemo(() => {
        return customTags.map(t => ({
          ...t,
          count: t.emails ? t.emails.length : 0,
        })).sort((a, b) => b.count - a.count);
      }, [customTags]);

      // ── Accounts-added-by-date summary ───────────────────────────
      // Groups ALL accounts (not just visible) by the date they were added to Instantly.
      const dateAddedSummary = useMemo(() => {
        const map = {};
        rows.forEach(r => {
          const key = r.dateAdded && !isNaN(r.dateAdded)
            ? r.dateAdded.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" })
            : "Unknown";
          const ts = r.dateAdded && !isNaN(r.dateAdded) ? r.dateAdded.getTime() : 0;
          if (!map[key]) map[key] = { date: key, ts, count: 0, totalCapacity: 0, inCampaignCount: 0, statuses: {} };
          map[key].count++;
          if (r.dailyLimit != null) map[key].totalCapacity += r.dailyLimit;
          if (r.inCampaign) map[key].inCampaignCount++;
          const s = r.statusLabel || "unknown";
          map[key].statuses[s] = (map[key].statuses[s] || 0) + 1;
        });
        return Object.values(map).sort((a, b) => a.ts - b.ts);
      }, [rows]);

      // ── Toggle sort ───────────────────────────────────────────────
      const toggleSort = col => {
        if (sortCol === col) setSortDir(d => d === "asc" ? "desc" : "asc");
        else { setSortCol(col); setSortDir("desc"); }
      };

      // ── Health badge helper ───────────────────────────────────────
      const HealthBadge = ({ health }) => {
        const map = {
          green:   { dot: "bg-emerald-500", text: "text-emerald-700", bg: "bg-emerald-50 border-emerald-200", label: "Healthy" },
          yellow:  { dot: "bg-amber-400",   text: "text-amber-700",   bg: "bg-amber-50 border-amber-200",    label: "Warning" },
          red:     { dot: "bg-rose-500",    text: "text-rose-700",    bg: "bg-rose-50 border-rose-200",      label: "Critical" },
          unknown: { dot: "bg-gray-400",    text: "text-gray-600",    bg: "bg-gray-50 border-gray-200",      label: "Unknown" },
        };
        const s = map[health] || map.unknown;
        return (
          <span className={`inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-semibold border ${s.bg} ${s.text}`}>
            <span className={`w-1.5 h-1.5 rounded-full ${s.dot}`} />
            {s.label}
          </span>
        );
      };

      // ── Th helper ─────────────────────────────────────────────────
      const SortTh = ({ col, label, right = false }) => (
        <th className={`px-4 py-3 text-xs font-semibold uppercase tracking-wider cursor-pointer select-none ${th} ${right ? "text-right" : "text-left"}`}
          onClick={() => toggleSort(col)}>
          <span className="inline-flex items-center gap-1">
            {label}
            {sortCol === col
              ? <Icon name={sortDir === "asc" ? "chevUp" : "chevDown"} size={11} />
              : <Icon name="arrowUD" size={10} className="opacity-30" />}
          </span>
        </th>
      );

      const txtSub = dark ? "text-gray-400" : "text-gray-500";
      const borderLine = dark ? "border-gray-700" : "border-gray-200";

      // ── No account connected ──────────────────────────────────────
      if (!connected || !selectedAcc) {
        return (
          <div className="max-w-screen-2xl mx-auto px-4 sm:px-6 py-6">
            <div className={`rounded-2xl border p-10 text-center ${card}`}>
              <Icon name="inbox" size={32} className={`mx-auto mb-3 ${txtSub}`} />
              <p className={`font-semibold ${dark ? "text-white" : "text-gray-800"}`}>No account selected</p>
              <p className={`text-sm mt-1 ${txtSub}`}>Select an account from the top bar to view email accounts.</p>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-screen-2xl mx-auto px-4 sm:px-6 py-6 space-y-5">

          {/* ── Page header ── */}
          <div className="flex items-center justify-between flex-wrap gap-3">
            <div>
              <h1 className={`text-xl font-bold ${dark ? "text-white" : "text-gray-900"}`}>
                Email Accounts
              </h1>
              <p className={`text-sm mt-0.5 ${txtSub}`}>
                Sending mailboxes for <span className="font-semibold">{selectedAcc.name}</span>
                {visible.length !== rows.length && <span className={`ml-2 text-xs font-normal ${dark ? "text-indigo-400" : "text-indigo-600"}`}>({visible.length} of {rows.length} shown)</span>}
              </p>
            </div>
            <div className="flex items-center gap-2 flex-wrap">
              {startDate && endDate && (
                <span className={`text-xs px-2.5 py-1.5 rounded-lg border ${dark ? "border-indigo-800 bg-indigo-900/40 text-indigo-300" : "border-indigo-200 bg-indigo-50 text-indigo-600"}`}>
                  <Icon name="filter" size={11} className="inline mr-1" />
                  {toISO(startDate)} → {toISO(endDate)}
                </span>
              )}
              {/* Advanced Filters toggle */}
              <button onClick={() => setShowFilters(v => !v)}
                className={`relative flex items-center gap-1.5 px-3 py-1.5 rounded-lg border text-xs font-semibold transition-colors ${showFilters
                  ? "bg-indigo-600 border-indigo-600 text-white"
                  : (dark ? "border-gray-600 bg-gray-800 text-gray-300 hover:bg-gray-700" : "border-gray-200 bg-white text-gray-600 hover:bg-gray-50")}`}>
                <Icon name="filter" size={12} />
                Filters
                {activeFilterCount > 0 && (
                  <span className="absolute -top-1.5 -right-1.5 flex items-center justify-center w-4 h-4 rounded-full bg-rose-500 text-white text-[10px] font-bold leading-none">
                    {activeFilterCount}
                  </span>
                )}
              </button>
              {activeFilterCount > 0 && (
                <button onClick={clearFilters}
                  className={`flex items-center gap-1 px-2.5 py-1.5 rounded-lg border text-xs font-semibold text-rose-600 transition-colors ${dark ? "border-rose-800 bg-rose-950/40 hover:bg-rose-900/40" : "border-rose-200 bg-rose-50 hover:bg-rose-100"}`}>
                  <Icon name="x" size={11} />
                  Clear {activeFilterCount}
                </button>
              )}
              <button onClick={load} disabled={loading}
                className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg border text-xs font-semibold transition-colors ${dark ? "border-gray-600 bg-gray-800 text-gray-300 hover:bg-gray-700" : "border-gray-200 bg-white text-gray-600 hover:bg-gray-50"} disabled:opacity-50`}>
                <Icon name="refresh" size={12} className={loading ? "animate-spin" : ""} />
                Refresh
              </button>
            </div>
          </div>

          {/* ── Advanced Filter Panel ────────────────────────────────── */}
          {showFilters && (
            <div className={`rounded-2xl border p-5 space-y-5 ${card}`}>
              {/* Row 1: Search + Status + Health */}
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                {/* Text search */}
                <div>
                  <label className={`block text-xs font-semibold mb-1.5 ${dark ? "text-gray-300" : "text-gray-600"}`}>Search Email</label>
                  <div className="relative">
                    <Icon name="mail" size={13} className={`absolute left-2.5 top-1/2 -translate-y-1/2 ${txtSub}`} />
                    <input type="text" value={fSearch} onChange={e => setFSearch(e.target.value)}
                      placeholder="filter by email address…"
                      className={`w-full pl-7 pr-3 py-2 text-xs rounded-lg border ${input} outline-none`} />
                  </div>
                </div>

                {/* Status */}
                <div>
                  <label className={`block text-xs font-semibold mb-1.5 ${dark ? "text-gray-300" : "text-gray-600"}`}>Account Status</label>
                  <div className={`flex rounded-lg border overflow-hidden text-xs font-semibold ${dark ? "border-gray-600" : "border-gray-200"}`}>
                    {[["all","All"],["active","Active"],["paused","Paused"],["error","Error"]].map(([v,l]) => (
                      <button key={v} onClick={() => setFStatus(v)}
                        className={`flex-1 py-2 transition-colors ${fStatus === v
                          ? "bg-indigo-600 text-white"

                  </div>
                </div>

                {/* Health category */}

                  <div className={`flex rounded-lg border overflow-hidden text-xs font-semibold ${dark ? "border-gray-600" : "border-gray-200"}`}>
                    {[["all","All"],["green","Healthy"],["yellow","Warn"],["red","Critical"],["unknown","N/A"]].map(([v,l]) => (
                      <button key={v} onClick={() => setFHealth(v)}
                        className={`flex-1 py-2 transition-colors ${fHealth === v
                          ? (v==="green" ? "bg-emerald-600 text-white" : v==="yellow" ? "bg-amber-500 text-white" : v==="red" ? "bg-rose-600 text-white" : "bg-indigo-600 text-white")
                          : (dark ? "bg-gray-800 text-gray-400 hover:bg-gray-700" : "bg-white text-gray-500 hover:bg-gray-50")}`}>{l}</button>
                    ))}
                  </div>
                </div>

                {/* In Campaign filter */}
                <div>
                  <label className={`block text-xs font-semibold mb-1.5 ${dark ? "text-gray-300" : "text-gray-600"}`}>In Campaign</label>
                  <div className={`flex rounded-lg border overflow-hidden text-xs font-semibold ${dark ? "border-gray-600" : "border-gray-200"}`}>
                    {[["all","All"],["yes","✓ Yes"],["no","No"]].map(([v,l]) => (
                      <button key={v} onClick={() => setFInCampaign(v)}
                        className={`flex-1 py-2 transition-colors ${fInCampaign === v
                          ? (v==="yes" ? "bg-emerald-600 text-white" : v==="no" ? "bg-gray-500 text-white" : "bg-indigo-600 text-white")
                          : (dark ? "bg-gray-800 text-gray-400 hover:bg-gray-700" : "bg-white text-gray-500 hover:bg-gray-50")}`}>{l}</button>
                    ))}
                  </div>
                </div>

                {/* Instantly Email Group filter */}
                {instantlyTagDefs.length > 0 && (
                  <div>
                    <label className={`block text-xs font-semibold mb-1.5 ${dark ? "text-gray-300" : "text-gray-600"}`}>Email Group (Instantly Tag)</label>
                    <select value={fInstantlyTag} onChange={e => setFInstantlyTag(e.target.value)}
                      className={`w-full py-2 px-3 rounded-lg border text-xs font-semibold ${input}`}>
                      <option value="all">All Groups</option>
                      <option value="__untagged__">No Group</option>
                      {instantlyTagDefs.map(t => (
                        <option key={t.id} value={t.id}>📌 {t.name}</option>
                      ))}
                    </select>
                  </div>
                )}

                {/* Custom tag filter */}
                {customTags.length > 0 && (
                  <div>
                    <label className={`block text-xs font-semibold mb-1.5 ${dark ? "text-gray-300" : "text-gray-600"}`}>Custom Tag</label>
                    <select value={fTagId} onChange={e => setFTagId(e.target.value)}
                      className={`w-full py-2 px-3 rounded-lg border text-xs font-semibold ${input}`}>
                      <option value="all">All Tags</option>
                      <option value="__untagged__">Untagged</option>
                      {customTags.map(t => (
                        <option key={t.id} value={t.id}>🏷️ {t.name} ({t.emails?.length || 0})</option>
                      ))}
                    </select>
                  </div>
                )}
              </div>

              {/* Row 2: Numeric range filters */}
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                {/* Daily Limit */}
                <div>
                  <label className={`block text-xs font-semibold mb-1.5 ${dark ? "text-gray-300" : "text-gray-600"}`}>Daily Limit</label>
                  <div className="flex gap-1.5 items-center">
                    <input type="number" min="0" value={fDailyMin} onChange={e => setFDailyMin(e.target.value)}
                      placeholder="Min" className={`w-full py-2 px-2 text-xs rounded-lg border ${input} outline-none`} />
                    <span className={`text-xs ${txtSub}`}>–</span>
                    <input type="number" min="0" value={fDailyMax} onChange={e => setFDailyMax(e.target.value)}
                      placeholder="Max" className={`w-full py-2 px-2 text-xs rounded-lg border ${input} outline-none`} />
                  </div>
                </div>

                {/* Health Score */}
                <div>
                  <label className={`block text-xs font-semibold mb-1.5 ${dark ? "text-gray-300" : "text-gray-600"}`}>Health Score (0–100)</label>
                  <div className="flex gap-1.5 items-center">
                    <input type="number" min="0" max="100" value={fScoreMin} onChange={e => setFScoreMin(e.target.value)}
                      placeholder="Min" className={`w-full py-2 px-2 text-xs rounded-lg border ${input} outline-none`} />
                    <span className={`text-xs ${txtSub}`}>–</span>
                    <input type="number" min="0" max="100" value={fScoreMax} onChange={e => setFScoreMax(e.target.value)}
                      placeholder="Max" className={`w-full py-2 px-2 text-xs rounded-lg border ${input} outline-none`} />
                  </div>
                </div>

                {/* Emails Sent */}
                <div>
                  <label className={`block text-xs font-semibold mb-1.5 ${dark ? "text-gray-300" : "text-gray-600"}`}>Emails Sent</label>
                  <div className="flex gap-1.5 items-center">
                    <input type="number" min="0" value={fSentMin} onChange={e => setFSentMin(e.target.value)}
                      placeholder="Min" className={`w-full py-2 px-2 text-xs rounded-lg border ${input} outline-none`} />
                    <span className={`text-xs ${txtSub}`}>–</span>
                    <input type="number" min="0" value={fSentMax} onChange={e => setFSentMax(e.target.value)}
                      placeholder="Max" className={`w-full py-2 px-2 text-xs rounded-lg border ${input} outline-none`} />
                  </div>
                </div>

                {/* Warmup Emails */}
                <div>
                  <label className={`block text-xs font-semibold mb-1.5 ${dark ? "text-gray-300" : "text-gray-600"}`}>Warmup Emails</label>
                  <div className="flex gap-1.5 items-center">
                    <input type="number" min="0" value={fWarmupMin} onChange={e => setFWarmupMin(e.target.value)}
                      placeholder="Min" className={`w-full py-2 px-2 text-xs rounded-lg border ${input} outline-none`} />
                    <span className={`text-xs ${txtSub}`}>–</span>
                    <input type="number" min="0" value={fWarmupMax} onChange={e => setFWarmupMax(e.target.value)}
                      placeholder="Max" className={`w-full py-2 px-2 text-xs rounded-lg border ${input} outline-none`} />
                  </div>
                </div>
              </div>

              {/* Footer: summary + clear */}
              <div className={`flex items-center justify-between pt-3 border-t ${borderLine}`}>
                <p className={`text-xs ${txtSub}`}>
                  Showing <span className={`font-semibold ${dark ? "text-white" : "text-gray-900"}`}>{visible.length}</span> of <span className={`font-semibold ${dark ? "text-white" : "text-gray-900"}`}>{rows.length}</span> accounts
                </p>
                <button onClick={clearFilters} disabled={activeFilterCount === 0}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors disabled:opacity-40 ${dark ? "bg-gray-700 hover:bg-gray-600 text-gray-300" : "bg-gray-100 hover:bg-gray-200 text-gray-600"}`}>
                  <Icon name="x" size={11} />
                  Clear All Filters
                </button>
              </div>
            </div>
          )}

          {/* ── Health score legend ── */}
          <div className={`rounded-xl border p-4 ${card}`}>
            <div className="flex items-start gap-2 mb-3">
              <Icon name="shield" size={15} className="text-indigo-500 shrink-0 mt-0.5" />
              <p className={`text-xs font-semibold ${dark ? "text-gray-200" : "text-gray-800"}`}>
                Health Score Logic
              </p>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
              {[
                ["green",  "Healthy",  "Score ≥ 80 (from Instantly health_score field)", "bg-emerald-50 border-emerald-200 text-emerald-700"],
                ["yellow", "Warning",  "Score 50–79", "bg-amber-50 border-amber-200 text-amber-700"],
                ["red",    "Critical", "Score < 50",  "bg-rose-50 border-rose-200 text-rose-700"],
              ].map(([, label, desc, cls]) => (
                <div key={label} className={`rounded-lg border px-3 py-2 ${cls}`}>
                  <p className="font-semibold mb-0.5">{label}</p>
                  <p className="opacity-80">{desc}</p>
                </div>
              ))}
            </div>
          </div>

          {/* ── Error ── */}
          {error && (
            <div className="rounded-xl border border-rose-300 bg-rose-50 px-4 py-3 text-sm text-rose-700 flex items-center gap-2">
              <Icon name="alert" size={14} className="shrink-0" />
              {error}
            </div>
          )}

          {/* ── Loading skeleton ── */}
          {loading && (
            <div className={`rounded-2xl border animate-pulse ${card}`}>
              <div className="p-5 space-y-3">
                {[1,2,3,4].map(i => <div key={i} className={`h-10 rounded-lg ${dark ? "bg-gray-700" : "bg-gray-100"}`} />)}
              </div>
            </div>
          )}

          {/* ── No data ── */}
          {!loading && !error && data && rows.length === 0 && (
            <div className={`rounded-2xl border p-10 text-center ${card}`}>
              <Icon name="inbox" size={28} className={`mx-auto mb-3 ${txtSub}`} />
              <p className={`font-semibold ${dark ? "text-white" : "text-gray-800"}`}>No email accounts found</p>
              <p className={`text-sm mt-1 ${txtSub}`}>No sending data available for this account.</p>
            </div>
          )}

          {/* ── Summary cards ── */}
          {!loading && !error && rows.length > 0 && (() => {
            const total      = rows.length;
            const healthy    = rows.filter(r => r.health === "green").length;
            const warning    = rows.filter(r => r.health === "yellow").length;
            const critical   = rows.filter(r => r.health === "red").length;
            const warming    = rows.filter(r => r.isWarmingUp).length;
            const avgScore   = (() => {
              const withScore = rows.filter(r => r.healthScore !== null);
              return withScore.length > 0
                ? Math.round(withScore.reduce((s, r) => s + r.healthScore, 0) / withScore.length)
                : null;
            })();
            return (
              <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4">
                {[
                  ["Total Accounts", total,                                            "text-indigo-500",  "inbox"],
                  ["Healthy",        healthy,                                          "text-emerald-500", "check"],
                  ["Warning",        warning,                                          "text-amber-500",   "alert"],
                  ["Critical",       critical,                                         "text-rose-500",    "bounce"],
                  ["Avg Health Score", avgScore !== null ? avgScore + "%" : "—",       avgScore !== null ? (avgScore >= 80 ? "text-emerald-500" : avgScore >= 50 ? "text-amber-500" : "text-rose-500") : "text-gray-400", "shield"],
                ].map(([label, val, color, icon]) => (
                  <div key={label} className={`rounded-2xl border p-4 ${card}`}>
                    <div className="flex items-center justify-between mb-2">
                      <p className={`text-xs font-medium uppercase tracking-wider ${txtSub}`}>{label}</p>
                      <Icon name={icon} size={14} className={color} />
                    </div>
                    <p className={`text-3xl font-bold tabular-nums ${color}`}>{val}</p>
                    {label === "Total Accounts" && warming > 0 && (
                      <p className={`text-xs mt-1 ${txtSub}`}>🔥 {warming} warming up</p>
                    )}
                  </div>
                ))}
              </div>
            );
          })()}

          {/* ── Accounts Added by Date Summary ── */}
          {!loading && !error && dateAddedSummary.length > 0 && (
            <div className={`rounded-2xl border overflow-hidden ${card}`}>
              <div className={`px-5 py-3 flex items-center justify-between border-b ${borderLine}`}>
                <div className="flex items-center gap-2">
                  <span className="text-sm">📅</span>
                  <span className={`text-sm font-semibold ${dark ? "text-white" : "text-gray-800"}`}>Accounts Added by Date</span>

                    <tr className={`border-b ${borderLine} ${dark ? "bg-gray-800/60" : "bg-gray-50"}`}>

                      <th className={`px-5 py-2.5 text-center text-xs font-semibold uppercase tracking-wider ${th}`}>Emails Added</th>
                      <th className={`px-5 py-2.5 text-center text-xs font-semibold uppercase tracking-wider ${th}`}>Total Capacity</th>
